# SUPER (DinoHub/super_planner, after HKU MaRS SUPER), a local planner on
# ROG-Map, as a bring-your-own component. Its image is the local-planner
# adaptor scaffold's runtime bundle (adaptor_scaffold/adaptors/super), built
# from super_planner@development with the scaffold manifest's external topics
# set to the M&S stack contract (sim truth /ground_truth/odom, ArduPilot,
# /Drone1/mavros): dhdevspace/auto_mns:super_runtime-ms.1 (local build).
#
#   mns-stacks generate scenarios/planner-xfs-ardupilot --component components/super
schema: mns.component.v1
id: super
name: SUPER local planner
version: 0.1.0
kind: planner

images:
  super: dhdevspace/auto_mns:super_runtime-ms.1

# Sim truth for its state, the registered cloud for ROG-Map, both raw and in
# one frame (the cloud in odom). The cloud's name is baked into the
# scaffold's launch file (remap mode), so the platform publishes it so.
consumes:
- ground_truth
- {role: point_cloud, as: /Copter1/registered_point_cloud}
- clock
- autopilot

produces:
  record: [/Drone1/mavros/setpoint_raw/local, /planner_state, /planner_result]
# SUPER starts only once airborne (files/wait_airborne.py); a goal mission
# waits for its state machine before sending the first goal.
ready: {after_takeoff: [/planner_state], timeout_s: 180}

requires:
  autopilot: [ardupilot]
  point_cloud_frame: odom
  bridge_mavros: true

files:
  # SUPER's planner-owned config (click.yaml), loaded by name from its folder.
  config: files/config
  gate: files/wait_airborne.py

services:
  planner:
    image: super
    run_as: image
    environment:
      R: /workspace/generated/super_planner
    command: >
      bash -lc "
      set +u &&
      source /opt/ros/humble/setup.bash &&
      python3 /cfg/component/gate &&
      source $R/.planner_ws/ros_ws/install/setup.sh &&
      source $R/adaptor_ws/install/setup.sh &&
      export AMENT_PREFIX_PATH=$R/adaptor_ws/install/super_planner_adaptor:$R/adaptor_ws/install:$AMENT_PREFIX_PATH &&
      export PYTHONPATH=$R/adaptor_ws/install/super_planner_adaptor/lib/python3.10/site-packages:$R/adaptor_ws/src/super_planner_adaptor:$PYTHONPATH &&
      export PATH=$R/adaptor_ws/install/super_planner_adaptor/lib/super_planner_adaptor:$PATH &&
      exec ros2 launch super_planner_adaptor super_planner_adaptor.launch.py
      use_planner:=true
      runtime_params_file:=/cfg/component/config/click.yaml
      use_rviz:=false
      autopilot:=ardupilot
      vehicle_output_topic:=/$MNS_VEHICLE/mavros/setpoint_raw/local
      "
