fsm:
  click_goal_en: true
  click_goal_topic: "/goal" # change this
  click_height_en: false
  click_height: 1.5
  click_yaw_en: true
  replan_rate: 15.0
  state_rate: 10.0
  cmd_topic: "/planning/pos_cmd" # change this
  mpc_cmd_topic: "/planning_cmd/poly_traj" # change this
  timer_en: true
  kx: [5.7, 5.7, 4.2] # PID gains for position, must have 3 values # change this
  kv: [3.4, 3.4, 4.0] # PID gains for velocity, must have 3 values # change this
  mav_pos_cmd_pub_en: true # publish position target # change this
  mav_att_cmd_pub_en: false # publish attitude target command # change this
  mav_pos_cmd_topic: "/px4vision_custom_0/mavros/setpoint_raw/local" # mavros position target topic # change this
  mav_att_cmd_topic: "/mavros/setpoint_raw/attitude" # mavros attitude target topic # change this
  planner_result_topic: "/planner_result"
  machine_state_topic: "/planner_state"
  exec_action_topic: "/enable_navigation" # bool topic to enable drone to move
  hold_pos_height: 1.5

super_planner:
  backup_traj_en: true
  detailed_log_en: true   # DEBUG (upstream: false)
  visualization_en: true
  use_fov_cut: false
  print_log: true   # DEBUG (upstream: false)
  visual_process: false
  frontend_in_known_free: false
  goal_yaw_en: true
  goal_vel_en: false
  corridor_bound_dis: 1.0
  corridor_line_max_length: 1.2
  safe_corridor_line_max_length: 5.0
  iris_iter_num: 2
  obs_skip_num: 2
  # 3.0 (upstream: 0.1), DEBUG: on the XFS course every replan takes 2.5 to
  # 9 s (wall) at low CPU, mostly blocked, so at 0.1 s SUPER never moves.
  # Raised only to watch it fly; not a fix. See components/super/README.md.
  replan_forward_dt: 3.0
  planning_horizon: 7.0
  sensing_horizon: -1
  receding_dis: 4.0
  robot_r: 0.2
  yaw_dot_max: 3.0
  # Yaw mode: 1 heading to velocity, 2 heading to goal
  yaw_mode: 1
  mpc_horizon: 15
  near_goal_dist: 0.1 # distance from goal to be considered reached


traj_opt:
  switch:
    save_log_en: false
    print_optimizer_log: false

  boundary:
    max_vel: 3.0 #5.0 # change this
    max_acc: 6.0 #5.0 # change this
    max_jerk: 120.0
    max_omg: 2.5
    max_acc_thr: 20.0
    min_acc_thr: 6.0
    penna_margin: 0.05

  exp_traj:
    # 1 for xi 2 for pos
    pos_constraint_type: 1
    energy_cost_type: 4
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    scale_factor: 1.0
    integral_reso: 15
    smooth_eps: 0.01
    penna_t: 12000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: -5.0e+5
    penna_attract: 1.0e+3
    penna_omg:  5.0e+5
    penna_thr: 1.0e+5

  backup_traj:
    uniform_time_en: true
    pos_constraint_type: 1
    piece_num: 2
    energy_cost_type: 4
    block_energy_cost: true
    opt_accuracy: 1.0e-6
    scale_factor: 1.0
    integral_reso: 12
    smooth_eps: 0.01
    penna_t: 1200.0
    penna_ts: 1.0e+5
    penna_pos: 1.0e+6
    penna_vel: 1.0e+5
    penna_acc: 1.0e+5
    penna_jerk: -1.0e+5
    penna_omg: 1.0e+5
    penna_thr: 1.0e+5

  flatness:
    mass: 1.64
    dh: 0.35
    dv: 0.35
    cp: 0.001
    v_eps: 0.0001
    grav: 9.81


astar:
  map_voxel_num: [ 1000, 1000, 300 ] # [ 500, 500, 100 ]
  visual_process: true # false
  allow_diag: true
  # 0 DIAG; 1 MANHATTAN; 2 EUCLIDEAN
  heu_type: 2
  debug_visualization_en: false


rog_map:
  # 0.2 (upstream: 0.1): at 0.1 m the 51 x 51 x 16 m outdoor window held
  # 21 GB and every replan overran replan_forward_dt (1 to 2.6 s against
  # 0.1 s), so SUPER never left the ground on the XFS course.
  resolution: 0.2 # change this
  inflation_resolution: 0.2
  inflation_step: 2
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [ 50,50,15 ] # change this
  # If the map rolling is disable, the map origin [m] should be set.
  fix_map_origin: [ 0,0,1.5 ]
  frontier_extraction_en: false

  # Virtual ceil and ground
  virtual_ceil_height: 100.0 # 4.5 # change this
  # -2.2 (upstream: -0.1): heights here are in the odometry frame anchored at
  # the spawn, 2.3 m above the yard ground (about -2.4). Below this ROG-Map
  # stops updating the map at all ("Odom below virtual ground").
  virtual_ground_height: -2.2

  load_pcd_en: false

  map_sliding:
    enable: true #false
    # The minimum distance [m] to slide the map.
    threshold: 3 #0.3

  esdf:
    enable: false
    resolution: 0.1
    # The range of esdf around the odom [m].
    local_update_box: [ 5,5,3 ]

  # If [enable = true], the ROG-Map will actively take ros topic as input.
  #  else user should call function [updateMap] to update the map.
  ros_callback:
    enable: true
    cloud_topic: "/px4vision_custom_0/lidar" #"/cloud_registered" # change this
    odom_topic: "/px4vision_custom_0/mavros/local_position/odom" #"/odom" #"/lidar_slam/odom" # change this
    # odom_topic: "/px4vision_custom_0/odometry"
    odom_timeout: 2.0


  visualization:
    enable: false
    # when enabled, use rqt_reconfigure to change the visualization parameters.
    use_dynamic_reconfigure: false
    # The rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    time_rate: 2
    # The frame rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    frame_rate: 0
    # visualization range along the odom [m].
    range: [ 15, 15,4 ]
    frame_id: "map"
    pub_unknown_map_en: false

  # Intensity filter for input point cloud. If the point intensity is less than this value,
  # it will be ignored (to avoid noise like dusk).
  intensity_thresh: -10
  # The temporal downsample rate for input point cloud.
  #  e.g. if set to k, the point cloud will be downsampled to 1/k.
  point_filt_num: 2

  # Probabilistc update
  raycasting:
    # if disable, the map will only maintain occupied information, and all other grid
    # will be considered as unknown.
    enable: false
    batch_update_size: 1
    local_update_box: [ 100,100,5 ]
    # The range of raycasting [m].
    ray_range: [0.5, 100 ]

    p_min: 0.12
    p_miss: 0.49
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    # The threshold of a non-occupied inf map grid to be considered as free. [0.0-1.0]
    # for counter map, if each cell contains N cells in prob map, then only when
    # N_unk > N * unk_thresh cells are unknown, the cell will be considered as unknown.
    # example: 1) if unk_thresh is set 0.0, then once at least one cell in prob map is unknown,
    #             the cell will be considered as unknown.
    #         2) if unk_thresh is set to 1.0, then only all cells in prob map are unknown,
    #             the cell will be considered as unknown.
    # in all, 1.0 is more aggressive while 0.0 is more conservative.
    unk_thresh: 1.0


