# MAC-VO's odometry pipeline, copied from components/mac-vo/files/macvo-template.yaml
# (MAC-VO-ROS2 a22f89e, zedcam_macvo.yaml with upstream's outdoor keypoint
# selector, outlier filter and optimizer; see that file for why outdoor).
#
# The platform's generic adaptor renders this before MAC-VO starts: the
# {{ ... }} placeholders below come from the stack contract's primary stereo
# pair (`mns-stacks component check components/dsta-mac-vo --stack <stack>`
# shows their values). MAC-VO scales and crops the intrinsics itself when it
# resizes to 320x320, so the native values go in.

Common:
  # Some configurations are shared across multiple modules in Odometry, so I write them here.
  device: &device cuda
  max_depth: &max_depth auto

Odometry:
  name: MACVO
  args:
    # Device directive to the VO system
    # NOTE: the system may not follow this device config strictly since some module
    # e.g. those rely on PWC-Net, only support running on cuda device.
    device: *device
    edgewidth: 32
    num_point: 200 # Upper bound of KPs in each frame

    # Match covariance for keypoint on first observation (sub-pixel uncertainty
    # caused by the quantized pixel)
    match_cov_default: 0.25

    # Profiling the system using torch, generate chrome json trace file.
    profile: false

    mapping: false

  cov:
    obs:
      type: MatchCovariance
      args:
        device: *device
        kernel_size: 31
        match_cov_default: 0.25
        min_depth_cov: 0.05
        min_flow_cov: 0.25

  keypoint:
    type: CovAwareSelector_NoDepth
    args:
      device: *device
      kernel_size: 7
      mask_width: 32
      max_match_cov: 100.0
  
  mappoint:
    type: MappingPointSelector
    args:
      device: *device
      max_depth: 5.0
      max_depth_cov: 0.005
      mask_width: 32

  frontend:
    type: CUDAGraph_FlowFormerCovFrontend
    args:
      device: *device
      weight: ./model/MACVO_FrontendCov.pth
      dtype: fp32
      max_flow: -1
      enforce_positive_disparity: false

  motion:
    type: StaticMotionModel
    args:

  outlier:
    type: CovarianceSanityFilter
    args:
  
  postprocess:
    type: MotionInterpolate
    args:
  
  keyframe:
    type: AllKeyframe
    args:
  
  optimizer:
    type: ReprojectOptimizer
    args:
      device: cpu
      vectorize: true
      parallel: true
      use_fancy_cov: false
      constraint: disparity

# The stereo pair MAC-VO is fed (adaptor.inputs: stereo_primary).
Camera:
  fx: {{ stereo_primary.left.fx }}
  fy: {{ stereo_primary.left.fy }}
  cx: {{ stereo_primary.left.cx }}
  cy: {{ stereo_primary.left.cy }}
  bl: {{ stereo_primary.baseline }}
