# The VIO navigation stack: OpenVINS, SUPER and the stack's adaptor, on the
# network and ROS domain TEVV gives start.sh. $TEVV_CONFIG holds this
# package's files/ and TEVV's interface.json. OpenVINS reads the config the
# adaptor writes into the shared `config` volume.
x-ros: &ros
  ROS_DOMAIN_ID: "${ROS_DOMAIN_ID}"
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  TEVV_INTERFACE: /cfg/component/interface.json

services:
  openvins:
    image: dhdevspace/auto_mns:vio-estimator-openvins-69488123-cyclone
    command: [bash, -lc, "until [ -f /config/estimator_config.yaml ]; do sleep 1; done; exec /entrypoint.sh ros2 launch ov_msckf subscribe.launch.py config_path:=/config/estimator_config.yaml use_stereo:=true max_cameras:=2"]
    environment: *ros
    volumes: ["config:/config", "${TEVV_CONFIG}:/cfg/component:ro"]
    networks: [tevv]
    ipc: private
  super:
    image: dhdevspace/auto_mns:super_runtime-ms.1-cyclone
    command:
      - bash
      - -lc
      - >-
        set +u && source /opt/ros/humble/setup.bash
        && source /workspace/generated/super_planner/.planner_ws/ros_ws/install/setup.sh
        && exec ros2 run super_planner fsm_node --ros-args
        -p config_name:=/cfg/component/files/config/click.yaml
    environment: *ros
    volumes: ["${TEVV_CONFIG}:/cfg/component:ro"]
    networks: [tevv]
    ipc: private
  adaptor:
    image: dhdevspace/auto_mns:vio-nav-stack-adaptor-0.2.0
    environment: *ros
    # /out is kept with the run: the adaptor records the start pose it took there.
    volumes: ["config:/config", "${TEVV_CONFIG}:/cfg/component:ro", "${TEVV_OUT}:/out"]
    networks: [tevv]
    ipc: private

volumes:
  config: {}

networks:
  tevv:
    external: true
    name: "${TEVV_NETWORK}"
