# A whole stack under test in TEVV: OpenVINS (stereo VIO) feeding SUPER (local
# planner), two components of ours wired together and started by our own
# compose file. A worked example of a stack that estimates its own pose and
# flies on it. Nothing in TEVV knows OpenVINS, SUPER or how they are wired.
schema: tevv.component.v1
id: vio-nav-stack
name: VIO navigation stack (OpenVINS + SUPER)
version: 0.2.0
kind: stack

# TEVV runs start.sh once its side is up (stop.sh at teardown) with
# TEVV_NETWORK, ROS_DOMAIN_ID, TEVV_CONFIG, TEVV_INTERFACE, TEVV_OUT and
# TEVV_RUN_ID set; compose.yml puts every container on $TEVV_NETWORK.
start:
  script: start.sh
  stop: stop.sh

# What TEVV should provide: the stereo pair and the IMU (OpenVINS), the
# registered cloud (SUPER's map), and ground truth, read once for the start
# pose (see adaptor/tevv_adaptor.py). The goal is always there.
consumes: [stereo_primary, imu, point_cloud, ground_truth]
# What the stack gives back: its estimate (scored) and SUPER's setpoints (flown).
produces: [estimate, command]

# TEVV hands over once SUPER's state machine is up, which needs OpenVINS's
# estimate first.
ready:
  after_takeoff: [/planner_state]
  timeout_s: 300
