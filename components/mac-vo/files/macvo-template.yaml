# MAC-VO's odometry pipeline, from MAC-VO-ROS2 (MIT) at a22f89e,
# MACVO_ROS2/config/zedcam_macvo.yaml without its ZED-specific Camera block,
# with the keypoint selector, outlier filter and optimizer of upstream's
# outdoor config (src/Config/Experiment/MACVO/MACVO.yaml).
#
# Why outdoor: the ZED config caps keypoint depth at fx*baseline, the depth of
# one pixel of disparity after MAC-VO's 320x320 resize (254 px * 0.12 m = 30 m
# on the sim's stereo rig). In an open scene most texture is farther than that,
# MAC-VO loses track (fewer than 10 matches) and keeps the last pose, so the
# motion during every lost frame is dropped. Replaying stereo-xfs calm-r1 with
# tools/replay.sh: ZED config 4.13 m ATE, 132 of 663 frames lost; outdoor
# selectors 0.96 m, none lost, scale 1.004.
# The adaptor's `config` step appends the Camera block (fx, fy, cx, cy, bl)
# from the stack contract's primary stereo pair and writes /work/macvo.yaml.
Common:
  # Some configurations are shared across multiple modules in Odometry, so I write them here.
  device: &device cuda
  max_depth: &max_depth auto

Odometry:
  name: MACVO
  args:
    # Device directive to the VO system
    # NOTE: the system may not follow this device config strictly since some module
    # e.g. those rely on PWC-Net, only support running on cuda device.
    device: *device
    edgewidth: 32
    num_point: 200 # Upper bound of KPs in each frame

    # Match covariance for keypoint on first observation (sub-pixel uncertainty
    # caused by the quantized pixel)
    match_cov_default: 0.25

    # Profiling the system using torch, generate chrome json trace file.
    profile: false

    mapping: false

  cov:
    obs:
      type: MatchCovariance
      args:
        device: *device
        kernel_size: 31
        match_cov_default: 0.25
        min_depth_cov: 0.05
        min_flow_cov: 0.25

  keypoint:
    type: CovAwareSelector_NoDepth
    args:
      device: *device
      kernel_size: 7
      mask_width: 32
      max_match_cov: 100.0
  
  mappoint:
    type: MappingPointSelector
    args:
      device: *device
      max_depth: 5.0
      max_depth_cov: 0.005
      mask_width: 32

  frontend:
    type: CUDAGraph_FlowFormerCovFrontend
    args:
      device: *device
      weight: ./model/MACVO_FrontendCov.pth
      dtype: fp32
      max_flow: -1
      enforce_positive_disparity: false

  motion:
    type: StaticMotionModel
    args:

  outlier:
    type: CovarianceSanityFilter
    args:
  
  postprocess:
    type: MotionInterpolate
    args:
  
  keyframe:
    type: AllKeyframe
    args:
  
  optimizer:
    type: ReprojectOptimizer
    args:
      device: cpu
      vectorize: true
      parallel: true
      use_fancy_cov: false
      constraint: disparity
