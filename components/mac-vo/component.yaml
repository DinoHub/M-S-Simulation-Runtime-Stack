# MAC-VO (https://github.com/MAC-VO/MAC-VO, MIT), a learning-based stereo
# visual odometry, as a bring-your-own component. Its image is built from the
# upstream repositories unmodified (docker/macvo); the adaptor (adaptor/)
# fits it to any stack that offers a rectified stereo pair. Nothing in a
# ScenarioSpec names it: attach it with
#
#   mns-stacks generate scenarios/stereo-xfs --component components/mac-vo
schema: mns.component.v1
id: mac-vo
name: MAC-VO stereo visual odometry
version: 0.1.0
kind: estimator

images:
  macvo: dhdevspace/auto_mns:mac-vo-ros2-a22f89e-cu128
  adaptor: dhdevspace/auto_mns:mac-vo-adaptor-0.1.0
build:
  macvo: {context: docker/macvo}
  adaptor: {context: adaptor}

consumes: [stereo_primary, clock]
produces:
  estimate: {topic: default}        # nav_msgs/Odometry on /mns/estimate/odom
  record: [/macvo/pose, /mns/component/mac-vo/status]
# The model takes a while to load and warm up; nothing is flown until the
# estimate is published.
ready: {topics: [/mns/estimate/odom], timeout_s: 300}

requires:
  gpu: {min_vram_gb: 6}
  autopilot: [px4, ardupilot]

files:
  macvo-template: files/macvo-template.yaml
volumes:
  work: {}

viz:
  layout: viz/lichtblick-layout.json

services:
  # Writes /work/macvo.yaml: MAC-VO's pipeline plus the stereo pair's
  # intrinsics and baseline from the stack contract.
  config:
    role: adaptor
    image: adaptor
    lifecycle: oneshot
    # Writes into a fresh named volume, which docker creates root-owned.
    run_as: image
    command: [config]
    volumes: ["work:/work"]
  # MAC-VO itself, as upstream runs it. Its topics are hard-coded to a ZED
  # camera; the adaptor feeds those names.
  macvo:
    role: component
    image: macvo
    gpu: true
    run_as: image
    after: [config]
    volumes: ["work:/work:ro"]
    command: ["ros2", "run", "MACVO_ROS2", "MACVO", "--config", "/work/macvo.yaml"]
  # Stereo in (paired, RGB, throttled), pose out (full stamp, ENU/FLU base_link).
  adaptor:
    role: adaptor
    image: adaptor
    after: [config]
    command: [run]
    environment:
      MNS_ADAPTOR_MAX_HZ: "10"
