# =============================================================================
# Local override for runtime-stack bring-up of the per-drone AirSim bridges.
#
# Why this file exists:
#
# The vendored docker-compose.bridges.yml uses
# `dhdevspace/auto_mns:tevv-airstack-ros2-x11-node-development` — the same
# X11-enforcing image as the runtime stack's `ros2-x11-node`. Its entrypoint
# validates DISPLAY + the X11 socket BEFORE running the ros2 launch we
# actually care about, and aborts the container if either is missing. The
# vendored file (designed for a generic per-drone bring-up where X11 may
# not be available) doesn't supply those, so the bridges crash-loop.
#
# This override patches DISPLAY + an X11 socket bind into each
# airsim_bridge_dN, matching the pattern already used by the main
# ardupilot-xfs `ros2-x11-node` block in docker-compose.yml. The bridges
# don't actually use X11 — they just need the entrypoint guard to pass.
#
# Compose layering merges `environment:` and `volumes:` additively, so the
# vendored ROS_DOMAIN_ID / AIRSIM_HOST_IP / per-drone volumes from
# docker-compose.bridges.yml stay intact.
#
# Bring-up (test-per-drone-bridges.sh already wires this in):
#   docker compose \
#     -f docker-compose.bridges.yml \
#     -f docker-compose.bridges.override.yml \
#     up -d
#
# Follow-up: teach tools/generate_compose.py to emit DISPLAY/XAUTHORITY
# (or move the bridges to a non-X11 image) so this override can go away.
# =============================================================================

x-x11-passthrough: &x11-passthrough
  # Run as the host user (1000:1000) directly. The image's entrypoint
  # otherwise starts as root, then `su`-switches to UID 1000, which strips
  # DISPLAY/XAUTHORITY from the env and re-aborts the X11 validation in a
  # restart loop. Matching the main stack's ros2-x11-node `user:` setting
  # bypasses the switch entirely. UID/GID default to 1000 so the override
  # works even if the shell didn't export them (test-per-drone-bridges.sh
  # may run outside launch.sh's exports).
  user: "${UID:-1000}:${GID:-1000}"
  environment:
    - DISPLAY=${DISPLAY:-:0}
    - XAUTHORITY=/tmp/.Xauthority
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${XAUTHORITY:-/home/${USER:-mnsuser}/.Xauthority}:/tmp/.Xauthority:ro

services:
  airsim_bridge_d1:
    <<: *x11-passthrough
  airsim_bridge_d2:
    <<: *x11-passthrough
  airsim_bridge_d3:
    <<: *x11-passthrough
  airsim_bridge_d4:
    <<: *x11-passthrough
