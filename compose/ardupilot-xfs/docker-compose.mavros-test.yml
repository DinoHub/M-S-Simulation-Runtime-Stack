  agent_internal-9: { external: true, name: agent_internal-9 }
  # sim_net is created by the MAIN ardupilot-xfs compose project, so docker
  # names it `<project>_sim_net`. This test runs under its own project name,
  # hence external + explicit name — without the `name:` docker would try to
  # create `ardupilot-xfs-mavros-test_sim_net`, a second, unconnected network.
  # Consequence: the main stack must be up first (already a documented prereq).
  # Block style, not flow style: `${VAR:-default}` inside `{ }` closes the
  # flow mapping at the variable's own brace and fails to parse.
  sim_net:
    external: true
    name: ${SIM_NET_NAME:-ardupilot-xfs_sim_net}
