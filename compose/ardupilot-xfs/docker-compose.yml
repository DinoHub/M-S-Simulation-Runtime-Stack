# =============================================================================
# ArduPilot x4 + AirSim XFS + per-drone ROS2 bridges + QGroundControl
# =============================================================================
#
# DEFAULT ARCHITECTURE (./launch.sh ardupilot-xfs):
#   - 4x ArduPilot SITL                 (host net)
#   - AirSim XFS                        (host net, GPU)
#   - airsim_bridge_d{1..4}             (one per drone, on agent_internal-N)
#   - QGroundControl + pixel-streaming-signalling (host net)
#
# OPT-IN: agent_external zenoh bridging (./launch.sh ardupilot-xfs --with-agent-external):
#   - everything in DEFAULT, plus
#   - zenoh-bridge-{1..4}               (one per drone, on agent_internal-N + agent_external)
#
# LEGACY ARCHITECTURE (./launch.sh ardupilot-xfs --legacy-bridge):
#   - 4x ArduPilot SITL                 (host net)
#   - AirSim XFS                        (host net, GPU)
#   - sim-netns + sim-router            (single zenoh router on agent_external)
#   - ros2-x11-node                     (single ROS2 container, all 4 drones)
#   - QGroundControl + pixel-streaming-signalling (host net)
#
# Per-drone bridges replace the older ros2-x11-node monolith. Each per-drone
# bridge runs airsim_ros_pkgs bringup for ONE vehicle, isolated on its own
# `agent_internal-N` docker network. The autonomy team's `autonomy_stack-N`
# attaches to the same agent_internal-N to consume /CopterN/* topics, and
# uses zenoh-bridge-N (on agent_external) for /shared/* mesh traffic.
#
# Required environment variables (set in .env or export before running):
#   CONFIG_ROOT   - absolute path to the config root containing:
#                     ardupilot/config/
#                     unreal-airsim/xfs/settings-ardupilot.json
#                     qgroundcontrol/
#                     zenoh/zenoh_bridge_drone_{1..4}.json5
#   UID / GID     - numeric user/group id for GPU-capable services
#   DISPLAY       - X11 display
#   XAUTHORITY    - path to Xauthority file
#
# Optional environment variables:
#   DRONE_N_DOMAIN_ID  - per-drone ROS_DOMAIN_ID (default N). Set all four to 20
#                        (or whatever) for autonomy-team flat-domain alignment.
#   VEHICLE_N_NAME     - vehicle key in AirSim settings (default Copter{N})
#
# Per-instance ports (host network, ArduPilot<->AirSim FDM):
#   Instance 0 -> Copter1 : TCP 9002 / UDP 9003 ; MAVLink TCP 5760
#   Instance 1 -> Copter2 :     9012 /     9013 ;         5770
#   Instance 2 -> Copter3 :     9022 /     9023 ;         5780
#   Instance 3 -> Copter4 :     9032 /     9033 ;         5790
#
# Usage:
#   ./launch.sh ardupilot-xfs                  # default per-drone-bridge flow
#   ./launch.sh ardupilot-xfs --legacy-bridge  # ros2-x11-node + sim-router
#   ./launch.sh ardupilot-xfs --headless       # no AirSim window
#
# Validation:
#   See compose/ardupilot-xfs/README.md and ./test-per-drone-bridges.sh.
#
# Legacy MAVROS (only with --legacy-bridge): inside ardupilot-xfs-ros2, run
#   compose/ardupilot-xfs/scripts/launch_4_mavros.sh
# =============================================================================

name: ardupilot-xfs

x-ardupilot-base: &ardupilot-base
  image: ${ARDUPILOT_IMAGE:-dhdevspace/auto_mns:ardupilot-slim}
  pull_policy: if_not_present
  restart: "no"
  network_mode: host
  user: "0:0"
  cap_add:
    - SYS_PTRACE
  security_opt:
    - seccomp:unconfined
  healthcheck:
    test: ["CMD-SHELL", "test -f /ardupilot_workspace/ardupilot/build/sitl/bin/arducopter && pgrep -f arducopter"]
    interval: 5s
    timeout: 5s
    retries: 24
    start_period: 120s

# Per-drone airsim_bridge_dN defaults. See the "PER-DRONE AIRSIM ROS2 BRIDGES"
# section under services: for full notes (X11 plumbing rationale, the
# user-switch quirk this works around, etc.).
x-airsim-bridge: &airsim-bridge-defaults
  image: ${AIRSIM_BRIDGE_IMAGE:-dhdevspace/auto_mns:tevv-airstack-ros2-x11-node-multi-agent-bridge}
  pull_policy: if_not_present
  init: true
  restart: unless-stopped
  ipc: host
  user: "${UID:-1000}:${GID:-1000}"
  profiles: ["per-drone-bridge"]
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - /dev/shm:/dev/shm:rw
    - /tmp/iceoryx2:/tmp/iceoryx2:rw
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${XAUTHORITY:?set XAUTHORITY}:/tmp/.Xauthority:ro
  depends_on:
    airsim-xfs:
      condition: service_started

# Per-drone zenoh-bridge-N defaults. Configs at config/zenoh/zenoh_bridge_drone_{1..4}.json5.
# Profile `agent-external` (NOT `per-drone-bridge`) so zenoh bridges only start
# when the user explicitly opts into agent_external connectivity. Pass
# `./launch.sh ardupilot-xfs --with-agent-external` to activate.
x-zenoh-bridge: &zenoh-bridge-defaults
  image: ${ZENOH_BRIDGE_IMAGE:-eclipse/zenoh-bridge-ros2dds:1.4.0}
  pull_policy: if_not_present
  init: true
  restart: unless-stopped
  profiles: ["agent-external"]
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:

  # ---------------------------------------------------------------------------
  # ArduPilot SITL x4
  # ---------------------------------------------------------------------------
  ardupilot-drone-0:
    <<: *ardupilot-base
    container_name: ardupilot-xfs-drone-0
    hostname: ardupilot-xfs-drone-0
    environment:
      - ARDUPILOT_SIM_HOSTNAME=${ARDUPILOT_SIM_HOSTNAME:-localhost}
      - ARDUPILOT_HOME_LAT=${ARDUPILOT_HOME_LAT:-42.764970}
      - ARDUPILOT_HOME_LON=${ARDUPILOT_HOME_LON:--115.579139}
      - ARDUPILOT_HOME_ALT=${ARDUPILOT_HOME_ALT:-1130}
      - INSTANCE_NUM=0
    volumes:
      - ./data/ardupilot-xfs/instance_0:/ardupilot_workspace/instances/instance_0
      - ./data/ardupilot-xfs/logs_0:/ardupilot_data/logs
      - ${CONFIG_ROOT}/ardupilot/config:/ardupilot_config:ro
    command: ["0"]

  ardupilot-drone-1:
    <<: *ardupilot-base
    container_name: ardupilot-xfs-drone-1
    hostname: ardupilot-xfs-drone-1
    environment:
      - ARDUPILOT_SIM_HOSTNAME=${ARDUPILOT_SIM_HOSTNAME:-localhost}
      - ARDUPILOT_HOME_LAT=${ARDUPILOT_HOME_LAT:-42.764970}
      - ARDUPILOT_HOME_LON=${ARDUPILOT_HOME_LON:--115.579139}
      - ARDUPILOT_HOME_ALT=${ARDUPILOT_HOME_ALT:-1130}
      - INSTANCE_NUM=1
    volumes:
      - ./data/ardupilot-xfs/instance_1:/ardupilot_workspace/instances/instance_1
      - ./data/ardupilot-xfs/logs_1:/ardupilot_data/logs
      - ${CONFIG_ROOT}/ardupilot/config:/ardupilot_config:ro
    command: ["1"]

  ardupilot-drone-2:
    <<: *ardupilot-base
    container_name: ardupilot-xfs-drone-2
    hostname: ardupilot-xfs-drone-2
    environment:
      - ARDUPILOT_SIM_HOSTNAME=${ARDUPILOT_SIM_HOSTNAME:-localhost}
      - ARDUPILOT_HOME_LAT=${ARDUPILOT_HOME_LAT:-42.764970}
      - ARDUPILOT_HOME_LON=${ARDUPILOT_HOME_LON:--115.579139}
      - ARDUPILOT_HOME_ALT=${ARDUPILOT_HOME_ALT:-1130}
      - INSTANCE_NUM=2
    volumes:
      - ./data/ardupilot-xfs/instance_2:/ardupilot_workspace/instances/instance_2
      - ./data/ardupilot-xfs/logs_2:/ardupilot_data/logs
      - ${CONFIG_ROOT}/ardupilot/config:/ardupilot_config:ro
    command: ["2"]

  ardupilot-drone-3:
    <<: *ardupilot-base
    container_name: ardupilot-xfs-drone-3
    hostname: ardupilot-xfs-drone-3
    environment:
      - ARDUPILOT_SIM_HOSTNAME=${ARDUPILOT_SIM_HOSTNAME:-localhost}
      - ARDUPILOT_HOME_LAT=${ARDUPILOT_HOME_LAT:-42.764970}
      - ARDUPILOT_HOME_LON=${ARDUPILOT_HOME_LON:--115.579139}
      - ARDUPILOT_HOME_ALT=${ARDUPILOT_HOME_ALT:-1130}
      - INSTANCE_NUM=3
    volumes:
      - ./data/ardupilot-xfs/instance_3:/ardupilot_workspace/instances/instance_3
      - ./data/ardupilot-xfs/logs_3:/ardupilot_data/logs
      - ${CONFIG_ROOT}/ardupilot/config:/ardupilot_config:ro
    command: ["3"]

  # ---------------------------------------------------------------------------
  # AirSim XFS - Unreal Engine simulator with XFS scene
  #
  # Containerized AirSim with PixelStreaming. Requires the
  # `pixel-streaming-signalling` sidecar (declared below). UE5 dials the
  # signalling URL at startup; without it, the AirSim API socket never
  # opens and ardupilot SITLs can't connect on the per-vehicle FDM ports.
  # View the live scene at http://localhost:${PS_HTTP_PORT:-80}.
  # ---------------------------------------------------------------------------
  airsim-xfs:
    image: ${AIRSIM_IMAGE:-dhdevspace/auto_mns:xfs-latest}
    pull_policy: if_not_present
    container_name: ardupilot-xfs-airsim
    hostname: ardupilot-xfs-airsim
    restart: unless-stopped

    depends_on:
      pixel-streaming-signalling:
        condition: service_healthy

    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - video
    init: true
    shm_size: "4gb"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY:-:0}
      - SDL_VIDEODRIVER=${SDL_VIDEODRIVER:-x11}
      - XAUTHORITY=/tmp/.Xauthority
      # UE5 PixelStreaming dials this signalling-server URL at startup.
      # Host networking → 127.0.0.1 reaches the pixel-streaming-signalling
      # container.
      - PIXELSTREAMING_URL=${PS_URL:-ws://127.0.0.1:${PS_STREAMER_PORT:-8888}}
      # When true, UE5 runs without a window via -RenderOffScreen. Cameras
      # and PixelStreaming still work; the GUI doesn't pop up. Toggle at
      # launch with: ./launch.sh ardupilot-xfs --headless
      - AIRSIM_HEADLESS=${AIRSIM_HEADLESS:-false}

    network_mode: host
    ipc: host

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority:ro
      - /dev/shm:/dev/shm:rw
      - /tmp/iceoryx2:/tmp/iceoryx2:rw
      - ${CONFIG_ROOT?set CONFIG_ROOT}/unreal-airsim/xfs/settings-ardupilot.json:/home/airsim_user/Documents/AirSim/settings.json:ro
      - ${CONFIG_ROOT?set CONFIG_ROOT}/unreal-airsim/xfs/settings-ardupilot.json:/app/Xfs/settings.json:ro

    # xfs-latest doesn't ship /usr/local/bin/airsim-entrypoint.sh (the wrapper
    # exists in the condo image only). Pass -PixelStreamingURL directly to
    # the UE5 binary instead — the plugin reads it from CLI when present,
    # ignores it when not. `$$VAR` survives compose interpolation so bash
    # inside the container reads vars from the env block above.
    #
    # AIRSIM_HEADLESS=true selects -RenderOffScreen (off-screen GPU render,
    # cameras still work, no window). false (default) keeps -windowed for
    # interactive use. -NullRHI would skip rendering entirely and break
    # AirSim cameras — do NOT add it.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting 5s for ArduPilot SITL fleet to initialize..."
        sleep 5
        if [ "$$AIRSIM_HEADLESS" = "true" ]; then
          DISPLAY_FLAGS="-RenderOffScreen -NoSound -Unattended -NoSplash"
        else
          DISPLAY_FLAGS="-windowed"
        fi
        echo "AirSim display mode: $$DISPLAY_FLAGS"
        exec /app/Xfs/Xfs.sh $$DISPLAY_FLAGS -ResX=1920 -ResY=1080 -PixelStreamingURL=$$PIXELSTREAMING_URL

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 41451 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  # ---------------------------------------------------------------------------
  # Pixel Streaming Signalling Server
  # Bridges the UE5 PixelStreaming plugin (listening on :8888 inside
  # airsim-xfs) and browser viewers. airsim-xfs depends on this being
  # healthy before UE5 starts; without it, UE5 hangs on plugin init and
  # the AirSim API socket never opens. Open http://localhost:${PS_HTTP_PORT}
  # to view the live scene as a WebRTC stream.
  # ---------------------------------------------------------------------------
  pixel-streaming-signalling:
    image: ${PIXEL_STREAMING_SIGNALLING_IMAGE:-dhdevspace/auto_mns:tevv-pixel-streaming-signalling-5.5}
    pull_policy: if_not_present
    container_name: ardupilot-xfs-pixel-streaming-signalling
    hostname: ardupilot-xfs-pixel-streaming-signalling
    restart: unless-stopped
    network_mode: host
    init: true
    environment:
      - PIXELSTREAMING_STREAMER_PORT=${PS_STREAMER_PORT:-8888}
      - PIXELSTREAMING_HTTP_PORT=${PS_HTTP_PORT:-80}
      - PIXELSTREAMING_PUBLIC_IP=${PS_PUBLIC_IP:-127.0.0.1}
    command:
      - --StreamerPort=${PS_STREAMER_PORT:-8888}
      - --HttpPort=${PS_HTTP_PORT:-80}
      - --PublicIp=${PS_PUBLIC_IP:-127.0.0.1}
    # Image (Node.js / wilbur signalling) ships curl/wget/bash/node but NOT nc,
    # ss, or netstat — so the obvious `nc -z` healthcheck always reports
    # "nc: not found" and the container is forever unhealthy. We also avoid
    # `curl -f`: any HTTP response (incl. 404) means the listener is up.
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -m 3 -o /dev/null http://127.0.0.1:${PS_HTTP_PORT:-80}/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ===========================================================================
  # PER-DRONE AIRSIM ROS2 BRIDGES (default flow)
  # ===========================================================================
  # Four airsim_bridge_dN containers, one per vehicle (Copter1..Copter4),
  # each on its own agent_internal-N docker network. These REPLACE the legacy
  # single-container `ros2-x11-node` (now profile-gated under `legacy-bridge`).
  #
  # Drone 1 is the CLOCK MASTER: it owns /clock, world_ned static TF,
  # /origin_geo_point, and fleet services. Drones 2..4 publish only their own
  # vehicle topics.
  #
  # Domain id strategy: the vendored default per-drone domains (1..4) keep
  # SHM-discovery isolated between bridges. Override with `DRONE_N_DOMAIN_ID=20`
  # if the autonomy team is on a flat domain.
  #
  # Bridge AirSim host: ALWAYS host.docker.internal — the bridges live on
  # isolated `agent_internal-N` networks where 127.0.0.1 means the container
  # itself. Hardcoded (not env-driven) so a stray AIRSIM_HOST_IP=127.0.0.1
  # in .env can't break them.
  #
  # See top-of-file for `x-airsim-bridge` anchor (per-drone defaults).
  # ===========================================================================
  airsim_bridge_d1:
    <<: *airsim-bridge-defaults
    container_name: airsim_bridge_d1
    hostname: airsim_bridge_d1
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.Xauthority
      - ROS_DOMAIN_ID=${DRONE_1_DOMAIN_ID:-1}
      - ROS_LOCALHOST_ONLY=0
      - AIRSIM_HOST_IP=host.docker.internal
      - AIRSIM_HOST_PORT=${AIRSIM_HOST_PORT:-41451}
      - VEHICLE_NAME=${VEHICLE_1_NAME:-Copter1}
    networks:
      - agent_internal-1
    command:
      - "bash"
      - "-lc"
      - >
        source /airsim_ros2_ws/install/setup.bash &&
        ros2 launch airsim_ros_pkgs airsim_bringup.launch.py
        host_ip:=host.docker.internal
        host_port:=${AIRSIM_HOST_PORT:-41451}
        vehicles:="['${VEHICLE_1_NAME:-Copter1}']"
        enable_localization:=true
        enable_coordination:=true
        enable_local_obs:=${ENABLE_LOCAL_OBS:-true}
        local_obs_target_frame:=${LOCAL_OBS_TARGET_FRAME:-map}

  airsim_bridge_d2:
    <<: *airsim-bridge-defaults
    container_name: airsim_bridge_d2
    hostname: airsim_bridge_d2
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.Xauthority
      - ROS_DOMAIN_ID=${DRONE_2_DOMAIN_ID:-2}
      - ROS_LOCALHOST_ONLY=0
      - AIRSIM_HOST_IP=host.docker.internal
      - AIRSIM_HOST_PORT=${AIRSIM_HOST_PORT:-41451}
      - VEHICLE_NAME=${VEHICLE_2_NAME:-Copter2}
    networks:
      - agent_internal-2
    command:
      - "bash"
      - "-lc"
      - >
        source /airsim_ros2_ws/install/setup.bash &&
        ros2 launch airsim_ros_pkgs airsim_bringup.launch.py
        host_ip:=host.docker.internal
        host_port:=${AIRSIM_HOST_PORT:-41451}
        vehicles:="['${VEHICLE_2_NAME:-Copter2}']"
        enable_localization:=true
        enable_coordination:=false
        enable_local_obs:=${ENABLE_LOCAL_OBS:-true}
        local_obs_target_frame:=${LOCAL_OBS_TARGET_FRAME:-map}

  airsim_bridge_d3:
    <<: *airsim-bridge-defaults
    container_name: airsim_bridge_d3
    hostname: airsim_bridge_d3
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.Xauthority
      - ROS_DOMAIN_ID=${DRONE_3_DOMAIN_ID:-3}
      - ROS_LOCALHOST_ONLY=0
      - AIRSIM_HOST_IP=host.docker.internal
      - AIRSIM_HOST_PORT=${AIRSIM_HOST_PORT:-41451}
      - VEHICLE_NAME=${VEHICLE_3_NAME:-Copter3}
    networks:
      - agent_internal-3
    command:
      - "bash"
      - "-lc"
      - >
        source /airsim_ros2_ws/install/setup.bash &&
        ros2 launch airsim_ros_pkgs airsim_bringup.launch.py
        host_ip:=host.docker.internal
        host_port:=${AIRSIM_HOST_PORT:-41451}
        vehicles:="['${VEHICLE_3_NAME:-Copter3}']"
        enable_localization:=true
        enable_coordination:=false
        enable_local_obs:=${ENABLE_LOCAL_OBS:-true}
        local_obs_target_frame:=${LOCAL_OBS_TARGET_FRAME:-map}

  airsim_bridge_d4:
    <<: *airsim-bridge-defaults
    container_name: airsim_bridge_d4
    hostname: airsim_bridge_d4
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.Xauthority
      - ROS_DOMAIN_ID=${DRONE_4_DOMAIN_ID:-4}
      - ROS_LOCALHOST_ONLY=0
      - AIRSIM_HOST_IP=host.docker.internal
      - AIRSIM_HOST_PORT=${AIRSIM_HOST_PORT:-41451}
      - VEHICLE_NAME=${VEHICLE_4_NAME:-Copter4}
    networks:
      - agent_internal-4
    command:
      - "bash"
      - "-lc"
      - >
        source /airsim_ros2_ws/install/setup.bash &&
        ros2 launch airsim_ros_pkgs airsim_bringup.launch.py
        host_ip:=host.docker.internal
        host_port:=${AIRSIM_HOST_PORT:-41451}
        vehicles:="['${VEHICLE_4_NAME:-Copter4}']"
        enable_localization:=true
        enable_coordination:=false
        enable_local_obs:=${ENABLE_LOCAL_OBS:-true}
        local_obs_target_frame:=${LOCAL_OBS_TARGET_FRAME:-map}

  # ===========================================================================
  # PER-DRONE ZENOH BRIDGES (default flow)
  # ===========================================================================
  # One zenoh-bridge-ros2dds per drone, attached to BOTH its own
  # agent_internal-N (DDS side, sees the airsim_bridge_dN topics) and
  # agent_external (zenoh side, gossips with the autonomy team's
  # autonomy_stack-N peers). Replaces the legacy single sim-router (now
  # profile-gated under `legacy-bridge`).
  #
  # Topic ownership (asymmetric, per memory's namespace spec):
  #   - drone N publishes /shared/drone_N/* outward to zenoh
  #   - drone N subscribes to /shared/sim/* and /shared/swarm/*
  # See config/zenoh/zenoh_bridge_drone_{1..4}.json5 for details.
  #
  # See top-of-file for `x-zenoh-bridge` anchor (per-drone defaults).
  # ===========================================================================
  zenoh-bridge-1:
    <<: *zenoh-bridge-defaults
    container_name: ardupilot-xfs-zenoh-bridge-1
    hostname: zenoh-bridge-1
    networks:
      - agent_internal-1
      - agent_external
    environment:
      - RUST_LOG=zenoh=info,zenoh_plugin_ros2dds=info
      - ROS_LOCALHOST_ONLY=0
      - ROS_DISTRO=${SIM_ROS_DISTRO:-humble}
      - ROS_DOMAIN_ID=${DRONE_1_DOMAIN_ID:-1}
    command: ["-c", "/etc/zenoh/zenoh_bridge_drone.json5"]
    volumes:
      - ${CONFIG_ROOT?set CONFIG_ROOT}/zenoh/zenoh_bridge_drone_1.json5:/etc/zenoh/zenoh_bridge_drone.json5:ro
    depends_on:
      airsim_bridge_d1:
        condition: service_started

  zenoh-bridge-2:
    <<: *zenoh-bridge-defaults
    container_name: ardupilot-xfs-zenoh-bridge-2
    hostname: zenoh-bridge-2
    networks:
      - agent_internal-2
      - agent_external
    environment:
      - RUST_LOG=zenoh=info,zenoh_plugin_ros2dds=info
      - ROS_LOCALHOST_ONLY=0
      - ROS_DISTRO=${SIM_ROS_DISTRO:-humble}
      - ROS_DOMAIN_ID=${DRONE_2_DOMAIN_ID:-2}
    command: ["-c", "/etc/zenoh/zenoh_bridge_drone.json5"]
    volumes:
      - ${CONFIG_ROOT?set CONFIG_ROOT}/zenoh/zenoh_bridge_drone_2.json5:/etc/zenoh/zenoh_bridge_drone.json5:ro
    depends_on:
      airsim_bridge_d2:
        condition: service_started

  zenoh-bridge-3:
    <<: *zenoh-bridge-defaults
    container_name: ardupilot-xfs-zenoh-bridge-3
    hostname: zenoh-bridge-3
    networks:
      - agent_internal-3
      - agent_external
    environment:
      - RUST_LOG=zenoh=info,zenoh_plugin_ros2dds=info
      - ROS_LOCALHOST_ONLY=0
      - ROS_DISTRO=${SIM_ROS_DISTRO:-humble}
      - ROS_DOMAIN_ID=${DRONE_3_DOMAIN_ID:-3}
    command: ["-c", "/etc/zenoh/zenoh_bridge_drone.json5"]
    volumes:
      - ${CONFIG_ROOT?set CONFIG_ROOT}/zenoh/zenoh_bridge_drone_3.json5:/etc/zenoh/zenoh_bridge_drone.json5:ro
    depends_on:
      airsim_bridge_d3:
        condition: service_started

  zenoh-bridge-4:
    <<: *zenoh-bridge-defaults
    container_name: ardupilot-xfs-zenoh-bridge-4
    hostname: zenoh-bridge-4
    networks:
      - agent_internal-4
      - agent_external
    environment:
      - RUST_LOG=zenoh=info,zenoh_plugin_ros2dds=info
      - ROS_LOCALHOST_ONLY=0
      - ROS_DISTRO=${SIM_ROS_DISTRO:-humble}
      - ROS_DOMAIN_ID=${DRONE_4_DOMAIN_ID:-4}
    command: ["-c", "/etc/zenoh/zenoh_bridge_drone.json5"]
    volumes:
      - ${CONFIG_ROOT?set CONFIG_ROOT}/zenoh/zenoh_bridge_drone_4.json5:/etc/zenoh/zenoh_bridge_drone.json5:ro
    depends_on:
      airsim_bridge_d4:
        condition: service_started

  # ---------------------------------------------------------------------------
  # sim-netns — tiny container whose only job is to own a stable network
  # namespace shared by sim-router and ros2-x11-node. Both real services use
  # `network_mode: service:sim-netns`. Restarting sim-router (or
  # ros2-x11-node) does NOT destroy the netns or the docker network
  # attachments — only restarting sim-netns would, and it doesn't need to.
  #
  # All cross-host wiring (network attachments, network aliases) lives here.
  # `extra_hosts` is also redeclared on each consumer because
  # `network_mode: service:X` shares the netns but NOT /etc/hosts.
  # ---------------------------------------------------------------------------
  sim-netns:
    image: alpine:3.20
    pull_policy: if_not_present
    container_name: ardupilot-xfs-sim-netns
    hostname: sim-netns
    # Legacy: only needed by ros2-x11-node + sim-router (the single-bridge
    # path). Default flow uses per-drone airsim_bridge_dN + zenoh-bridge-N
    # which don't share a netns. Activate with `./launch.sh ardupilot-xfs --legacy-bridge`.
    profiles: ["legacy-bridge"]
    init: true
    restart: unless-stopped
    command: ["sleep", "infinity"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      agent_external:
        aliases:
          - sim-router       # how drones reach us via DNS on agent_external
      sim_internal: {}

  # ---------------------------------------------------------------------------
  # sim-router — joins the autonomy team's inter-drone mesh on agent_external
  # via sim-netns and bridges ^/shared(/.*)? ROS2 topics. Lives in
  # sim-netns's netns; ros2-x11-node lives in the same netns so DDS is on
  # shared loopback (ros_localhost_only=true on both sides).
  #
  # No healthcheck: the eclipse/zenoh-bridge-ros2dds image is minimal (no
  # ss / nc / curl). `network_mode: service:sim-netns` requires sim-netns's
  # netns to be live; docker handles ordering via `depends_on`.
  # ---------------------------------------------------------------------------
  sim-router:
    image: ${ZENOH_BRIDGE_IMAGE:-eclipse/zenoh-bridge-ros2dds:1.4.0}
    pull_policy: if_not_present
    container_name: ardupilot-xfs-sim-router
    # Legacy single-bridge zenoh router. Replaced by per-drone zenoh-bridge-N
    # in the default flow (see zenoh-bridge-1..4 below).
    profiles: ["legacy-bridge"]
    init: true
    restart: unless-stopped
    network_mode: "service:sim-netns"
    depends_on:
      - sim-netns
    environment:
      - RUST_LOG=zenoh=info,zenoh_plugin_ros2dds=info
      - ROS_LOCALHOST_ONLY=1
      - ROS_DOMAIN_ID=${SIM_ROS_DOMAIN_ID:-0}
      # Match ros2-x11-node's distro so the ros2dds plugin parses
      # ros_discovery_info correctly. Without this it warns and falls back
      # to assuming 'iron' (see eclipse-zenoh/zenoh-plugin-ros2dds#21).
      - ROS_DISTRO=${SIM_ROS_DISTRO:-humble}
    command: ["-c", "/etc/zenoh/sim_router.json5"]
    volumes:
      - ${CONFIG_ROOT?set CONFIG_ROOT}/zenoh/sim_router.json5:/etc/zenoh/sim_router.json5:ro

  # ---------------------------------------------------------------------------
  # ROS2 X11 Node - bringup + per-vehicle nodes (MAVROS launched separately, see top)
  # ---------------------------------------------------------------------------
  ros2-x11-node:
    image: ${ROS2_IMAGE:-dhdevspace/auto_mns:tevv-airstack-ros2-multi-vehicle-gt}
    pull_policy: if_not_present
    container_name: ardupilot-xfs-ros2
    hostname: ardupilot-xfs-ros2
    restart: "no"
    # Legacy single-container ROS2 bridge. The default flow now uses per-drone
    # airsim_bridge_dN containers — see services above. Activate this with
    # `./launch.sh ardupilot-xfs --legacy-bridge`.
    profiles: ["legacy-bridge"]

    network_mode: host
    depends_on:
      - sim-netns
      - sim-router
    # Belt-and-suspenders: `network_mode: service:sim-netns` does inherit
    # /etc/hosts from sim-netns (verified — Docker copies the file at
    # container start), so the host.docker.internal mapping below is
    # redundant in practice. Re-declared here to document the dependency
    # (AIRSIM_HOST_IP / MAVROS_FCU_URL below resolve this name) and to be
    # robust against future Docker behavior changes.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ipc: host
    init: true
    stdin_open: true
    tty: true

    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - video
    cap_add:
      - SYS_PTRACE

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility, graphics]

    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting 12s for AirSim + 4 SITLs to fully initialize..."
        sleep 12
        echo "Starting ROS2 multi-drone stack..."
        exec /entrypoint_x11.sh

    environment:
      # DDS locality: pair with ros_localhost_only=true in sim_router.json5
      # so application DDS stays on the shared loopback in sim-netns's netns.
      # Without this, ROS2 nodes here may try to discover across all the
      # interfaces present in the shared netns (incl. agent_external).
      - ROS_LOCALHOST_ONLY=1
      - ROS_DOMAIN_ID=${SIM_ROS_DOMAIN_ID:-0}

      # X11 display forwarding
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.Xauthority
      - QT_X11_NO_MITSHM=1

      # ROS2 / AirSim connectivity
      # ros2-x11-node is no longer on host networking — it shares
      # sim-netns's netns. Reach AirSim / SITL on the host via
      # host.docker.internal (declared in extra_hosts above).
      - AIRSIM_HOST_IP=${AIRSIM_HOST_IP:-host.docker.internal}
      - AIRSIM_HOST_PORT=${AIRSIM_HOST_PORT:-41451}

      # Launch configuration
      - LAUNCH_MODE=${LAUNCH_MODE:-multi}
      - ENABLE_COORDINATION=${ENABLE_COORDINATION:-true}
      - RPC_TIMEOUT=${RPC_TIMEOUT:-10.0}
      - LAUNCH_RVIZ=${LAUNCH_RVIZ:-false}
      - DEBUG=${DEBUG:-false}
      - AUTO_BUILD=${AUTO_BUILD:-false}

      # MAVROS - bringup launches one only; we'll start 4 manually after bringup
      - MAVROS_USE_HOST_NETWORK=${MAVROS_USE_HOST_NETWORK:-true}
      - MAVROS_PX4_NETWORK_MODE=${MAVROS_PX4_NETWORK_MODE:-host}
      - MAVROS_NUM_DRONES=${MAVROS_NUM_DRONES:-4}
      - MAVROS_FCU_URL=${MAVROS_FCU_URL:-udp://:14551@host.docker.internal:14551}

      # Auto-launch and supervisor
      - ENABLE_SUPERVISOR=${ENABLE_SUPERVISOR:-true}
      - AUTO_LAUNCH_ROS2=${AUTO_LAUNCH_ROS2:-true}

      # 4-drone vehicle configuration
      - VEHICLES=${VEHICLES:-"['Copter1','Copter2','Copter3','Copter4']"}
      - ENABLE_MAVROS=${ENABLE_MAVROS:-false}
      - TEST_LOCAL_PLANNER=${TEST_LOCAL_PLANNER:-true}
      - AUTO_START_ON_TAKEOFF=${AUTO_START_ON_TAKEOFF:-true}
      - AUTO_END_ON_LANDING=${AUTO_END_ON_LANDING:-true}

      # ----------------------------------------------------------------------
      # Autonomy / point-cloud registration knobs
      # ----------------------------------------------------------------------
      # These map to ros2 launch args inside /entrypoint_x11.sh, which calls
      # rpc_dynamic_vehicles.launch.py. Tune via .env (or `VAR=... ./launch.sh
      # ardupilot-xfs`) before bringup; mid-run changes need a container restart.
      #
      # Set ENABLE_LOCAL_OBS=true to spin up one pointcloud_registration_node
      # per vehicle that accumulates LidarSensor1/points into
      # /<Copter>/registered_point_cloud (in the `target_frame`, default `map`).
      # Disable to skip registration entirely (saves CPU when local planner is
      # off or when an external mapper is consuming raw lidar).
      - ENABLE_LOCAL_OBS=${ENABLE_LOCAL_OBS:-true}

      # Rolling buffer length per vehicle, seconds. Longer = denser local map
      # but more CPU/memory; shorter = leaner but more thrashing on fast moves.
      # Tune higher (e.g. 60.0) for slow exploration, lower (e.g. 10.0) for
      # aggressive flight where stale points hurt more than they help.
      - LOCAL_OBS_BUFFER_SEC=${LOCAL_OBS_BUFFER_SEC:-30.0}

      # Who publishes the map->odom TF chain. "sim" (default) lets our
      # localization nodes do it; set to "external" if you have your own
      # VIO/EKF publishing map->odom (then we won't fight you over the topic).
      - LOCALIZATION_SOURCE=${LOCALIZATION_SOURCE:-sim}

      # Toggle the REP-105 localization stack. Default true is what most
      # autonomy stacks expect; set false only if you're testing without any
      # localization (rare).
      - ENABLE_LOCALIZATION=${ENABLE_LOCALIZATION:-true}

      # Use simulation time from /clock — required for FlightBench-style
      # benchmarking and any deterministic replay. Leave true unless you
      # explicitly want wall-clock.
      - USE_SIM_TIME=${USE_SIM_TIME:-true}

      # Static (pre-built) point cloud publishing — disable if you only want
      # the live registration output and not the static scene PCD.
      - ENABLE_STATIC_PCD=${ENABLE_STATIC_PCD:-true}

      # NOTE: the following launch args are set inside the launch file but
      # the image's /entrypoint_x11.sh does NOT pass env vars through for
      # them yet. To tune at runtime they need an upstream entrypoint change
      # (mirroring the LOCAL_OBS_BUFFER_SEC pattern), or you can edit the
      # launch file in the image:
      #   - voxel_leaf_size       (downsampling, default 0.5m)
      #   - local_obs_voxel_size  (per-vehicle voxel, default 0.5m)
      #   - local_obs_publish_rate (default 10.0 Hz)
      #   - target_frame          (default 'map')
      #   - lidar_topic_suffix    (default 'LidarSensor1/points')

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority:ro
      - /dev/shm:/dev/shm:rw
      - /tmp/iceoryx2:/tmp/iceoryx2:rw
      # MAVROS demo scripts (mavros_velocity_demo.{sh,py})
      - ./compose/ardupilot-xfs/scripts:/scripts:ro

  # ---------------------------------------------------------------------------
  # QGroundControl X11 - Ground control station with GPU acceleration
  # ---------------------------------------------------------------------------
  qgroundcontrol-x11:
    image: dhdevspace/auto_mns:airsim-qgc-x11-latest
    pull_policy: if_not_present
    container_name: ardupilot-xfs-qgc
    hostname: ardupilot-xfs-qgc

    network_mode: "host"
    ipc: host

    user: "${UID:-1000}:${GID:-1000}"

    environment:
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: 1
      QGC_APPIMAGE: /opt/qgroundcontrol/QGroundControl.AppImage
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # Expose full NVIDIA capability set to the container — without this the
      # libGL inside the AppImage falls back to Mesa/llvmpipe and the QGC
      # window renders black on NVIDIA hosts (xdpyinfo passes, GL doesn't).
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: all
      LIBGL_ALWAYS_SOFTWARE: 0
      MESA_GL_VERSION_OVERRIDE: "3.3"
      # Plain xcb — `xcb:depth=24` was over-constraining the X11 visual on
      # NVIDIA's 32-bit-default colour depth and contributed to the black
      # window. Let Qt pick the depth that matches the host server.
      QT_QPA_PLATFORM: xcb

      # ---- QGC AppImage workaround: software Qt Quick backend ----
      # The QGroundControl AppImage in dhdevspace/auto_mns:airsim-qgc-x11-latest
      # bundles its own libGL/Qt5 stack that fails to negotiate a hardware GL
      # context against host NVIDIA — window paints solid black even when
      # glxinfo reports the NVIDIA renderer correctly. LD_PRELOAD-ing the host
      # libGL doesn't help because the AppImage dlopens its bundled libs by
      # absolute path from the extracted /tmp/.mount_*/ tree.
      #
      # Software-mode renders the UI fully (slower frame rate, no shader
      # effects). The cleaner long-term fix is upstream: rebuild the QGC
      # AppImage without bundling libGL, or replace the AppImage with a
      # plain `apt install qgroundcontrol`. Until then, software stays.
      QT_QUICK_BACKEND: software
      QSG_RENDER_LOOP: basic
      # Note: QT_QUICK_CONTROLS_STYLE=Default tried but did NOT recover the
      # missing top-toolbar nav chrome (Q menu, view switcher, settings gear).
      # Those buttons are tightly coupled to QGC's custom QGCButton shader
      # painting and aren't recoverable via env vars in software-Qt mode.
      # Workaround for users who need full QGC chrome: install QGC natively on
      # the host (`sudo apt install qgroundcontrol`) and stop this container —
      # native QGC uses the system Qt + NVIDIA libGL and renders cleanly.

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority:ro
      - ${CONFIG_ROOT?set CONFIG_ROOT}/qgroundcontrol/qgc_config:/config-template:ro
      - ${CONFIG_ROOT?set CONFIG_ROOT}/qgroundcontrol/user_config:/home/qgc/.config/QGroundControl

    devices:
      - /dev/dri:/dev/dri

    shm_size: "2gb"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              # 'display' is required for the AppImage's Qt+OpenGL surface to
              # bind to the host X11 + NVIDIA driver pair. Missing it produces
              # the black-window symptom even though xdpyinfo (X11) is healthy.
              capabilities: [gpu, graphics, utility, display]

    security_opt:
      - seccomp:unconfined

    group_add:
      - video

    init: true
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "xdpyinfo > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# =============================================================================
# No top-level named volumes — per-instance state lives in
# ./data/ardupilot-xfs/{instance_N,logs_N} at the repo root (host bind mounts,
# resolved via --project-directory in launch.sh).
# Inspect with: ls <repo-root>/data/ardupilot-xfs/
# Reset state: rm -rf <that dir>/* && docker compose up
# =============================================================================

networks:
  # Owned by the autonomy team. The Docker network MUST be literally named
  # `agent_external` (not `<project>_agent_external`). For solo sim testing
  # without the autonomy compose, pre-create it:
  #   docker network create agent_external \
  #     --subnet=172.28.0.0/24 --gateway=172.28.0.254
  agent_external:
    external: true

  # Sim-internal bridge. Today only `sim-netns` attaches; future sim-only
  # services (foxglove, scenario controller) can join here without touching
  # agent_external (the comms-under-test network).
  sim_internal:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/24
          ip_range: 172.29.0.0/24
          gateway: 172.29.0.254

  # Per-drone DDS islands for the airsim_bridge_dN + zenoh-bridge-N pairs.
  # The corresponding autonomy_stack-N container (autonomy team's compose)
  # also attaches to its own agent_internal-N to consume /CopterN/* topics
  # via DDS and exchange /shared/drone_N/* via the zenoh bridge.
  #
  # Declared `external: true` because launch.sh creates them up front via
  # `docker network create` (idempotent). This also avoids compose
  # complaining about pre-existing networks lacking the compose label, and
  # lets the autonomy team's compose attach autonomy_stack-N to the same
  # literal name without compose-project-prefix collisions. The subnet /
  # gateway authority lives in launch.sh's `ensure_agent_internal_networks`.
  agent_internal-1:
    external: true
    name: agent_internal-1
  agent_internal-2:
    external: true
    name: agent_internal-2
  agent_internal-3:
    external: true
    name: agent_internal-3
  agent_internal-4:
    external: true
    name: agent_internal-4
