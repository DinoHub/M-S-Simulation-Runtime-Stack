      - ROS_DISTRO=${SIM_ROS_DISTRO:-humble}
      - ROS_DOMAIN_ID=${DRONE_2_DOMAIN_ID:-2}
    command: ["-c", "/etc/zenoh/zenoh_bridge_drone.json5"]
    volumes:
      - ${CONFIG_ROOT?set CONFIG_ROOT}/zenoh/zenoh_bridge_drone_2.json5:/etc/zenoh/zenoh_bridge_drone.json5:ro
    depends_on:
      airsim_bridge_d2:
        condition: service_started

  zenoh-bridge-3:
