    volumes:
      - ${CONFIG_ROOT?set CONFIG_ROOT}/zenoh/zenoh_bridge_drone_3.json5:/etc/zenoh/zenoh_bridge_drone.json5:ro
    depends_on:
      airsim_bridge_d3:
        condition: service_started

  zenoh-bridge-4:
    <<: *zenoh-bridge-defaults
