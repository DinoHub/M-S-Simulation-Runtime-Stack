  # ===========================================================================
  # PER-DRONE ZENOH BRIDGES (--with-agent-external profile)
  # ===========================================================================
  # One zenoh-bridge-ros2dds per drone, attached to BOTH its own
  # agent_internal-N (DDS side, sees the airsim_bridge_dN topics) and
  # agent_external (zenoh side, gossips with the autonomy team's
  # autonomy_stack-N peers).
  #
  # Topic ownership (asymmetric):
  #   - drone N publishes /shared/drone_N/* outward to zenoh
  #   - drone N subscribes to /shared/sim/* and /shared/swarm/*
  # See config/zenoh/zenoh_bridge_drone_{1..N}.json5 for details.
  # ===========================================================================
  zenoh-bridge-1:
    <<: *zenoh-bridge-defaults
    container_name: ardupilot-xfs-zenoh-bridge-1
    hostname: zenoh-bridge-1
    networks:
      - agent_internal-1
      - agent_external
    environment:
      - RUST_LOG=zenoh=info,zenoh_plugin_ros2dds=info
      - ROS_LOCALHOST_ONLY=0
      - ROS_DISTRO=${SIM_ROS_DISTRO:-humble}
      - ROS_DOMAIN_ID=${DRONE_1_DOMAIN_ID:-1}
    command: ["-c", "/etc/zenoh/zenoh_bridge_drone.json5"]
    volumes:
      - ${CONFIG_ROOT:-./config}/zenoh/zenoh_bridge_drone_1.json5:/etc/zenoh/zenoh_bridge_drone.json5:ro
    depends_on:
      airsim_bridge_d1:
        condition: service_started

  zenoh-bridge-2:
    <<: *zenoh-bridge-defaults
    container_name: ardupilot-xfs-zenoh-bridge-2
    hostname: zenoh-bridge-2
    networks:
      - agent_internal-2
      - agent_external
    environment:
      - RUST_LOG=zenoh=info,zenoh_plugin_ros2dds=info
      - ROS_LOCALHOST_ONLY=0
      - ROS_DISTRO=${SIM_ROS_DISTRO:-humble}
      - ROS_DOMAIN_ID=${DRONE_2_DOMAIN_ID:-2}
    command: ["-c", "/etc/zenoh/zenoh_bridge_drone.json5"]
    volumes:
      - ${CONFIG_ROOT:-./config}/zenoh/zenoh_bridge_drone_2.json5:/etc/zenoh/zenoh_bridge_drone.json5:ro
    depends_on:
      airsim_bridge_d2:
        condition: service_started

  zenoh-bridge-3:
    <<: *zenoh-bridge-defaults
    container_name: ardupilot-xfs-zenoh-bridge-3
    hostname: zenoh-bridge-3
    networks:
      - agent_internal-3
      - agent_external
    environment:
      - RUST_LOG=zenoh=info,zenoh_plugin_ros2dds=info
      - ROS_LOCALHOST_ONLY=0
