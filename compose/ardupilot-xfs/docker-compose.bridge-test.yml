# =============================================================================
# Lightweight test consumers — one per drone, one per agent_internal-N LAN.
# Each subscribes/lists topics at ROS_DOMAIN_ID=N on the matching network,
# proving the per-drone bridge actually delivers /Copter{N}/* to anything
# attached to agent_internal-N at the right domain.
#
# Bring-up:   docker compose -f docker-compose.bridge-test.yml up -d
# Probe:      docker exec ardupilot-xfs-bridge-test-d1 bash -lc \
#               'source /opt/ros/humble/setup.bash && ros2 topic list'
# Tear-down:  docker compose -f docker-compose.bridge-test.yml down
# =============================================================================

x-bridge-test-base: &bridge-test-defaults
  image: ros:humble-ros-base
  init: true
  command: ["sleep", "infinity"]
  stdin_open: true
  tty: true

services:
  bridge_test_d1:
    <<: *bridge-test-defaults
    container_name: ardupilot-xfs-bridge-test-d1
    environment:
      # Defaults to per-drone domain (vendored design); override with
      # BRIDGE_TEST_D1_DOMAIN_ID=20 (etc.) when testing against a sim
      # configured for a flat autonomy-team domain.
      - ROS_DOMAIN_ID=${BRIDGE_TEST_D1_DOMAIN_ID:-1}
      - ROS_LOCALHOST_ONLY=0
    networks:
      - agent_internal-1

  bridge_test_d2:
    <<: *bridge-test-defaults
    container_name: ardupilot-xfs-bridge-test-d2
    environment:
      - ROS_DOMAIN_ID=${BRIDGE_TEST_D2_DOMAIN_ID:-2}
      - ROS_LOCALHOST_ONLY=0
    networks:
      - agent_internal-2

  bridge_test_d3:
    <<: *bridge-test-defaults
    container_name: ardupilot-xfs-bridge-test-d3
    environment:
      - ROS_DOMAIN_ID=${BRIDGE_TEST_D3_DOMAIN_ID:-3}
      - ROS_LOCALHOST_ONLY=0
    networks:
      - agent_internal-3

  bridge_test_d4:
    <<: *bridge-test-defaults
    container_name: ardupilot-xfs-bridge-test-d4
    environment:
      - ROS_DOMAIN_ID=${BRIDGE_TEST_D4_DOMAIN_ID:-4}
      - ROS_LOCALHOST_ONLY=0
    networks:
      - agent_internal-4

networks:
  agent_internal-1:
    external: true
  agent_internal-2:
    external: true
  agent_internal-3:
    external: true
  agent_internal-4:
    external: true
