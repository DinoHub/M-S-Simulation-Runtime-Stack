# =============================================================================
# Per-drone agent_internal-N LANs for the per-drone-bridge architecture.
#
# Bring-up:   docker compose -f docker-compose.networks.yml up --no-start
# Tear-down:  docker compose -f docker-compose.networks.yml down
#
# Subnets match the runtime spec (172.28.N.0/24). Networks declare
# `name: agent_internal-N` so docker uses that exact name (no compose-prefix);
# both docker-compose.bridges.yml and docker-compose.bridge-test.yml reference
# them as `external: true`.
# =============================================================================

# A no-op service so `docker compose up` accepts the file. The `never` profile
# keeps it from starting in any normal invocation.
services:
  _networks_anchor:
    image: alpine:3.20
    profiles: ["never"]
    command: ["true"]

networks:
  agent_internal-1:
    name: agent_internal-1
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.1.0/24
          gateway: 172.28.1.254
  agent_internal-2:
    name: agent_internal-2
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.2.0/24
          gateway: 172.28.2.254
  agent_internal-3:
    name: agent_internal-3
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.3.0/24
          gateway: 172.28.3.254
  agent_internal-4:
    name: agent_internal-4
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.4.0/24
          gateway: 172.28.4.254
