      - ROS_LOCALHOST_ONLY=0
    networks:
      - agent_internal-2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "bash"
      - "-lc"
      - >
        source /airsim_ros2_ws/install/setup.bash &&
        ros2 launch airsim_ros_pkgs mavros_bringup.launch.py
        vehicle:='Copter2'
        fcu_url:='tcp://host.docker.internal:5770'
        target_system_id:=2
    depends_on:
