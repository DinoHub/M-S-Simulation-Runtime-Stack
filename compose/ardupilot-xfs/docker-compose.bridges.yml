      - ROS_LOCALHOST_ONLY=0
    networks:
      - agent_internal-3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "bash"
      - "-lc"
      - >
        source /airsim_ros2_ws/install/setup.bash &&
