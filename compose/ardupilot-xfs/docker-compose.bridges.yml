# =============================================================================
# AirSim ROS 2 bridges — INTEGRATION MODE — GENERATED FILE
#
#   DO NOT EDIT BY HAND.
#   Regenerate with:  python generate_compose.py --drones N --mode integration
#
# Bridges-only compose. Pairs with an EXTERNAL autonomy-stack compose that
# already creates the per-drone agent_internal-N networks. Bring-up order:
#
#   1. Start the autonomy-stack first (creates agent_internal-1..N).
#   2. docker compose -f docker-compose.bridges.yml up
#
# Each airsim_bridge_dN attaches to its drone's agent_internal-N network and
# reaches AirSim RPC on the host via host-gateway. The autonomy-stack's
# autonomy node (or MAVROS, planner, etc.) lives on the same agent_internal-N
# and consumes /DroneN/* topics over DDS.
#
# See ../README.md for verification + the optional --profile test fixture.
# =============================================================================

x-airsim-bridge: &airsim-bridge-defaults
  image: dhdevspace/auto_mns:tevv-airstack-ros2-x11-node-development
  init: true
  restart: unless-stopped
  ipc: host
  volumes:
    - /dev/shm:/dev/shm:rw
    - /tmp/iceoryx2:/tmp/iceoryx2:rw
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:

  # =========================================================================
  # DRONE 1
  # =========================================================================
  airsim_bridge_d1:
    <<: *airsim-bridge-defaults
    container_name: airsim_bridge_d1
    # CLOCK MASTER: this bridge owns /clock, world_ned static TF,
    # /origin_geo_point, and fleet services. Exactly one bridge in
    # the swarm enables coordination (see launch arg description).
    environment:
      - ROS_DOMAIN_ID=${DRONE_1_DOMAIN_ID:-1}
      - ROS_LOCALHOST_ONLY=0
      - AIRSIM_HOST_IP=${AIRSIM_HOST_IP:-host.docker.internal}
      - AIRSIM_HOST_PORT=${AIRSIM_HOST_PORT:-41451}
      - VEHICLE_NAME=${VEHICLE_1_NAME:-Copter1}
    networks:
      - agent_internal-1
    command:
      - "bash"
      - "-lc"
      - >
        source /airsim_ros2_ws/install/setup.bash &&
        ros2 launch airsim_ros_pkgs airsim_bringup.launch.py
        host_ip:=${AIRSIM_HOST_IP:-host.docker.internal}
        host_port:=${AIRSIM_HOST_PORT:-41451}
        vehicles:="['${VEHICLE_1_NAME:-Copter1}']"
        enable_localization:=true
        enable_coordination:=true
        local_obs_target_frame:=${LOCAL_OBS_TARGET_FRAME:-map}

  # ----------------------------------------------------------------------
  # mavros_d1: TEST FIXTURE (--profile test) for the MAVROS↔SITL path.
  # NOT a production service — autonomy_stack_1 owns MAVROS in production.
  # DO NOT enable --profile test alongside the real autonomy stack: the two
  # MAVROSes will collide on /Copter1/mavros/*.
  # ----------------------------------------------------------------------
  mavros_d1:
    image: dhdevspace/auto_mns:tevv-airstack-ros2-x11-node-development
    container_name: airsim_mavros_test_d1
    init: true
    restart: unless-stopped
    profiles: ["test"]
    environment:
      - ROS_DOMAIN_ID=${DRONE_1_DOMAIN_ID:-1}
      - ROS_LOCALHOST_ONLY=0
    networks:
      - agent_internal-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "bash"
      - "-lc"
      - >
        source /airsim_ros2_ws/install/setup.bash &&
        ros2 launch airsim_ros_pkgs mavros_bringup.launch.py
        vehicle:='Copter1'
        fcu_url:='tcp://host.docker.internal:5760'
        target_system_id:=1
    depends_on:
      airsim_bridge_d1:
        condition: service_started

  # =========================================================================
  # DRONE 2
  # =========================================================================
  airsim_bridge_d2:
    <<: *airsim-bridge-defaults
    container_name: airsim_bridge_d2
    # Non-clock-master: relies on drone-1 for /clock + TF root.
    # Per-drone DDS domain isolation is the secondary belt against crosstalk.
    environment:
      - ROS_DOMAIN_ID=${DRONE_2_DOMAIN_ID:-2}
      - ROS_LOCALHOST_ONLY=0
      - AIRSIM_HOST_IP=${AIRSIM_HOST_IP:-host.docker.internal}
      - AIRSIM_HOST_PORT=${AIRSIM_HOST_PORT:-41451}
      - VEHICLE_NAME=${VEHICLE_2_NAME:-Copter2}
    networks:
      - agent_internal-2
    command:
      - "bash"
      - "-lc"
      - >
        source /airsim_ros2_ws/install/setup.bash &&
        ros2 launch airsim_ros_pkgs airsim_bringup.launch.py
        host_ip:=${AIRSIM_HOST_IP:-host.docker.internal}
        host_port:=${AIRSIM_HOST_PORT:-41451}
        vehicles:="['${VEHICLE_2_NAME:-Copter2}']"
        enable_localization:=true
        enable_coordination:=false
        local_obs_target_frame:=${LOCAL_OBS_TARGET_FRAME:-map}

  # ----------------------------------------------------------------------
  # mavros_d2: TEST FIXTURE (--profile test) for the MAVROS↔SITL path.
  # NOT a production service — autonomy_stack_2 owns MAVROS in production.
  # DO NOT enable --profile test alongside the real autonomy stack: the two
