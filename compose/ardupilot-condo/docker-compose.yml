# =============================================================================
# =============================================================================
# ArduPilot + AirSim Condo + ROS2 — Standalone Simulation Stack
# =============================================================================
#
# Self-contained: no extends, no build contexts, no bridge networks.
# All services run on host networking (network_mode: host, ipc: host).
#
# Required environment variables (set in a .env file or export before running):
#   CONFIG_ROOT   — absolute path to the config root containing:
#                     ardupilot/config/
#                     unreal-airsim/condo/settings.json
#   UID / GID     — numeric user/group id for GPU-capable services
#   DISPLAY       — X11 display (e.g. :1)
#   XAUTHORITY    — path to Xauthority file (e.g. /run/user/1000/gdm/Xauthority)
#
# Optional image overrides:
#   ARDUPILOT_IMAGE      (default: dhdevspace/auto_mns:ardupilot-slim)
#   AIRSIM_CONDO_IMAGE   (default: dhdevspace/auto_mns:tevv-airsim-condo-latest-ceilingless)
#   AIRSIM_BRIDGE_IMAGE  (default: dhdevspace/auto_mns:airsim-ros2-bridge)
#   QGC_IMAGE            (default: dhdevspace/auto_mns:airsim-qgc-x11-latest)
#
# Usage:
#   xhost +local:docker
#   export UID=$(id -u) GID=$(id -g) DISPLAY=$DISPLAY XAUTHORITY=$XAUTHORITY
#   export CONFIG_ROOT=/path/to/config
#   docker compose up
#
# Startup order:
#   1. ardupilot-drone-0  — ArduPilot SITL (waits internally for AirSim API, up to 120 s)
#   2. airsim-condo       — Unreal/AirSim Condo scene (depends_on: ardupilot-drone-0)
#   3. airsim_bridge_d1 + mavros_d1 — standalone bridge + MAVROS (depends_on: airsim-condo healthy)
# =============================================================================

name: ardupilot-condo

services:

  # ---------------------------------------------------------------------------
  # ArduPilot SITL
  # ---------------------------------------------------------------------------
  ardupilot-drone-0:
    image: ${ARDUPILOT_IMAGE:-dhdevspace/auto_mns:ardupilot-slim}
    pull_policy: if_not_present
    container_name: ardupilot-drone-0
    hostname: ardupilot-drone-0
    restart: "no"

    network_mode: host

    user: "0:0"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

    environment:
      - ARDUPILOT_SIM_HOSTNAME=${ARDUPILOT_SIM_HOSTNAME:-localhost}
      - ARDUPILOT_HOME_LAT=${ARDUPILOT_HOME_LAT:-42.764938}
      - ARDUPILOT_HOME_LON=${ARDUPILOT_HOME_LON:--115.579201}
      - ARDUPILOT_HOME_ALT=${ARDUPILOT_HOME_ALT:-1183}
      - INSTANCE_NUM=0

    volumes:
      - ardupilot_instance_0:/ardupilot_workspace/instances/instance_0
      - ardupilot_logs_0:/ardupilot_data/logs
      - ${CONFIG_ROOT:-./config}/ardupilot/config:/ardupilot_config:ro

    command: ["0"]

    healthcheck:
      test: ["CMD-SHELL", "test -f /ardupilot_workspace/ardupilot/build/sitl/bin/arducopter && pgrep -f arducopter"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 120s

  # ---------------------------------------------------------------------------
  # AirSim Condo — Unreal Engine simulator
  # ---------------------------------------------------------------------------
  airsim-condo:
    image: ${AIRSIM_CONDO_IMAGE:-dhdevspace/auto_mns:tevv-airsim-condo-latest-ceilingless}
    pull_policy: if_not_present
    container_name: airsim-condo
    hostname: airsim-condo
    restart: unless-stopped

    depends_on:
      ardupilot-drone-0:
        condition: service_started

    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - video
    init: true

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY:-:1}
      - SDL_VIDEODRIVER=${SDL_VIDEODRIVER:-x11}
      - XAUTHORITY=/tmp/.Xauthority

    network_mode: host
    ipc: host

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/run/user/1000/gdm/Xauthority}:/tmp/.Xauthority:ro
      - /dev/shm:/dev/shm:rw
      - /tmp/iceoryx2:/tmp/iceoryx2:rw
      # settings.json mounted to both locations: Documents/AirSim (primary) and
      # the executable directory (fallback), consistent with upstream behaviour.
      - ${CONFIG_ROOT:-./config}/unreal-airsim/condo/settings.json:/home/airsim_user/Documents/AirSim/settings.json:ro
      - ${CONFIG_ROOT:-./config}/unreal-airsim/condo/settings.json:/app/Condo/settings.json:ro

    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting 3s for ArduPilot to initialize..."
        sleep 3
        exec /usr/local/bin/airsim-entrypoint.sh /app/Condo/Condo.sh -windowed -ResX=1920 -ResY=1080

    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 41451 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

      

  # ---------------------------------------------------------------------------
  # AirSim ROS2 bridge (standalone image — replaces the legacy ros2-x11 monolith)
  # ---------------------------------------------------------------------------
  airsim_bridge_d1:
    image: ${AIRSIM_BRIDGE_IMAGE:-dhdevspace/auto_mns:airsim-ros2-bridge}
    pull_policy: if_not_present
    container_name: airsim_bridge_d1
    hostname: airsim_bridge_d1
    init: true
    restart: unless-stopped

    network_mode: host
    ipc: host

    user: "${UID:-1000}:${GID:-1000}"

    depends_on:
      # service_healthy (NOT service_started): single_vehicle.launch.py's
      # vehicle node queries AirSim's RPC port on launch with no retry; a
      # call landing mid engine-init can crash the sim. Gate on the
      # airsim-condo healthcheck (RPC port open).
      airsim-condo:
        condition: service_healthy

    environment:
      # HOME must point at a writable dir: the container runs as uid 1000,
      # which is absent from the image's /etc/passwd, so HOME would default
      # to / and `ros2 launch` would fail to create its ~/.ros/log dir.
      - HOME=/tmp
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.Xauthority
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - AIRSIM_HOST_IP=${AIRSIM_HOST_IP:-127.0.0.1}
      - AIRSIM_HOST_PORT=${AIRSIM_HOST_PORT:-41451}
      - VEHICLE_NAME=${VEHICLE_1_NAME:-Copter1}

    volumes:
      - /dev/shm:/dev/shm:rw
      - /tmp/iceoryx2:/tmp/iceoryx2:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/run/user/1000/gdm/Xauthority}:/tmp/.Xauthority:ro

    # The image ENTRYPOINT sources ROS + the bridge workspace, then exec's
    # this argv directly — no `bash -lc "source ... && ..."` wrapper needed.
    command:
      - "ros2"
      - "launch"
      - "airsim_ros2_bridge"
      - "single_vehicle.launch.py"
      - "vehicle_name:=${VEHICLE_1_NAME:-Copter1}"
      - "host_ip:=${AIRSIM_HOST_IP:-127.0.0.1}"
      - "host_port:=${AIRSIM_HOST_PORT:-41451}"
      - "enable_localization:=true"
      - "enable_coordination:=false"
      - "enable_local_obs:=${ENABLE_LOCAL_OBS:-true}"
      - "local_obs_target_frame:=${LOCAL_OBS_TARGET_FRAME:-map}"
      - "local_obs_buffer_sec:=${LOCAL_OBS_BUFFER_SEC:-5.0}"
      - "local_obs_voxel_size:=${LOCAL_OBS_VOXEL_SIZE:-0.15}"

  # ---------------------------------------------------------------------------
  # MAVROS toward the ArduPilot SITL (same image family — ships airsim_mavros_bringup
  # + mavros + mavros_msgs). The ArduPilot SITL exposes the FCU on UDP 14550
  # (matches the legacy monolith's MAVROS_FCU_URL).
  # ---------------------------------------------------------------------------
  mavros_d1:
    image: ${AIRSIM_BRIDGE_IMAGE:-dhdevspace/auto_mns:airsim-ros2-bridge}
    pull_policy: if_not_present
    container_name: mavros_d1
    hostname: mavros_d1
    # init: false (intentional). mavros_bringup.launch.py's DDS cleanup step
    # forks children; with tini as PID 1 they get re-parented and never
    # finish, hanging bring-up. The bash -lc wrapper keeps bash as PID 1.
    init: false
    restart: unless-stopped

    network_mode: host
    ipc: host

    user: "${UID:-1000}:${GID:-1000}"

    depends_on:
      airsim_bridge_d1:
        condition: service_started
      ardupilot-drone-0:
        condition: service_started

    environment:
      # Same writable-HOME fix as airsim_bridge_d1.
      - HOME=/tmp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0

    volumes:
      - /dev/shm:/dev/shm:rw

    command:
      - "bash"
      - "-lc"
      - >
        ros2 launch airsim_mavros_bringup mavros_bringup.launch.py
        vehicle:=${VEHICLE_1_NAME:-Copter1}
        fcu_url:=${MAVROS_FCU_URL:-udp://:14550@127.0.0.1:14550}
        target_system_id:=1
        mavros_config:=mavros_ardupilot.yaml
        enable_dds_cleanup:=true

  # ---------------------------------------------------------------------------
  # QGroundControl X11 — Ground control station with GPU acceleration
  # ---------------------------------------------------------------------------
  qgroundcontrol-x11:
    image: ${QGC_IMAGE:-dhdevspace/auto_mns:airsim-qgc-x11-latest}
    pull_policy: if_not_present
    container_name: ardupilot-condo-qgc
    hostname: ardupilot-condo-qgc

    network_mode: "host"
    ipc: host

    user: "${UID:-1000}:${GID:-1000}"

    environment:
      # X11 forwarding
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: 1

      # QGroundControl
      QGC_APPIMAGE: /opt/qgroundcontrol/QGroundControl.AppImage
      APPIMAGE_EXTRACT_AND_RUN: "1"

      # GPU / rendering
      LIBGL_ALWAYS_SOFTWARE: 0
      MESA_GL_VERSION_OVERRIDE: "3.3"
      QT_QPA_PLATFORM: "xcb:depth=24"

    volumes:
      # X11 socket + auth
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority:ro
      # QGC config (comm links template + persistent user config)
      - ${CONFIG_ROOT?set CONFIG_ROOT}/qgroundcontrol/qgc_config:/config-template:ro
      - ${CONFIG_ROOT?set CONFIG_ROOT}/qgroundcontrol/user_config:/home/qgc/.config/QGroundControl

    devices:
      - /dev/dri:/dev/dri

    shm_size: "2gb"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, graphics, utility]

    security_opt:
      - seccomp:unconfined

    group_add:
      - video

    init: true
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "xdpyinfo > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s


# =============================================================================
# Named volumes
# =============================================================================
volumes:
  ardupilot_instance_0:
    name: ardupilot_condo_instance_0
  ardupilot_logs_0:
    name: ardupilot_condo_logs_0
