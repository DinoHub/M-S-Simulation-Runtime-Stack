# Changes to casio-siyi's extensions (../casio-siyi/casio/extensions.yaml)
# for the camera-realism scenario. Merged over that file, mapping by mapping.

mns.topics:
  renames:
    # The bridge's ideal frames go to the realism service, not to casio.
    siyi_Scene/image: camera/image_sim
    siyi_Scene/camera_info: camera/camera_info_sim

mns.services:
  # Relative to this spec folder: casio-siyi's files, not copies of them.
  files:
    casio-models: ../casio-siyi/casio-config/models
    casio-configs: ../casio-siyi/casio-config/deployment/configs
    casio: ../casio-siyi/casio
  services:
    # /camera/image_sim -> /camera/image_raw with the A8's lens distortion,
    # sensor noise and compression; /camera/camera_info with the A8's K and D.
    # Parameters lens, noise_read, noise_gain and jpeg_quality switch each
    # stage (casio/realism/camera_realism.py).
    camera_realism:
      image: dhdevspace/auto_mns:casio-node
      command: >
        bash -c "
        source /opt/ros/humble/setup.bash &&
        source /ros2_ws/install/setup.bash &&
        python3 /cfg/services/casio/realism/camera_realism.py --ros-args
        -p use_sim_time:=true
        -p calibration_file:=/cfg/services/casio-configs/siyi_a8_calibration.yaml
        "
