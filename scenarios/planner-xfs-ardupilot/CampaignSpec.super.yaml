schema: mns.campaign.v1
id: planner-xfs-super
name: SUPER on the XFS yard course, three calm flights

# The scenario names no planner: the planner under test is attached here.
# CampaignSpec.yaml is the same campaign with MIGHTY attached.
scenario: ./ScenarioSpec.yaml

extensions:
  mns.components:
    - ../../components/super

variants:
  - id: calm
    name: No wind

repeats: 3

recording:
  keep: first
  topics:
    - /ground_truth/odom
    - /registered_point_cloud
    - /goal
    - /Drone1/mavros/setpoint_raw/local
    - /Drone1/mavros/state
    - /imu/data
    - /clock

mission:
  source: external
  goals: ./courses/yard-detour.yaml
  done: timeout
  timeout_s: 10
  autopilot: ardupilot
