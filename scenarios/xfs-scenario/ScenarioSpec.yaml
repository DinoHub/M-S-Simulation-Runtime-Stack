# LEGACY v1 SCENARIO SPEC — not usable with the standalone-v2 image set.
#
# v2 selects a world with environment.id + environment.version +
# environment.artifact_digest, and images/image-set.generated.yaml now ships a
# single generic simulator (tevv_runtime_host) that loads the level pack those
# fields name. This file still names a v1 per-world simulator key, which the
# overlay no longer defines, so `product.sh cli runtime` and the dashboard
# cannot generate a runnable stack from it and `tools/images.sh drift` skips
# it by design.
#
# It is kept as a reference for the legacy static compose stacks under
# compose/ (driven by launch.sh, which never reads this file). To get a
# runnable v2 spec, install a level pack (tools/install-demo-packs.sh) and
# re-author the scenario in ScenarioLab.
schema: mns.scenario.v1
id: xfs-scenario
name: xfs-scenario
environment:
  id: xfs
runtime:
  profile: airsim_unreal_px4_docker
  features:
    sim_real_eval: true
    ros2_bridge: true
    qgroundcontrol: false
    mavros: false
vehicles:
  - id: drone_1
    name: Drone1
    runtime_name: Drone1
    ros_domain_id: 1
    start:
      x: 0
      'y': 0
      z: 0
      yaw: 0
    cameras:
      front:
        capture_settings:
          - image_type: 0
            fov_degrees: 190
            width: 1344
            height: 1344
            # numeric enum, passed straight into AirSim's FisheyeModel:
            # 0=Equidistant(Kannala-Brandt) 1=Stereographic 2=Equisolid
            # 3=Polynomial(OpenCV) 4=DoubleSphere — a string here crashes
            # AirSim at startup (json type_error.302)
            fisheye_model: 0
            fisheye_fx: 405
            fisheye_fy: 405
            fisheye_cx: 672
            fisheye_cy: 672
            fisheye_circular_mask: true
    sensors:
      imu: true
      gps: true
      barometer: true
      magnetometer: true
      gpu_lidars:
        - name: GPUlidar1
          # explicit: generator <= v0.2.0-review.16 leaves collection-form
          # lidars Enabled=false unless stated
          enabled: true
          position:
            x: 0
            'y': 0
            z: 0
          rotation:
            roll: 0
            pitch: 0
            yaw: 0
          number_of_channels: 16
          rotations_per_second: 10
          points_per_second: 300000
          vertical_fov_upper: 15
          vertical_fov_lower: -15
          range: 100
