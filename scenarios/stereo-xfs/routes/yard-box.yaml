# The reference flight, flown from the XFS container-yard spawn. Every VIO
# characterisation campaign flies these same legs, so a difference between two
# runs is the environment's or the estimator's and never the trajectory's.
#
# Ported from the tevv_ws harness (campaigns c2 through c7), then mirrored
# west (x -> -x, yaw -> pi - yaw): from the yard spawn a container stack
# stands about 4 m to the east, two high, and the original first leg was 10 m
# east. West and north are open for 20-30 m. Same legs, timings, altitudes and
# excitation; only the side of the start it flies on. vio-osmo-xfs flies the
# same file.
#
#   t  0- 8   stationary on the ground        static initialisation window
#   t  8-15   climb to 2 m, then hold         takeoff excitation, then a still hover
#   t 15-25   west 10 m, heading west         forward translation
#   t 25-31   north 6 m, heading west         lateral translation
#   t 31-34   climb 2 -> 4 m in place         altitude change
#   t 34-37   yaw west -> north
#   t 37-43   north 6 m, heading north        translation along the new heading
#   t 43-46   yaw north -> east
#   t 46-56   east 10 m, heading east         out-and-back toward the start line
#   t 56-68   south 12 m, descend 4 -> 2 m    return over the start
#   t 68-72   hold, then land
#
# Speeds: 1 m/s translation, 0.67 m/s climb, 30 deg/s turns. Legs are long
# enough that a 2.5 s window covers one manoeuvre at a time, which is what
# makes per-manoeuvre error attributable.
#
# Local ENU relative to the takeoff point: +x east (NED +Y), +y north
# (NED +X). Yaw is ENU, 0 facing east.
name: xfs_yard_box_v1
frame_id: map
relative_to_start: true
rate_hz: 20
prestream_seconds: 2
finish_hold_seconds: 3
waypoints:
  - {t: 0, position: [0, 0, 0], yaw: 3.1416}
  - {t: 8, position: [0, 0, 0], yaw: 3.1416}
  - {t: 11, position: [0, 0, 2], yaw: 3.1416}
  - {t: 15, position: [0, 0, 2], yaw: 3.1416}
  - {t: 25, position: [-10, 0, 2], yaw: 3.1416}
  - {t: 31, position: [-10, 6, 2], yaw: 3.1416}
  - {t: 34, position: [-10, 6, 4], yaw: 3.1416}
  - {t: 37, position: [-10, 6, 4], yaw: 1.5708}
  - {t: 43, position: [-10, 12, 4], yaw: 1.5708}
  - {t: 46, position: [-10, 12, 4], yaw: -0.0}
  - {t: 56, position: [0, 12, 4], yaw: -0.0}
  - {t: 68, position: [0, 0, 2], yaw: -0.0}
  - {t: 72, position: [0, 0, 2], yaw: -0.0}
