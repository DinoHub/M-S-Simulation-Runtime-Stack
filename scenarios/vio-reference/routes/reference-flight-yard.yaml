# The reference flight mirrored in x, for the XFS yard spawn (423, -906).
#
# reference-flight.yaml opens with a +x leg that, from the yard, climbs into the
# container stacks: on 29 Sep 2026 PX4 left the route at t ~35 s on the 4 m
# climb at (10, 6) and ended 22 m off. Mirroring in x (x -> -x, heading
# theta -> 180 deg - theta) keeps every leg the same manoeuvre relative to the
# vehicle -- forward 10 m, sideways 6 m, climb, yaw, forward, yaw, out and back --
# and is the route the fisheye gap tests fly cleanly from this spawn
# (scenarios/gap-fisheye-xfs/routes/xfs_yard_box.b64).
#
#   t  0- 8   stationary on the ground        static initialisation window
#   t  8-15   climb to 2 m, then hold         heading 180
#   t 15-25   forward -x 10 m, heading 180    forward translation
#   t 25-31   sideways +y 6 m, heading 180    lateral translation
#   t 31-34   climb 2 -> 4 m in place
#   t 34-37   yaw 180 -> 90 deg
#   t 37-43   forward +y 6 m, heading 90
#   t 43-46   yaw 90 -> 0 deg
#   t 46-56   +x 10 m, heading 0              out-and-back toward the start line
#   t 56-68   -y 12 m, descend 4 -> 2 m       return over the start
#   t 68-72   hold, then land
name: reference_flight_yard_v1
frame_id: map
relative_to_start: true
rate_hz: 20
prestream_seconds: 2
finish_hold_seconds: 3
waypoints:
  - {t: 0,  position: [0, 0, 0], yaw: 3.1416}
  - {t: 8,  position: [0, 0, 0], yaw: 3.1416}
  - {t: 11, position: [0, 0, 2], yaw: 3.1416}
  - {t: 15, position: [0, 0, 2], yaw: 3.1416}
  - {t: 25, position: [-10, 0, 2], yaw: 3.1416}
  - {t: 31, position: [-10, 6, 2], yaw: 3.1416}
  - {t: 34, position: [-10, 6, 4], yaw: 3.1416}
  - {t: 37, position: [-10, 6, 4], yaw: 1.5708}
  - {t: 43, position: [-10, 12, 4], yaw: 1.5708}
  - {t: 46, position: [-10, 12, 4], yaw: 0}
  - {t: 56, position: [0, 12, 4], yaw: 0}
  - {t: 68, position: [0, 0, 2], yaw: 0}
  - {t: 72, position: [0, 0, 2], yaw: 0}
