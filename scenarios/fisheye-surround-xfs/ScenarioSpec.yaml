# Four 190 deg circular fisheyes around a quadrotor over the XFS yard, rendered
# from one shared cubemap per frame (group "surround", anchored 0.35 m below
# the cameras) and published over shared memory (iceoryx2), sync capture at
# 30 Hz. Made in the dashboard: stereo-xfs used as a basis, then Generate's
# camera rig preset "4 fisheye surround, shared cubemap".
#
# Measured on 4 Oct 2026 (runtime host zones.2, parked): each camera about
# 27 msg/s, 18.6 new frames/s, every frame stamp shared by all four.
#
# No estimator: attach one as a component (a fisheye VIO) from outside.
schema: mns.scenario.v1
id: fisheye-surround-xfs
name: fisheye-surround-xfs
