# casio-edge on the simulated SIYI A8 mini: the scenario's extensions,
# included by ../ScenarioSpec.yaml. The generator turns mns.services into
# services of the generated stack on Drone1's network and ROS domain, with
# the stack's middleware (runtime.ros) and its DDS config at /cfg/dds; the
# files below are staged into the stack and mounted at /cfg/services/<name>.

# casio's names for the camera. The bridge's own names are
# siyi_Scene/image and siyi_Scene/camera_info.
mns.topics:
  renames:
    siyi_Scene/image: camera/image_raw
    siyi_Scene/camera_info: camera/camera_info

mns.services:
  vehicle: Drone1
  # Paths are relative to the spec folder (scenarios/casio-siyi), not to
  # this file: includes are merged into the spec before they are read.
  files:
    # Not committed: hard-link or copy ~/casio-config next to the spec
    # (casio/README.md, "On a new machine").
    casio-models: casio-config/models
    casio-configs: casio-config/deployment/configs
    casio: casio
  volumes:
    # TensorRT engines built on this GPU; the Jetson's are incompatible.
    detection_x86_models: {}
    da3_x86_models: {}
  services:
    detection:
      image: dhdevspace/auto_mns:casio-detection
      gpus: all
      volumes:
        - detection_x86_models:/models/detection
      command: >
        bash -c "
        mkdir -p /models/detection/engines &&
        cp -u /cfg/services/casio-models/detection/yolo11s.onnx /models/detection/yolo11s.onnx &&
        if [ ! -s /models/detection/engines/yolo11s.engine ]; then
          trtexec --onnx=/models/detection/yolo11s.onnx --saveEngine=/models/detection/engines/yolo11s.engine --fp16;
        fi &&
        source /opt/ros/humble/setup.bash &&
        source /ros2_ws/install/setup.bash &&
        source /detection_ws/install/setup.bash &&
        ros2 run casio_detection detector_node --ros-args
        --params-file /detection_ws/install/share/casio_detection/config/detector.yaml
        -p use_sim_time:=true
        -p publish_empty:=true
        -p backend:=tensorrt
        -p engine_path:=/models/detection/engines/yolo11s.engine
        "

    depth_anything_v3:
      image: dhdevspace/auto_mns:casio-da3
      gpus: all
      volumes:
        - da3_x86_models:/models/depth_anything_v3
      command: >
        bash -c "
        cp -u /cfg/services/casio-models/depth_anything_v3/DA3METRIC-LARGE.onnx /models/depth_anything_v3/DA3METRIC-LARGE.onnx &&
        source /opt/ros/humble/setup.bash &&
        source /ros2_ws/install/setup.bash &&
        source /ws/install/setup.bash &&
        ros2 launch casio_depth_anything_v3 depth_anything_v3.launch.py
        input_image_topic:=/camera/image_raw
        input_camera_info_topic:=/camera/camera_info
        output_depth_topic:=/depth/image
        "

    casio_pointcloud:
      image: dhdevspace/auto_mns:casio-node
      command: >
        bash -c "
        source /opt/ros/humble/setup.bash &&
        source /ros2_ws/install/setup.bash &&
        ros2 launch casio_pointcloud depth_mapping.launch.py
        depth_topic:=/depth/image
        camera_info_topic:=/camera/camera_info
        map_frame:=map
        tf_lookup_timeout_s:=0.3
        use_sim_time:=true
        pixel_stride:=10
        "

    casio_description:
      image: dhdevspace/auto_mns:casio-node
      command: >
        bash -c "
        source /opt/ros/humble/setup.bash &&
        source /ros2_ws/install/setup.bash &&
        ros2 launch casio_description robot_description.launch.py
        use_sim_time:=true
        "

    casio_range:
      image: dhdevspace/auto_mns:casio-node
      command: >
        bash -c "
        source /opt/ros/humble/setup.bash &&
        source /ros2_ws/install/setup.bash &&
        ros2 launch casio_range target_tracking.launch.py
        params_file:=/cfg/services/casio-configs/localisation_pipeline_params.yaml
        use_sim_time:=true
        "

    casio_surveillance:
      image: dhdevspace/auto_mns:casio-node
      command: >
        ros2 run casio_surveillance surveillance --ros-args
        --params-file /cfg/services/casio-configs/localisation_pipeline_params.yaml
        -p use_sim_time:=true

    # px4-drone-1:14555 is the MAVROS endpoint of PX4's mavlink-router
    # (server mode); 15550 is only the local port, kept from the Jetson.
    mavros:
      image: dhdevspace/auto_mns:casio-node
      command: >
        bash -c "
        source /opt/ros/humble/setup.bash &&
        ros2 run mavros mavros_node --ros-args
        -p fcu_url:=udp://:15550@px4-drone-1:14555
        -p target_system_id:=1
        -p target_component_id:=1
        -p use_sim_time:=true
        "

    streaming:
      image: dhdevspace/auto_mns:casio-detection
      depends_on: [mediamtx]
      command: >
        bash -c "
        source /opt/ros/humble/setup.bash &&
        source /ros2_ws/install/setup.bash &&
        source /detection_ws/install/setup.bash &&
        exec ros2 run casio_detection annotated_stream_node --ros-args
        -p use_sim_time:=true
        -p encoder:=x264enc
        -p output_url:=rtsp://mediamtx:8554/annotated
        -p bitrate_kbps:=2000
        -p fps_cap:=30.0
        -p target_gps_topic:=/target/gps
        "

    # Published on the host's loopback only. The browser connects to
    # 127.0.0.1:8889 (WHEP signalling) and 127.0.0.1:8189/udp (ICE media).
    mediamtx:
      image: bluenviron/mediamtx:1.19.2
      ports:
        - 127.0.0.1:8554:8554
        - 127.0.0.1:8889:8889
        - 127.0.0.1:8189:8189/udp
      environment:
        MTX_RTMP: "no"
        MTX_HLS: "no"
        MTX_WEBRTC: "yes"
        MTX_SRT: "no"
        MTX_RTSPTRANSPORTS: tcp
        MTX_RTSPADDRESS: ":8554"
        MTX_WEBRTCADDRESS: ":8889"
        MTX_WEBRTCLOCALUDPADDRESS: ":8189"
        MTX_WEBRTCIPSFROMINTERFACES: "no"
        MTX_WEBRTCADDITIONALHOSTS: "127.0.0.1"
        MTX_PATHS_ANNOTATED_SOURCE: publisher

    # Posts to the stand-in RC3 on the host (bench/rc3_sink.py) unless the
    # config names a real one.
    cloud_relay:
      image: dhdevspace/auto_mns:casio-node
      command: >
        bash -c "
        source /opt/ros/humble/setup.bash &&
        source /ros2_ws/install/setup.bash &&
        ros2 run casio_uplink cloud_relay_node --ros-args
        --params-file /cfg/services/casio-configs/localisation_pipeline_params.yaml
        -p use_sim_time:=true
        "
