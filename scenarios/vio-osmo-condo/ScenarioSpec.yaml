schema: mns.scenario.v1
id: vio-osmo-condo
name: Stereo VIO over Condo
stack_name: vio-osmo-condo

# scenarios/vio-reference with one block changed: the level.
#
# Purpose is narrow. Before a sim, a bridge and an estimator can be asked to run
# as one gang-scheduled OSMO group, they have to be known to work together at
# all, and on this machine they never have -- no directory under generated/ has
# ever instantiated a vio_estimator_* service. This scenario is the compose-side
# proof, where a starved estimator is cheap to diagnose. See docs/osmo-mapping.md.
#
# The rig -- stereo pair, 0.12 m baseline, the frozen calibration in ./openvins --
# is vio-reference's, unchanged, because the calibration is frozen against the
# cameras and not against the world. Only the level differs.
#
# Condo, not XFS, for two reasons. It is on the v1 channel, which vio-reference
# is not: that spec names xfs-level 1.0.1 sha256:08fb1485..., which is the id and
# digest from packs/standalone-v2-ue582.lock.json, and on v1 the same level is
# `xfs` at sha256:6750aa11... And it is 7.3 MB against xfs's 1.7 GB, which is the
# difference between a level a kind node can hold and one it cannot.

environment:
  id: condo
  version: 1.0.1
  artifact_digest: sha256:ea8439ecca82eb1b1a3ff1d02e1f9178b2746b685fa28b67c46f4e185e9b29e5

runtime:
  profile: airsim_unreal_px4_docker
  features:
    sim_real_eval: true
    ros2_bridge: true
    qgroundcontrol: false
    # Required, not optional. The flight goes through MAVROS inside the bridge
    # container, because a generated stack's flight controller streams to its
    # own loopback and publishes no host port. With this false the bridge starts
    # without MAVROS and the pilot waits out its timeout on a flight controller
    # that was never connected.
    mavros: true

vehicles:
- id: drone_1
  name: Drone1
  runtime_name: Drone1
  ros_domain_id: 1
  start:
    x: 0
    y: 0
    z: 0
    yaw: 0
  # Stereo pair, 0.12 m baseline. Camera Z is 0.25 m above the IMU: at zero the
  # camera sits inside the airframe and the rotor arms fill about a third of
  # every frame.
  cameras:
    front:
      position:
        x: 0.15
        y: 0
        z: -0.25
      capture_settings:
      - image_type: 0
        width: 640
        height: 480
        fov_degrees: 80
        exposure_compensation: -11.0
    front_right:
      position:
        x: 0.15
        y: 0.12
        z: -0.25
      capture_settings:
      - image_type: 0
        width: 640
        height: 480
        fov_degrees: 80
        exposure_compensation: -11.0
  sensors:
    imu:
      generate_noise: true
      angular_random_walk: 0.5833
      velocity_random_walk: 0.2039
      gyro_bias_stability: 0.0
      accel_bias_stability: 0.0
    gps: true
    barometer: true
    magnetometer: true
    gpu_lidar: false

extensions:
  mns.vio_estimator:
    enabled: true
    kind: openvins
    # vio-reference's frozen calibration, copied verbatim beside this spec.
    # Stereo: two cameras in the kalibr chain, the right one on the bridge's
    # second-camera topic. Enabling this block makes the generator rewrite the
    # bridge -- ENABLE_VIO false, AUTO_DISCOVER_CAMERAS false,
    # DISABLE_RPC_AUX_SENSORS false -- so the estimator gets the 200 Hz IMU and
    # images over RPC rather than shared memory. Read the resulting topic names
    # out of the generated config/topic_names.yaml; do not assume them.
    config_dir: ./openvins
    odom_topic: /ov_msckf/odomimu
    launch_args:
      use_stereo: "true"
      max_cameras: "2"
