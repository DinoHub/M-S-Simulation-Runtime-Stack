schema: mns.campaign.v1
id: vio-osmo-condo
name: Stereo VIO over Condo, under OSMO

# The scenario this campaign is an experiment over. Everything about the
# world, the rig and the estimator lives there; this file says how many times
# to fly it, what to vary, and how to judge the result.
scenario: ./ScenarioSpec.yaml

# Fields the platform's omega.yaml carries and mns.campaign.v1 does not. The
# root CampaignSpec message rejects unknown keys, and the contract lives in a
# separate vendored repository, so they ride in the one slot the schema leaves
# open -- extensions (field id 12) -- until they are promoted to first-class
# fields. The OSMO executor reads them from here; the compose runner ignores
# them, which is the point: the same file drives both.
extensions:
  mns.omega:
    tier: L1
    verifies: [REQ-VIO-001]

evaluation:
  # A dispatch key, not a command line. This is the campaign-level evaluator
  # that scores every run's evidence after the matrix completes and writes
  # reports/<run_key>.json in the shape `campaign status` reads.
  evaluator: vio-stress
  inputs:
    est_topic: /ov_msckf/odomimu
  # Pass/fail thresholds, per metric, applied by the run's verdict task. The
  # CampaignEvaluation message allows unknown fields, so this validates today;
  # the compose runner does not read it. Under OSMO these replace the
  # workflow's hardcoded default.
  gates:
    ate_rmse_m: {max: 1.0}

mission:
  # Under OSMO the pilot is a task in the workflow, not a command the runner
  # execs into the bridge, so `source: external` with a no-op start_cmd is the
  # honest description: the runner starts nothing. `autopilot` and `timeout_s`
  # are read -- they become the workflow's autopilot and record_sec.
  source: external
  start_cmd: "true"
  autopilot: px4
  done: timeout
  timeout_s: 300

# One difference at a time. Wind is a declared environment condition, so it
# leaves a trace in the generated stack rather than being an RPC nobody can
# see afterwards. Two points is enough to prove the matrix; a real sweep adds
# points here, not elsewhere.
variants:
- id: calm
  name: No wind
- id: wind-6
  name: Wind 6 m/s
  overrides:
    environment:
      conditions:
        weather:
          wind: 6.0

# A single VIO run is noise. Two repeats per point is the minimum that lets
# a difference between variants be told apart from a difference between runs.
repeats: 2

recording:
  keep: all
  topics:
  - /ov_msckf/odomimu
  - /ground_truth/odom
  - /clock
  - /tf
  - /tf_static
