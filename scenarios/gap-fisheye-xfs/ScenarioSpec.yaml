schema: mns.scenario.v1
id: gap-fisheye-xfs
name: 'Gap tests: XFS yard, ArduPilot, 4 x 190 deg fisheye rig'
stack_name: gap-fisheye-xfs
environment:
  id: xfs-level
  version: 1.0.1
  artifact_digest: sha256:08fb14857ded949d41926dcdfb5008abcde605a94e4bd4adb8b1449b2f21f8b9
conditions:
  render:
    system_settings:
      r.LumenScene.SurfaceCache.CardCapturesPerFrame: 16
      r.Fisheye.LensRainWeatherScale: 0
      r.Fisheye.SyncCaptureFPS: 30
runtime:
  profile: airsim_unreal_ardupilot_docker
  features:
    sim_real_eval: true
    ros2_bridge: true
    qgroundcontrol: false
    mavros: true
    foxglove_bridge: false
vehicles:
- id: drone_1
  name: Drone1
  runtime_name: Drone1
  ros_domain_id: 1
  start:
    x: 423
    y: -906
    z: -21.0
  cameras:
    fisheye_front:
      position:
        x: 0
        y: 0
        z: -0.15
      rotation:
        roll: 0
        pitch: 0
        yaw: 0
      capture_settings:
      - &id001
        image_type: 0
        width: 512
        height: 512
        fov_degrees: 190
        fisheye_lens_type: Circular
        fisheye_shared_cubemap: true
        fisheye_shared_cubemap_group: surround
        fisheye_shared_cubemap_offset_z: -0.35
    fisheye_right:
      position:
        x: 0
        y: 0
        z: -0.15
      rotation:
        roll: 0
        pitch: 0
        yaw: 90
      capture_settings:
      - *id001
    fisheye_back:
      position:
        x: 0
        y: 0
        z: -0.15
      rotation:
        roll: 0
        pitch: 0
        yaw: 180
      capture_settings:
      - *id001
    fisheye_left:
      position:
        x: 0
        y: 0
        z: -0.15
      rotation:
        roll: 0
        pitch: 0
        yaw: 270
      capture_settings:
      - *id001
  sensors:
    imu:
      generate_noise: true
      angular_random_walk: 0.5833
      velocity_random_walk: 0.2039
      gyro_bias_stability: 0.0
      accel_bias_stability: 0.0
    gps: true
    barometer: true
    magnetometer: true
    gpu_lidar: false
extensions:
  # OpenVINS live in the stack, on the front and back fisheyes. use_stereo must be
  # false: the rig is two independent mono cameras, and the launch file's own
  # default (true) overrides the config. gap.sh fly restarts the estimator just
  # before recording, so it starts from the same parked frame a replay would.
  mns.vio_estimator:
    enabled: true
    kind: openvins
    config_dir: ./openvins/t2
    odom_topic: /ov_msckf/odomimu
    launch_args:
      use_stereo: "false"
      max_cameras: "2"
