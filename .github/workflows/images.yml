name: images

# This repository is public, so GitHub-hosted standard runners cost nothing:
# Actions minutes are free and unlimited for public repos. Both jobs below run
# on `ubuntu-latest` for that reason — a larger runner would be billable.
on:
  # No paths: filter. It used to list images/**, product-images.env, and the
  # tooling — but one of the invariants verify enforces (scan_for_mutable_refs)
  # reads EVERY tracked *.yml, *.yaml, *.sh, *.md, and Makefile looking for a
  # bare -latest reference to an image we publish ourselves. A PR reintroducing
  # one of those mutable refs into docker-compose-tools.yml or tools.sh matched
  # none of the listed paths, so the job never ran and the guard stayed silent —
  # exactly the regression it exists to prevent. Any filter narrower
  # than the scan's own globs is a filter that lies, and those globs are close
  # enough to "everything" that the honest filter is none. The job is offline
  # and finishes in about fifteen seconds.
  pull_request:
  schedule:
    # Mondays 02:00 UTC. Weekly, not daily: the point is to notice a moved tag
    # or an unattended follow-up, and a daily run is a notification people
    # learn to skip.
    - cron: "0 2 * * 1"
  workflow_dispatch: {}

jobs:
  # PR gate. Offline: regenerates the artifacts and diffs them against what is
  # committed. No registry, no credentials, nothing to rate-limit.
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tooling deps
        run: pip install -r tools/requirements.txt

      - name: images.sh verify
        run: tools/images.sh verify

      - name: images.sh status --offline
        # Advisory on a PR: an outstanding follow-up is not that PR's fault,
        # so it is reported, never a failure. `|| true` keeps status's
        # nonzero-means-actionable contract intact for every other caller.
        run: tools/images.sh status --offline || true

  # Weekly drift watch. Online, so it CAN fail for reasons that are not a
  # code problem (Docker Hub rate limits an unauthenticated runner). That is
  # why it is a separate job from the PR gate: a flaky registry must never be
  # able to block a merge.
  status:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tooling deps
        run: pip install -r tools/requirements.txt

      - name: images.sh status
        # Exits nonzero when something needs a human, which is exactly what a
        # red weekly run should mean. Read the log: it names each item.
        #
        # A hosted runner has no `docker login`, so the catalog's private
        # dhdevspace/auto_mns rows cannot be resolved without a token. Supply
        # one through these secrets and every row is checked; leave them unset
        # and images.py falls back to anonymous Hub access, where the public
        # rows still resolve and the private ones report UNRESOLVABLE. Either
        # way the run says what it could not check, which is the contract —
        # before this, a missing credential exited the process outright and the
        # red run looked like drift.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: tools/images.sh status
