name: images

# This repository is public, so GitHub-hosted standard runners cost nothing:
# Actions minutes are free and unlimited for public repos. Both jobs below run
# on `ubuntu-latest` for that reason — a larger runner would be billable.
on:
  pull_request:
    paths:
      - "images/**"
      - "product-images.env"
      - "tools/images.py"
      - "tools/images.sh"
      - "tools/pull-all-images.sh"
      - "tools/ensure-images.sh"
      - "tools/image-tags.sh"
      - "tools/test_image_tags.py"
      - "tools/stage-authoring-packs.sh"
      - "tools/install-demo-packs.sh"
      - "tools/install_demo_packs.py"
      - "tools/test_install_demo_packs.py"
      - "tools/build_pack_lock.py"
      - "tools/load-images-env.sh"
      - "tools/check_docker.sh"
      - "tools/mns-stacks.sh"
      - "tools/fly.sh"
      - "tools/author.sh"
      - "tools/doctor.sh"
      - "tools/pull-packs.sh"
      - "tools/test_channels.py"
      - "tools/test_images_host_pin.py"
      - "tools/test_images_release.py"
      - "tools/check_spawn.py"
      - "tools/test_check_spawn.py"
      - "tools/test_effective_image_set.py"
      - "tools/test_scenario_pack_pins.py"
      - "Makefile"
      - "scenarios/**"
      - "osmo/**"
      - "packs/**"
      - "docker-compose-dashboard.yml"
      - "setup.sh"
      - "download-packs.sh"
      - "Makefile"
      - ".github/workflows/images.yml"
  schedule:
    # Mondays 02:00 UTC. Weekly, not daily: the point is to notice a moved tag
    # or an unattended follow-up, and a daily run is a notification people
    # learn to skip.
    - cron: "0 2 * * 1"
  workflow_dispatch: {}

jobs:
  # PR gate. Offline: regenerates the artifacts and diffs them against what is
  # committed. No registry, no credentials, nothing to rate-limit.
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tooling deps
        run: pip install -r tools/requirements.txt

      - name: images.sh verify
        run: tools/images.sh verify

      - name: release guard (PRs into release/v1.0.0 or main)
        # What ships is exact: no pending row, no -rc tag in a release channel,
        # no tag-only ref in images/v1.0.0.generated.env or the pack lock. The
        # step above already turns this on through GITHUB_BASE_REF; this one
        # names it, so a red run says which rule failed.
        if: github.base_ref == 'release/v1.0.0' || github.base_ref == 'main'
        run: tools/images.sh verify --release

      - name: images.sh status --offline
        # Advisory on a PR: an outstanding follow-up is not that PR's fault,
        # so it is reported, never a failure. `|| true` keeps status's
        # nonzero-means-actionable contract intact for every other caller.
        run: tools/images.sh status --offline || true

      # The steps below exist because the paths: filter above used to list
      # executables that nothing in this job ever ran, so touching them
      # triggered a workflow that could not fail on them.
      - name: shellcheck the entrypoints
        run: |
          shellcheck -S warning -x \
            tools/images.sh \
            tools/pull-all-images.sh \
            tools/ensure-images.sh \
            tools/image-tags.sh \
            tools/stage-authoring-packs.sh \
            tools/install-demo-packs.sh \
            tools/pull-packs.sh \
            tools/load-images-env.sh \
            tools/check_docker.sh \
            tools/mns-stacks.sh \
            tools/fly.sh \
            tools/author.sh \
            tools/doctor.sh \
            osmo/setup-local-osmo.sh \
            setup.sh \
            download-packs.sh

      - name: python syntax
        run: python -m compileall -q tools/images.py tools/install_demo_packs.py tools/build_pack_lock.py tools/preview_topics.py tools/check_spawn.py osmo/campaign.py osmo/registry.py

      - name: tooling unit tests
        # Offline: the installer's lock/store/contract/download logic and its
        # mns-packs calls, the channel declaration, osmo/campaign.py's
        # mns-stacks calls, and what ensure-images, pull-all-images and doctor
        # do with a local tag that is not at its pin, all against synthetic
        # fixtures and fake CLIs.
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tools -p 'test_install_demo_packs.py'
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tools -p 'test_channels.py'
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tools -p 'test_images_host_pin.py'
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tools -p 'test_images_release.py'
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tools -p 'test_check_spawn.py'
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tools -p 'test_effective_image_set.py'
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tools -p 'test_scenario_pack_pins.py'
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tools -p 'test_image_tags.py'
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s osmo -p 'test_campaign.py'

      - name: dry-run smoke (no registry, no Docker daemon)
        # Every one of these resolves the catalog and prints; none contacts a
        # registry or the Docker daemon.
        run: |
          tools/images.sh refs > /dev/null
          tools/images.sh refs --development > /dev/null
          tools/images.sh pins > /dev/null
          tools/pull-all-images.sh --dry-run > /dev/null
          tools/pull-all-images.sh --dry-run --all-catalog > /dev/null
          tools/install-demo-packs.sh --all --dry-run > /dev/null
          tools/install-demo-packs.sh --missing --all --dry-run > /dev/null
          # A runner has no pack store, so --check reports every pack missing
          # and exits 1; the point is that the no-network path runs at all.
          tools/install-demo-packs.sh --check --all > /dev/null || true
          tools/images.sh refs --channel v1 > /dev/null
          tools/images.sh local-refs --channel v1 > /dev/null
          tools/images.py baked-pins v1_dashboard_backend > /dev/null
          ./download-packs.sh --list > /dev/null
          tools/ensure-images.sh --dry-run > /dev/null || true
          # The headless targets: usage errors and help work without Docker.
          make help > /dev/null
          if make fly 2>/dev/null; then echo "make fly without SCENARIO must fail" >&2; exit 1; fi
          if make stacks 2>/dev/null; then echo "make stacks without ARGS must fail" >&2; exit 1; fi
          tools/fly.sh --help | grep -q -- --keep
          # KEEP=1 hands fly.sh --keep (and nothing else changes); -n prints the recipe only.
          make -n fly SCENARIO=vio-reference KEEP=1 | grep -q 'tools/fly.sh "vio-reference"  --keep --'
          if make -n fly SCENARIO=vio-reference | grep -q -- '--keep'; then echo "--keep without KEEP=1" >&2; exit 1; fi
          tools/author.sh --help > /dev/null
          # tools/mns-stacks.sh gives the socket and the host network exactly to
          # the commands that need them (a fake docker prints the argv).
          fake="$(mktemp -d)"; printf '#!/bin/sh\nprintf "%%s\\n" "$@"\n' > "$fake/docker"; chmod +x "$fake/docker"
          for cmd in "run --stack x" "stop --stack x" "campaign preflight vio-reference" "campaign run vio-reference"; do
            argv="$(PATH="$fake:$PATH" MNS_STACKS_IMAGE=fake tools/mns-stacks.sh $cmd)"
            echo "$argv" | grep -qx -- '--network=host' || { echo "$cmd: no --network=host" >&2; exit 1; }
            echo "$argv" | grep -q -- '/var/run/docker.sock' || { echo "$cmd: no socket" >&2; exit 1; }
          done
          for cmd in "generate scenarios/vio-reference" "campaign plan vio-reference" "campaign validate vio-reference"; do
            argv="$(PATH="$fake:$PATH" MNS_STACKS_IMAGE=fake tools/mns-stacks.sh $cmd)"
            echo "$argv" | grep -qx -- '--network=none' || { echo "$cmd: not --network=none" >&2; exit 1; }
            if echo "$argv" | grep -q -- '/var/run/docker.sock'; then echo "$cmd: has the socket" >&2; exit 1; fi
          done
          rm -rf "$fake" runs
          tools/doctor.sh --help > /dev/null

      - name: --dry-run must refuse --refresh-moving
        # Guards the ordering bug where the bump ran BEFORE the dry-run exit
        # and rewrote eight tracked files.
        run: |
          if tools/pull-all-images.sh --dry-run --refresh-moving; then
            echo "expected a nonzero exit" >&2
            exit 1
          fi
          git diff --exit-code

      - name: dashboard compose resolves without make
        # docker-compose-dashboard.yml interpolates every service at parse
        # time, so a required variable there breaks `down`/`ps`/`logs` too.
        # This is the by-hand invocation its own header documents.
        run: |
          cp .env.example .env
          docker compose -f docker-compose-dashboard.yml \
            --env-file .env \
            --env-file images/v1.0.0.generated.env \
            --env-file images/development.generated.env \
            config > /dev/null
          docker compose -f docker-compose-dashboard.yml \
            --env-file .env \
            --env-file images/v1.0.0.generated.env \
            --env-file images/platform-images.generated.env \
            config > config.out
          # The backend gets the v1.0.0 image variables, and no retired ones.
          grep -q 'MNS_STACKS_IMAGE: ' config.out
          grep -q 'MNS_PACKS_IMAGE: ' config.out
          # The backend bakes no image pins, so these three must arrive
          # non-empty from the pin file, or its actions fail.
          for var in MNS_STACKS_IMAGE MNS_PACKS_IMAGE MNS_AUTHORING_IMAGE; do
            grep -Eq "^ +$var: [^ ]+" config.out || { echo "$var is empty in the backend's env" >&2; exit 1; }
          done
          grep -q 'MNS_CAPABILITY_KIT: ' config.out
          grep -q 'TEVV_RUNS_DIR: /' config.out
          grep -q 'MNS_AUTHORING_PROJECT: ' config.out
          if grep -Eq 'PRODUCT_SHELL|STACK_GENERATOR' config.out; then exit 1; fi
          rm -f config.out
          rm -f .env

  # Weekly drift watch. Online, so it CAN fail for reasons that are not a
  # code problem (a flaky registry, or Docker Hub throttling). That is why it
  # is a separate job from the PR gate: a bad registry day must never be able
  # to block a merge.
  #
  # It also needs credentials. Every pin resolves against dhdevspace/auto_mns,
  # which is a private Docker Hub repository: anonymously the registry answers
  # 401 and the Hub API 404, so images.py reports every row UNRESOLVABLE and
  # the run goes red with dozens of "stale pins" that are nothing of the kind.
  # Authenticated, the same command returns the real handful.
  #
  # Note the trigger split above is load-bearing now that this job holds
  # secrets: `status` runs only on schedule and workflow_dispatch, never on
  # pull_request, so a fork's pull request cannot reach these credentials.
  # Keep the offline `verify` gate credential-free.
  status:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tooling deps
        run: pip install -r tools/requirements.txt

      # Fail with the name of what is missing. Without this, an absent
      # secret surfaces as login-action's generic "Username and password
      # required", which does not tell the next person which secret to add.
      - name: Check the Docker Hub credentials are configured
        env:
          HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${HUB_USERNAME:-}" ] || missing="DOCKERHUB_USERNAME"
          [ -n "${HUB_TOKEN:-}" ] || missing="${missing:+$missing and }DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error title=Missing Docker Hub credentials::This job resolves pins against the private dhdevspace/auto_mns repository and cannot do so anonymously. Add the repository secret(s): $missing. Use a Docker Hub access token with read-only (public_repo:read + repo:read) scope, not an account password."
            exit 1
          fi

      # images.py reads ~/.docker/config.json for both of its resolvers: the
      # imagetools rows shell out to `docker buildx imagetools inspect`, and
      # the hub rows (35 of 46) take the username and token out of that file
      # to call hub.docker.com/v2/users/login. This action writes exactly that
      # file, so one login covers both paths.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: images.sh status
        # Exits nonzero when something needs a human, which is exactly what a
        # red weekly run should mean. Read the log: it names each item.
        run: tools/images.sh status
