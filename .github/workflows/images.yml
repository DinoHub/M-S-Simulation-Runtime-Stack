name: images

# This repository is public, so GitHub-hosted standard runners cost nothing:
# Actions minutes are free and unlimited for public repos. Both jobs below run
# on `ubuntu-latest` for that reason — a larger runner would be billable.
on:
  pull_request:
    paths:
      - "images/**"
      - "product-images.env"
      - "tools/images.py"
      - "tools/images.sh"
      - "tools/check-image-pins.sh"
      - "tools/pull-all-images.sh"
      - "tools/ensure-images.sh"
      - "tools/stage-authoring-packs.sh"
      - "tools/install-demo-packs.sh"
      - "tools/install_demo_packs.py"
      - "tools/load-images-env.sh"
      - "packs/**"
      - "docker-compose-dashboard.yml"
      - "tests/full-product-e2e/run.sh"
      - "product.sh"
      - "Makefile"
      - ".github/workflows/images.yml"
  schedule:
    # Mondays 02:00 UTC. Weekly, not daily: the point is to notice a moved tag
    # or an unattended follow-up, and a daily run is a notification people
    # learn to skip.
    - cron: "0 2 * * 1"
  workflow_dispatch: {}

jobs:
  # PR gate. Offline: regenerates the artifacts and diffs them against what is
  # committed. No registry, no credentials, nothing to rate-limit.
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tooling deps
        run: pip install -r tools/requirements.txt

      - name: images.sh verify
        run: tools/images.sh verify

      - name: images.sh status --offline
        # Advisory on a PR: an outstanding follow-up is not that PR's fault,
        # so it is reported, never a failure. `|| true` keeps status's
        # nonzero-means-actionable contract intact for every other caller.
        run: tools/images.sh status --offline || true

      # The steps below exist because the paths: filter above used to list
      # executables that nothing in this job ever ran, so touching them
      # triggered a workflow that could not fail on them.
      - name: shellcheck the image entrypoints
        run: |
          shellcheck -S warning \
            product.sh \
            tools/images.sh \
            tools/pull-all-images.sh \
            tools/ensure-images.sh \
            tools/stage-authoring-packs.sh \
            tools/install-demo-packs.sh \
            tools/load-images-env.sh \
            tests/full-product-e2e/run.sh

      - name: python syntax
        run: python -m compileall -q tools/images.py tools/install_demo_packs.py

      - name: offline dry-run smoke
        # Every one of these resolves the catalog and prints; none contacts a
        # registry or the Docker daemon.
        run: |
          tools/images.sh refs > /dev/null
          tools/images.sh refs --development > /dev/null
          tools/pull-all-images.sh --dry-run > /dev/null
          tools/pull-all-images.sh --dry-run --all-catalog > /dev/null
          tools/install-demo-packs.sh --all --dry-run > /dev/null

      - name: --dry-run must refuse --refresh-moving
        # Guards the ordering bug where the bump ran BEFORE the dry-run exit
        # and rewrote eight tracked files.
        run: |
          if tools/pull-all-images.sh --dry-run --refresh-moving; then
            echo "expected a nonzero exit" >&2
            exit 1
          fi
          git diff --exit-code

      - name: dashboard compose resolves without make
        # docker-compose-dashboard.yml interpolates every service at parse
        # time, so a required variable there breaks `down`/`ps`/`logs` too.
        # This is the by-hand invocation its own header documents.
        run: |
          cp .env.example .env
          docker compose -f docker-compose-dashboard.yml \
            --env-file .env \
            --env-file images/standalone-v2-development.generated.env \
            config > /dev/null
          docker compose -f docker-compose-dashboard.yml \
            --env-file .env \
            --env-file images/standalone-v2-images.generated.env \
            --env-file product-images.env \
            --env-file images/platform-images.generated.env \
            config > /dev/null
          rm -f .env

  # Weekly drift watch. Online, so it CAN fail for reasons that are not a
  # code problem (a flaky registry, or Docker Hub throttling). That is why it
  # is a separate job from the PR gate: a bad registry day must never be able
  # to block a merge.
  #
  # It also needs credentials. Every pin resolves against dhdevspace/auto_mns,
  # which is a private Docker Hub repository: anonymously the registry answers
  # 401 and the Hub API 404, so images.py reports every row UNRESOLVABLE and
  # the run goes red with dozens of "stale pins" that are nothing of the kind.
  # Authenticated, the same command returns the real handful.
  #
  # Note the trigger split above is load-bearing now that this job holds
  # secrets: `status` runs only on schedule and workflow_dispatch, never on
  # pull_request, so a fork's pull request cannot reach these credentials.
  # Keep the offline `verify` gate credential-free.
  status:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tooling deps
        run: pip install -r tools/requirements.txt

      # Fail with the name of what is missing. Without this, an absent
      # secret surfaces as login-action's generic "Username and password
      # required", which does not tell the next person which secret to add.
      - name: Check the Docker Hub credentials are configured
        env:
          HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${HUB_USERNAME:-}" ] || missing="DOCKERHUB_USERNAME"
          [ -n "${HUB_TOKEN:-}" ] || missing="${missing:+$missing and }DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error title=Missing Docker Hub credentials::This job resolves pins against the private dhdevspace/auto_mns repository and cannot do so anonymously. Add the repository secret(s): $missing. Use a Docker Hub access token with read-only (public_repo:read + repo:read) scope, not an account password."
            exit 1
          fi

      # images.py reads ~/.docker/config.json for both of its resolvers: the
      # imagetools rows shell out to `docker buildx imagetools inspect`, and
      # the hub rows (35 of 46) take the username and token out of that file
      # to call hub.docker.com/v2/users/login. This action writes exactly that
      # file, so one login covers both paths.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: images.sh status
        # Exits nonzero when something needs a human, which is exactly what a
        # red weekly run should mean. Read the log: it names each item.
        run: tools/images.sh status
