schema: mns.images.v1

# Reminders that belong to no single image row. `tools/images.sh status`
# prints these under NEEDS YOU every time it runs, which is the point: a
# gated migration that lives only in someone's memory is a migration that
# quietly never happens. Delete an entry when it is done.
follow_ups: []
# One canonical image catalog. Every container image this repository refers to
# is a row here, exactly once — see docs/adr/0002-one-image-catalog.md for the
# decision record. Nothing under images/*.generated.* or product-images.env is
# hand-edited: they are rendered from this file by `tools/images.sh sync`, and
# `tools/images.sh verify` (the CI gate) fails the build if a generated file
# and this catalog have drifted apart. Edit here, then sync — never the other
# way around.
#
# `digest` is the contract: it is what `repo:tag@sha256:...` actually resolves
# to, on every machine, forever. `tag` stays alongside it purely for humans —
# nothing prevents a tag being repointed at a different image, so the tag
# alone is not a pin. Every digest below is the INDEX (manifest-list) digest,
# not a per-architecture manifest. Read it off the `Digest:` line of
# `docker buildx imagetools inspect <ref>`'s DEFAULT report — not
# `--format '{{.Manifest.Digest}}'`, which silently prints the wrong thing for
# a single-arch image, and not `docker manifest inspect -v`, which reports the
# per-arch entry and is the easy way to get this wrong for a multi-arch tag. See MnS-Integration-Platform/docs/adr/0001-image-versioning-
# and-digest-pinning.md for the fuller reasoning (this catalog generalizes that
# decision to every image, not just the product ones).
#
# `channel` drives report/bump behavior:
#   review   - repo:tag-review.N; `tools/images.sh bump` advances N via Hub
#              tag search. The tag MUST end in -review.N: bump derives the
#              family from the tag itself, so an off-line tag here would
#              report NO_TAGS_FOUND forever. Enforced by _validate_catalog.
#   moving   - repo:tag-latest (or similar); tag never changes, digest may;
#              republished in place, reported as TAG_MOVED when it happens
#   upstream - third-party image on a version tag; never auto-bumped
#   pinned   - published, but deliberately off the release line (a branch or
#              preview build). Digest required; verified by report like any
#              other row; refused by bump. Moves only by hand.
#   local    - locally built (repo starts with local/); digest is always
#              null and the row is skipped by both verify and bump
#   unpublished - referenced by this repo but absent from the registry;
#              digest null, no lookup attempted, bump refuses
#
# `resolver` says how report/bump find the live digest:
#   hub        - Docker Hub v2 API (default; needed for -review.N enumeration)
#   imagetools - `docker buildx imagetools inspect <ref>` + the `Digest:` line
#                of its default report (NOT --format '{{.Manifest.Digest}}',
#                which silently prints the wrong thing for a single-arch
#                image — see tools/images.py). Used for third-party registries
#                (gcr.io, nvcr.io, ghcr.io, docker.elastic.co) and third-party
#                Hub orgs this repo does not control (prom/, grafana/,
#                sid220/, timescale/).
#
# `bakes` on an image row means: that image's Dockerfile bakes in another
# row's ref as a build-time default (MNS_*_IMAGE_DEFAULT). `tools/images.sh
# baked` walks these edges and asserts the released image's baked value still
# matches the pin here.
#
# `consumers:` binds an image (by key) to how it is actually referenced, so no
# image is listed twice under two different names:
#   product_env  -> product-images.env (the channel-independent tools)
#   image_sets   -> images/image-set.generated.yaml, mirroring the platform
#                   stackgen schema: what generated stacks run.
#   compose_env  -> images/platform-images.generated.env, the dashboard
#                   compose file's inline images

images:
  # ---------------------------------------------------------------------
  # Product images (product-images.env "tools" section)
  # ---------------------------------------------------------------------
  airsim_tools:
    repo: dhdevspace/auto_mns
    tag: "airsim-tools-v0.2.0-retag.2026-08-26"
    latest_tag: airsim-tools-latest
    # This immutable dated tag wraps the exact linux/amd64 manifest formerly
    # pinned through airsim-tools-latest. Its index digest differs because the
    # re-tag is a manifest list containing that original manifest.
    digest: sha256:3ca0e1cd711addd5c258d323609fa668d91baac4e2547d34e529cb88c759dfd8
    channel: pinned
    published_by: "(re-tag only — no known build source)"
    purpose: ros2-tools image used by docker-compose-tools.yml.
    follow_up: >-
      airsim_tools has no known build source. Give it an owned build script,
      publish a source-identifying immutable tag after the stable tag policy
      is defined, then delete this note.

  qgroundcontrol:
    repo: dhdevspace/auto_mns
    tag: airsim-qgc-x11-latest
    digest: sha256:fe1e9e05d9300afeab92787973b84c378cf021c25f0f61b8f27cbf712e299804
    channel: moving
    purpose: QGroundControl (X11), the published qgroundcontrol role.

  sim_real_eval:
    repo: dhdevspace/auto_mns
    tag: sim-real-eval-worker-latest
    digest: sha256:4159d4c63f747dbdfc1ff86dfcbcbde87685c014b7f6fc9eb18478ddaa20c7eb
    channel: moving
    purpose: Sim-to-real evaluation worker, the published sim_real_eval role.

  vio_estimator_openvins:
    repo: dhdevspace/auto_mns
    tag: vio-estimator-openvins-69488123
    digest: sha256:ac48f34984863b159c0bf805e4f8ea2daecff4c23539aac00afd89c4d3a48078
    channel: pinned
    purpose: >-
      OpenVINS (ov_msckf) on ROS 2 Humble, the published vio_estimator role --
      the estimator scenarios/vio-reference flies, and the default any scenario
      gets from extensions."mns.vio_estimator" with kind: openvins.

      The tag carries the upstream commit it was built from
      (rpng/open_vins @ 69488123ed9362dd44b6f28e7f4680abbff1442b), because a
      moving tag would let a rebuild at a different ref reuse the name and a
      campaign could then not say which estimator produced its numbers. Built by
      MnS-Integration-Platform docker/build_vio_estimator_image.sh; rebuild at
      another ref and the tag changes, so this row misses loudly rather than
      running the wrong estimator quietly.

  # ---------------------------------------------------------------------
  # Platform images — docker-compose-dashboard.yml inline rows (2 rows;
  # dashboard-backend/-frontend above are product rows, not these)
  # ---------------------------------------------------------------------
  dashboard_lichtblick:
    repo: ghcr.io/lichtblick-suite/lichtblick
    tag: "latest"
    digest: sha256:230ed53813f11ab5d23c47380f94c6d358438ecf15c3a7e7de9625b07c437611
    channel: upstream
    resolver: imagetools
    purpose: Lichtblick instance embedded in the TEVV Web Dashboard (port 8082, URL baked into the frontend build).

  dashboard_timescaledb:
    repo: timescale/timescaledb
    tag: 2.17.2-pg16
    digest: sha256:4e459e217f00cbb09920c34d245501e63427e6767a495de57ce76823ff280f12
    channel: upstream
    resolver: imagetools
    purpose: Opt-in (--profile db) telemetry database for the dashboard.

  # ---- MnS 1.0 (channel v1): baseline rebuilt from release/v1.0.0 on 2026-09-18 ----
  v1_runtime_host:
    repo: dhdevspace/auto_mns
    tag: tevv-runtime-host-v1.0.0
    digest: sha256:303a5c84662a3fc420ce93e5f2e87198065798719884d48f679915cf22a29339
    channel: pinned
    purpose: >-
      MnS 1.0 generic TEVVRuntimeHost (TEVV-Airsim release/v1.0.0 663cfeeef076); rebuilt with iceoryx2 v0.8.1 for SHM camera publishing. Non-Substrate iostore-v2 baseline; fisheye RGB captures inherit host GI/reflections.

  v1_authoring:
    repo: dhdevspace/auto_mns
    tag: mns-authoring-v1.0.0
    digest: sha256:6aa3ad371f8c6c89a846344f10d9001acd3b5574d7f7c23b7ebd6e8ce361122d
    channel: pinned
    purpose: >-
      MnS 1.0 ScenarioLab (TEVV-Authoring release/v1.0.0); non-Substrate baseline with corrected preview package-root registration. Bakes mns_vehicle_models 1.0.4, the version TEVV-Authoring pins (tooling/asset_packs/default_vehicle_pack.json). Level packs are staged from the PackStore.

  v1_stack_generator:
    repo: dhdevspace/auto_mns
    tag: mns-stack-generator-v1.0.0
    digest: sha256:e2710b8ad05ac431545c1f6454be28aa15e77b8e47346816ed04dca831f85c40
    channel: pinned
    purpose: >-
      MnS 1.0 stack generator (MnS-Integration-Platform release/v1.0.0) with the v1 runtime contract baked; stages pack payloads by hard link. Rebuilt with advisory base-cook validation; capability and integrity checks remain enforced.

  v1_product_shell:
    repo: dhdevspace/auto_mns
    tag: mns-product-shell-v1.0.0
    digest: sha256:21ed9bed74f7837213b8d149463bcc00534ada66139b2d90ba3f4875a92543a1
    channel: pinned
    purpose: >-
      MnS 1.0 product shell (same sources) with ScenarioLab's v1 contract baked; owns the pack mount directory import. Runtime and authoring staging both use advisory base-cook validation. Its baked MNS_AUTHORING_IMAGE default is the authoring build it was made with (sha256:abaa02a6…, vehicle pack 1.0.3); the product always passes v1_authoring instead, so the default applies only to a shell run by hand.

  v1_ros2_bridge:
    repo: dhdevspace/auto_mns
    tag: tevv-airsim-ros2-bridge-humble-v1.0.0
    digest: sha256:b91e4b92d6a8ec538da33ab40758ab3d1c0af99cb9bdf853452561e44046530c
    channel: pinned
    purpose: >-
      MnS 1.0 AirSim<->ROS 2 bridge (TEVV-Airsim-ROS2-Bridge main); 87 colcon tests green at build.

  v1_px4:
    repo: dhdevspace/auto_mns
    tag: px4-airsim-px4-v1.0.0
    digest: sha256:0f03b74335e92450efba7421782d7ca2986edef2c4b900c3350729c8a2e7deea
    channel: pinned
    purpose: >-
      MnS 1.0 PX4 SITL v1.14.4 built from Dockerfile.px4 (TEVV-PX4-Autopilot master) with mavlink-router, pymavlink and the loopback UDP control endpoint.

  v1_ardupilot:
    repo: dhdevspace/auto_mns
    tag: ardupilot-v1.0.0
    digest: sha256:93b9e50b7b44e91aafd38b9a223100d7c67f971ebd9c246bce3582ed9ef015c1
    channel: pinned
    purpose: >-
      MnS 1.0 ArduPilot SITL built from source (Dockerfile.ardupilotbuild, ref 142aece2) with mavlink-router and system pymavlink; arducopter binary identical to the flown origin image.

  v1_dashboard_backend:
    repo: dhdevspace/auto_mns
    tag: tevv-web-dashboard-backend-v1.0.0-gee99b9d
    digest: sha256:939c93c309d4363ae1552238a175971cb1566fc75f699fbfcda906b6dcfe41e9
    channel: pinned
    source:
      repo: DinoHub/TEVV-Web-Dashboard
    purpose: >-
      MnS 1.0 dashboard backend (TEVV-Web-Dashboard main) with the v1
      authoring/generator pins baked. gee99b9d adds #115: the Generate phase no
      longer authors sensors (ScenarioLab does), the ROS 2 step lists published
      topics only and offers no guessed names, stale armed record topics are
      dropped and reported at launch, and apply-prerun carries
      config/sim2real/topics.yaml across a prefix or rename change. Built with
      --candidate-lock packs/v1.0.0.lock.json, so the baked defaults are the
      v1.0.0 authoring and generator, not the v0.2.0 review pins.

  v1_dashboard_frontend:
    repo: dhdevspace/auto_mns
    tag: tevv-web-dashboard-frontend-v1.0.0-gee99b9d
    digest: sha256:9a779f5d5564333bfec145309bc7afde0e059a64b5c8b00183da7c0489c93259
    channel: pinned
    source:
      repo: DinoHub/TEVV-Web-Dashboard
    purpose: >-
      MnS 1.0 dashboard frontend (TEVV-Web-Dashboard main), built with the
      backend above (gee99b9d). Byte-identical to the v0.2.0-gee99b9d build:
      the frontend bakes no pins, so only the backend digest moved.

consumers:
  product_env:
    tools:
      AIRSIM_TOOLS_IMAGE: airsim_tools

  # A release channel binds the product's image variables to one coordinated
  # set of images and emits them to its own file. A consumer selects a channel
  # by sourcing that file. v1 (MnS 1.0, UE 5.8.2) is the stable line and the
  # only one; a later release adds a channel here.
  release_channels:
    v1:
      emits: images/v1.0.0.generated.env
      image_set: v1
      vars:
        MNS_PRODUCT_SHELL_IMAGE: v1_product_shell
        MNS_AUTHORING_IMAGE: v1_authoring
        MNS_STACK_GENERATOR_IMAGE: v1_stack_generator
        MNS_RUNTIME_HOST_IMAGE: v1_runtime_host
        MNS_ROS2_BRIDGE_IMAGE: v1_ros2_bridge
        DASHBOARD_BACKEND_IMAGE: v1_dashboard_backend
        DASHBOARD_FRONTEND_IMAGE: v1_dashboard_frontend

  # A pack release lock (packs/*.lock.json) restates a few image pins because
  # tools/install_demo_packs.py has to pull the product shell before anything
  # in this repo has resolved an image set. That is a second copy of a pin, so
  # the edge is declared here (lock key -> catalog key) and
  # `tools/images.sh verify` asserts the JSON still agrees, offline. A bump
  # that advances one of these rows fails CI until the lock is regenerated.
  pack_locks:
    packs/v1.0.0.lock.json:
      product_shell: v1_product_shell
      authoring: v1_authoring
      stack_generator: v1_stack_generator
      runtime_host: v1_runtime_host
      ros2_bridge: v1_ros2_bridge

  image_sets:
    # What generated stacks run (MNS_IMAGE_SET=v1, set by the v1 channel file).
    v1:
      pull_policy: missing
      images:
        simulators:
          tevv_runtime_host: v1_runtime_host
        autopilots:
          ardupilot: v1_ardupilot
          px4: v1_px4
        ros2_bridge: v1_ros2_bridge
        qgroundcontrol: qgroundcontrol
        sim_real_eval: sim_real_eval
        vio_estimator: vio_estimator_openvins

  compose_env:
    dashboard:
      DASHBOARD_LICHTBLICK_IMAGE: dashboard_lichtblick
      DASHBOARD_TIMESCALEDB_IMAGE: dashboard_timescaledb

