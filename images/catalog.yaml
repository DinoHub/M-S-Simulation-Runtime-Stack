schema: mns.images.v1

# One canonical image catalog. Every container image this repository refers to
# is a row here, exactly once — see docs/adr/0002-one-image-catalog.md for the
# decision record. Nothing under images/*.generated.* or product-images.env is
# hand-edited: they are rendered from this file by `tools/images.sh sync`, and
# `tools/images.sh verify` (the CI gate) fails the build if a generated file
# and this catalog have drifted apart. Edit here, then sync — never the other
# way around.
#
# `digest` is the contract: it is what `repo:tag@sha256:...` actually resolves
# to, on every machine, forever. `tag` stays alongside it purely for humans —
# nothing prevents a tag being repointed at a different image, so the tag
# alone is not a pin. Every digest below is the INDEX (manifest-list) digest,
# not a per-architecture manifest: `docker buildx imagetools inspect <ref>
# --format '{{.Manifest.Digest}}'` reports that; `docker manifest inspect -v`
# reports the per-arch entry instead and is the easy way to get this wrong for
# a multi-arch tag. See MnS-Integration-Platform/docs/adr/0001-image-versioning-
# and-digest-pinning.md for the fuller reasoning (this catalog generalizes that
# decision to every image, not just the product ones).
#
# `channel` drives report/bump behavior:
#   review   - repo:tag-review.N; tag.sh --bump advances N via Hub tag search
#   moving   - repo:tag-latest (or similar); tag never changes, digest may;
#              republished in place, reported as TAG_MOVED when it happens
#   upstream - third-party image on a version tag; never auto-bumped
#   local    - locally built (repo starts with local/); digest is always
#              null and the row is skipped by both verify and bump
#
# `resolver` says how report/bump find the live digest:
#   hub        - Docker Hub v2 API (default; needed for -review.N enumeration)
#   imagetools - `docker buildx imagetools inspect <ref>` + the `Digest:` line
#                of its default report (NOT --format '{{.Manifest.Digest}}',
#                which silently prints the wrong thing for a single-arch
#                image — see tools/images.py). Used for third-party registries
#                (gcr.io, nvcr.io, ghcr.io, docker.elastic.co) and third-party
#                Hub orgs this repo does not control (prom/, grafana/,
#                sid220/, timescale/).
#
# `bakes` on an image row means: that image's Dockerfile bakes in another
# row's ref as a build-time default (MNS_*_IMAGE_DEFAULT). `tools/images.sh
# baked` walks these edges and asserts the released image's baked value still
# matches the pin here — see the dashboard-backend row below.
#
# `consumers:` binds an image (by key) to how it is actually referenced, so no
# image is listed twice under two different names:
#   product_env  -> product-images.env, grouped the way that file's prose
#                   sections already are (review / dashboard / tools)
#   image_sets   -> images/image-set.generated.yaml, mirroring
#                   MnS-Integration-Platform's stacks/orchestrator/catalogs/
#                   image_sets.yaml schema (`published` + `dev-local`,
#                   dev-local expressed as `inherits: published` plus ONLY
#                   the keys that differ — a key absent from dev-local's
#                   `images:` means it deliberately shares published's image)
#   compose_env  -> images/platform-images.generated.env, one group per
#                   compose file (monitoring / metrics / logs / dashboard)

