consumers:
  product_env:
    review:
      MNS_PRODUCT_SHELL_IMAGE: mns_product_shell
      MNS_AUTHORING_IMAGE: mns_authoring
      MNS_STACK_GENERATOR_IMAGE: mns_stack_generator
      MNS_BLOCKS_IMAGE: mns_blocks
    dashboard:
      DASHBOARD_BACKEND_IMAGE: dashboard_backend
      DASHBOARD_FRONTEND_IMAGE: dashboard_frontend
    tools:
      AIRSIM_TOOLS_IMAGE: airsim_tools

  image_sets:
    published:
      pull_policy: always
      images:
        simulators:
          blocks: mns_blocks
          xfs: xfs
          safti_city: safti_city
          condo: condo
          unreal_authored: unreal_authored
        autopilots:
          ardupilot: ardupilot
          px4: px4
        ros2_bridge: ros2_bridge
        qgroundcontrol: qgroundcontrol
        sim_real_eval: sim_real_eval

    dev-local:
      inherits: published
      pull_policy: if_not_present
      images:
        simulators:
          blocks: local_blocks
          xfs: local_xfs
          safti_city: local_safti_city
          # condo: absent on purpose — no local/ condo build exists, so
          # dev-local deliberately runs published's condo image unchanged.
          # This is the ONLY role in this image set that is genuinely shared;
          # every other role below has its own local_* row.
          unreal_authored: local_unreal_authored
        autopilots:
          ardupilot: local_ardupilot
          px4: local_px4
        ros2_bridge: local_ros2_bridge
        qgroundcontrol: local_qgroundcontrol
        sim_real_eval: local_sim_real_eval

  compose_env:
    monitoring:
      MOCK_DATA_GENERATOR_IMAGE: mock_data_generator
      EXPLORATION_MOCK_GENERATOR_IMAGE: exploration_mock_generator
      PROMETHEUS_IMAGE: prometheus
      PUSHGATEWAY_IMAGE: pushgateway
      JSONL_INGESTOR_IMAGE: jsonl_ingestor
      GRAFANA_IMAGE: grafana
      CADVISOR_IMAGE: cadvisor
      NODE_EXPORTER_IMAGE: node_exporter
      DCGM_EXPORTER_IMAGE: dcgm_exporter
      METRICS_EXPORTERS_IMAGE: metrics_exporters
      POSTGRES_TELEMETRY_IMAGE: postgres_telemetry
      ELASTICSEARCH_IMAGE: elasticsearch
      FOXGLOVE_BRIDGE_IMAGE: foxglove_bridge
      MONITORING_LICHTBLICK_IMAGE: monitoring_lichtblick
    metrics:
      METRICS_COLLECTOR_IMAGE: metrics_collector
    logs:
      LOKI_IMAGE: loki
      ALLOY_IMAGE: alloy
    dashboard:
      DASHBOARD_LICHTBLICK_IMAGE: dashboard_lichtblick
      DASHBOARD_TIMESCALEDB_IMAGE: dashboard_timescaledb

  # Legacy static scenario stacks (R-6). Grouped by scenario — unlike
  # product_env/compose_env's grouping (which is purely cosmetic, one var
  # never appears in two groups), a var HERE can legitimately appear under
  # more than one scenario with a DIFFERENT image key (AIRSIM_IMAGE,
  # AIRSIM_CONDO_IMAGE — see the "conflicting defaults" rows above). That is
  # why this grouping is load-bearing: it is how tools/images.py's renderer
  # tells "same value everywhere" (safe to emit one env line) apart from
  # "differs by scenario" (must NOT emit a line for it — see
  # docs/adr/0002-one-image-catalog.md "Legacy scenario stacks"). The
  # ${VAR:-default} fallback already in every one of these compose files is
  # UNCHANGED by this catalog — see the ADR for why.
  legacy_env:
    ardupilot_condo:
      ARDUPILOT_IMAGE: ardupilot_slim
      AIRSIM_CONDO_IMAGE: condo
      AIRSIM_BRIDGE_IMAGE: airsim_ros2_bridge_legacy
      QGC_IMAGE: qgroundcontrol
    ardupilot_urbansim:
      ARDUPILOT_IMAGE: ardupilot_slim
      AIRSIM_BRIDGE_IMAGE: airsim_ros2_bridge_legacy
      ZENOH_BRIDGE_IMAGE: zenoh_bridge_ros2dds
      AIRSIM_IMAGE: airsim_urbansimdemo
      PIXEL_STREAMING_SIGNALLING_IMAGE: pixel_streaming_signalling
      QGC_IMAGE: qgroundcontrol
    ardupilot_xfs:
      ARDUPILOT_IMAGE: ardupilot_slim
      AIRSIM_BRIDGE_IMAGE: airsim_ros2_bridge_legacy
      ZENOH_BRIDGE_IMAGE: zenoh_bridge_ros2dds
      AIRSIM_IMAGE: airsim_xfs_legacy
      PIXEL_STREAMING_SIGNALLING_IMAGE: pixel_streaming_signalling
      QGC_IMAGE: qgroundcontrol
    px4_condo:
      AIRSIM_CONDO_IMAGE: condo_latest_legacy
      PX4_IMAGE: px4
      AIRSIM_BRIDGE_IMAGE: airsim_ros2_bridge_legacy
      QGC_IMAGE: qgroundcontrol
      PIXEL_STREAMING_SIGNALLING_IMAGE: pixel_streaming_signalling
    px4_xfs:
      AIRSIM_IMAGE: xfs
      PX4_IMAGE: px4
      AIRSIM_BRIDGE_IMAGE: airsim_ros2_bridge_legacy
      QGC_IMAGE: qgroundcontrol
