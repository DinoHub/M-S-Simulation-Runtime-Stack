schema: mns.images.v1

# Reminders that belong to no single image row. `tools/images.sh status`
# prints these under NEEDS YOU every time it runs, which is the point: a
# gated migration that lives only in someone's memory is a migration that
# quietly never happens. Delete an entry when it is done.
follow_ups: []
# One canonical image catalog. Every container image this repository refers to
# is a row here, exactly once — see docs/adr/0002-one-image-catalog.md for the
# decision record. Nothing under images/*.generated.* or product-images.env is
# hand-edited: they are rendered from this file by `tools/images.sh sync`, and
# `tools/images.sh verify` (the CI gate) fails the build if a generated file
# and this catalog have drifted apart. Edit here, then sync — never the other
# way around.
#
# `digest` is the contract: it is what `repo:tag@sha256:...` actually resolves
# to, on every machine, forever. `tag` stays alongside it purely for humans —
# nothing prevents a tag being repointed at a different image, so the tag
# alone is not a pin. Every digest below is the INDEX (manifest-list) digest,
# not a per-architecture manifest. Read it off the `Digest:` line of
# `docker buildx imagetools inspect <ref>`'s DEFAULT report — not
# `--format '{{.Manifest.Digest}}'`, which silently prints the wrong thing for
# a single-arch image, and not `docker manifest inspect -v`, which reports the
# per-arch entry and is the easy way to get this wrong for a multi-arch tag. See MnS-Integration-Platform/docs/adr/0001-image-versioning-
# and-digest-pinning.md for the fuller reasoning (this catalog generalizes that
# decision to every image, not just the product ones).
#
# `channel` drives report/bump behavior:
#   review   - repo:tag-review.N; `tools/images.sh bump` advances N via Hub
#              tag search. The tag MUST end in -review.N: bump derives the
#              family from the tag itself, so an off-line tag here would
#              report NO_TAGS_FOUND forever. Enforced by _validate_catalog.
#   moving   - repo:tag-latest (or similar); tag never changes, digest may;
#              republished in place, reported as TAG_MOVED when it happens
#   upstream - third-party image on a version tag; never auto-bumped
#   pinned   - published, but deliberately off the release line (a branch or
#              preview build). Digest required; verified by report like any
#              other row; refused by bump. Moves only by hand.
#   local    - locally built (repo starts with local/); digest is always
#              null and the row is skipped by both verify and bump
#   unpublished - referenced by this repo but absent from the registry;
#              digest null, no lookup attempted, bump refuses
#
# `pending: "<why>"` on a pinned row: the row names its tag (an rc build the
# release owner has not pushed or pinned yet) but not its digest yet, so
# `digest: null`. Rendered tag-only. `tools/images.sh verify` prints a
# WARNING for it and passes (lenient: a pin being filled in is not breakage);
# `tools/images.sh status` lists it under NEEDS YOU. Fill it in with
# `tools/images.sh bump --only KEY`, which resolves the pinned tag's digest
# and deletes the `pending:` line (the only way bump touches a pinned row).
#
# `pull: false`: the row is pinned for checks (tools/images.sh verify's host
# label checks) but never pulled by setup, ensure-images or pull-all-images.
# The runtime host kit image is one: packaging and authoring builds read it,
# product users never need its ~700 MB.
#
# `resolver` says how report/bump find the live digest:
#   hub        - Docker Hub v2 API (default; needed for -review.N enumeration)
#   imagetools - `docker buildx imagetools inspect <ref>` + the `Digest:` line
#                of its default report (NOT --format '{{.Manifest.Digest}}',
#                which silently prints the wrong thing for a single-arch
#                image — see tools/images.py). Used for third-party registries
#                (gcr.io, nvcr.io, ghcr.io, docker.elastic.co) and third-party
#                Hub orgs this repo does not control (prom/, grafana/,
#                sid220/, timescale/).
#
# `bakes` on an image row means: that image's Dockerfile bakes in another
# row's ref as a build-time default (<VAR>_DEFAULT, where VAR is the row's
# release-channel or product_env variable). `tools/images.sh baked` walks
# these edges and asserts the released image's baked value still matches the
# pin here. No row declares one in v1.0.0: a baked pin makes every rebuild of
# the baked image force a rebuild of the one baking it, so images take their
# pins at run time instead (the dashboard backend stopped baking in
# TEVV-Web-Dashboard#122).
#
# `consumers:` binds an image (by key) to how it is actually referenced, so no
# image is listed twice under two different names:
#   product_env  -> product-images.env (channel-independent tool pins; none in
#                   v1.0.0, see the file's header for why it still exists)
#   release_channels -> images/<release>.generated.env, the product's images
#   image_sets   -> images/image-set.generated.yaml, mirroring the platform
#                   stackgen schema: what generated stacks run.
#   compose_env  -> images/platform-images.generated.env, the dashboard
#                   compose file's inline images

images:
  # ---------------------------------------------------------------------
  # MnS-Integration-Platform images that generated stacks run
  # ---------------------------------------------------------------------
  qgroundcontrol:
    repo: dhdevspace/auto_mns
    tag: airsim-qgc-x11-latest
    digest: sha256:fe1e9e05d9300afeab92787973b84c378cf021c25f0f61b8f27cbf712e299804
    channel: moving
    purpose: >-
      QGroundControl (X11), the published qgroundcontrol role
      (MnS-Integration-Platform integrations/qgroundcontrol).
    follow_up: >-
      v1.0.0 pins this as the immutable tag airsim-qgc-x11-v1.0.0, a retag of
      this digest (same bits). The retag is published in phase 6; then set
      tag: airsim-qgc-x11-v1.0.0, channel: pinned, keep the digest, and delete
      this note.

  sim_real_eval:
    repo: dhdevspace/auto_mns
    tag: "sim-real-eval-worker-v1.0.0-rc"
    digest: sha256:9780594b56cc29c5e5432188b9d70260a72f3804dd933fcd9f3183c590d9f67a
    channel: pinned
    purpose: >-
      Sim-to-real evaluation worker, the published sim_real_eval role
      (MnS-Integration-Platform platform/sim_real_eval).
    follow_up: >-
      v1.0.0 pins this as the immutable tag sim-real-eval-worker-v1.0.0, the
      accepted sim-real-eval-worker-v1.0.0-rc build. It is published in phase
      6; then set tag: sim-real-eval-worker-v1.0.0, channel: pinned, its
      digest, and delete this note.

  vio_estimator_openvins:
    repo: dhdevspace/auto_mns
    tag: vio-estimator-openvins-69488123
    digest: sha256:ac48f34984863b159c0bf805e4f8ea2daecff4c23539aac00afd89c4d3a48078
    channel: pinned
    purpose: >-
      OpenVINS (ov_msckf) on ROS 2 Humble, the published vio_estimator role --
      the estimator scenarios/vio-reference flies, and the default any scenario
      gets from extensions."mns.vio_estimator" with kind: openvins.

      The tag carries the upstream commit it was built from
      (rpng/open_vins @ 69488123ed9362dd44b6f28e7f4680abbff1442b), because a
      moving tag would let a rebuild at a different ref reuse the name and a
      campaign could then not say which estimator produced its numbers. Built by
      MnS-Integration-Platform docker/build_vio_estimator_image.sh; rebuild at
      another ref and the tag changes, so this row misses loudly rather than
      running the wrong estimator quietly.

  # ---------------------------------------------------------------------
  # Upstream images — docker-compose-dashboard.yml inline rows (the
  # dashboard backend/frontend are release-channel rows, below)
  # ---------------------------------------------------------------------
  dashboard_lichtblick:
    repo: ghcr.io/lichtblick-suite/lichtblick
    tag: "latest"
    digest: sha256:230ed53813f11ab5d23c47380f94c6d358438ecf15c3a7e7de9625b07c437611
    channel: upstream
    resolver: imagetools
    purpose: Lichtblick instance embedded in the TEVV Web Dashboard (port 8082, URL baked into the frontend build).

  dashboard_timescaledb:
    repo: timescale/timescaledb
    tag: 2.17.2-pg16
    digest: sha256:4e459e217f00cbb09920c34d245501e63427e6767a495de57ce76823ff280f12
    channel: upstream
    resolver: imagetools
    purpose: Opt-in (--profile db) telemetry database for the dashboard.

  # ---- MnS 1.0 (channel v1): baseline rebuilt from release/v1.0.0 on 2026-09-18 ----
  v1_runtime_host:
    repo: dhdevspace/auto_mns
    tag: "tevv-runtime-host-v1.0.0-zones.3"
    digest: sha256:0fc576dd9da1029fcd70166934ad3de961842ed07c6ef451acdba1408db6f4a7
    channel: pinned
    purpose: >-
      MnS 1.0 generic TEVVRuntimeHost: tevv-runtime-host-v1.0.0-rc (TEVV-Airsim release/v1.0.0-next 131d7183fb98, sha256:ba371894...) with only its game binary swapped for one built from 131d7183fb98 + feat/pack-level-zones da0d4eac9 + fix/scenario-plugin-origin-and-streaming 390326805 (TEVV-Airsim#226: ScenarioPlugin objects use the stack origin and, on World Partition levels, wait for their cells to stream in before random spawns trace for the floor), so the MetricsEmitter emits zone and geofence events for the stack's zones file (MNS_ZONES_FILE) on pack levels, and Env.ExportOverview takes an explicit window and writes an opaque base-colour top-down picture (the run's map background, captured at stop). Cooked content, shaders, host contract and host_compatibility_id are the base image's (ue-5.8.2-cl56702186-linux-development-vulkan-sm6-iostore-v2), so level packs stay valid. The content-pack SDK plugin compiled in is a local copy matching rc5's strings, not the release asset (unreachable from the build machine); rebuild from the release once TEVV-Airsim#225 merges. Shared Scenario* plugins single copy (shared_set_id a2473476), SDK 1.0.0rc5; its layered kit is v1_runtime_host_kit, iceoryx2 SHM camera publishing.

  v1_authoring:
    repo: dhdevspace/auto_mns
    tag: "mns-authoring-v1.0.0-rc.pkg.1"
    digest: sha256:4b6c72215cf157867c01a9cbc6006a808474eaa287b8a6d9b392a424ff32d0c1
    channel: pinned
    purpose: >-
      MnS 1.0 ScenarioLab, a full package (BuildCookRun, not an exe swap) of TEVV-Authoring feat/asset-thumbnails 3d17ced (TEVV-Authoring#35, #36 on release/v1.0.0-next), built kit-only with --kit <v1_runtime_host_kit> --strict (labels tevv.authoring.kit_image / tevv.authoring.shared_set_id): the nine shared Scenario* plugins, UDS and the preview content come from that kit (TEVV-Airsim 131d7183fb98). Content-pack SDK 1.0.0rc6, with the one waiver sdk-version:mns-contentpacks (the host was built with rc5; rc6's Unreal plugin zip is byte-identical). Bakes mns_vehicle_models 1.0.4 (sha256:317a6dd7...). Its host contract (packs/authoring-host-compatibility.v1.json, embedded) ships the runtime host's engine plugins CableComponent, ChaosVehiclesPlugin, GeoReferencing and SunPosition, so Fisherman's Cabin and Condo open in the editor, and names the runtime-only plugins (AirSim, AirSimFCTeleporter, MetricsEmitter, MetricsVehicleTelemetry, ScenarioDegradation) staging opens packs without. ScenarioLab is the ScenarioSpec writer of record (reads specs whole with their comments, writes one ScenarioSpec.yaml, applies dashboard edits headless with -MnSApplyScenarioRequest, including set_extension for the scenario's measuring and judging in extensions."mns.metrics"); camera list with rig presets; random spawn preview with the runtime's sampling, new spawn boxes reaching below the floor; asset pickers with pictures (the pack's, else rendered and cached under Thumbnails/); hand-written specs open faithfully; Blueprint spawn assets preview as themselves.

  v1_stacks:
    repo: dhdevspace/auto_mns
    tag: "mns-stacks-v1.0.0-rc.services.27"
    digest: sha256:4004d6b96b3158225376b2b5157c328a3e074c6eb7ebe75a7b41495ee010d4d2
    channel: pinned
    purpose: >-
      mns-stacks (MnS-Integration-Platform platform/stacks, ENTRYPOINT
      mns-stacks): stack generation, run/stop/status/logs, the one bag
      recorder (record, run --record --until-done), campaigns and the
      compatibility check. The dashboard, make fly/stop/campaign/stacks,
      tools/images.sh drift and osmo/campaign.py all run it as a sibling
      container with host paths. Replaces mns-product-shell and
      mns-stack-generator, which are retired and no longer pinned. Local overlay: the rc image with platform/stacks from MnS-Integration-Platform feat/components a165246 (components and adaptors, the campaign runner with autopilot from the stack contract, start/end conditions, top-down capture at stop, and the PX4 pilot keeping OFFBOARD alive while arming). Campaign missions fly the vehicle under its runtime name, where MAVROS runs, and PX4 stacks run AirSim in lockstep on the SteppableClock: with lockstep off, PX4's periodic timers stopped at arming, battery_status went stale and every PX4 flight raised a 'Battery unhealthy' failsafe.

  v1_packs:
    repo: dhdevspace/auto_mns
    tag: "mns-packs-v1.0.0-rc.6"
    digest: sha256:8b848145049ca969f009070b56df9273dc70a02cf52a3611f33f43c959ab7a4a
    channel: pinned
    purpose: >-
      mns-packs (TEVV-Content-Pack-SDK docker/Dockerfile, ENTRYPOINT
      mns-packs): verify, install, list, status and stage-authoring --lock for
      the product's pack tools (tools/install_demo_packs.py,
      tools/stage-authoring-packs.sh, tools/build_pack_lock.py), so the
      product needs no host copy of the SDK. The content-pack SDK release v1.0.0-rc.6 (TEVV-Content-Pack-SDK 08de04a, built with scripts/build_image.sh): asset pack pictures (assets[].thumbnail, #11) and authoring hosts' runtime_only_plugins (#12), so stage-authoring opens a level that needs only the runtime host's simulator and metrics plugins.

  v1_runtime_host_kit:
    repo: dhdevspace/auto_mns
    tag: "tevv-runtime-host-kit-v1.0.0-rc"
    digest: sha256:e9acd116b85565b723c1c9da55d2b05dd8b551793a8c2cd20c7a020ce347dbcc
    channel: pinned
    pull: false
    purpose: >-
      The runtime host's companion kit image (FROM scratch: /kit/** and
      /kit/host-baseline.json), written by the host build's mns-packs kit
      build. The host image's tevv.host.kit_image label names its digest, and
      tools/images.sh verify warns when that label and this pin differ.
      Packaging and authoring builds read it; the product never pulls it.

  v1_ros2_bridge:
    repo: dhdevspace/auto_mns
    tag: "tevv-airsim-ros2-bridge-humble-v1.0.0-rc"
    digest: sha256:68af89693de7d70e3903719a139ece6bde0013b12132ba8a3c56b4f91cb7e0bf
    channel: pinned
    purpose: >-
      MnS 1.0 AirSim<->ROS 2 bridge (TEVV-Airsim-ROS2-Bridge release/v1.0.0-next 61b2b8a66553): the v1.0.0 build (459952e) plus the image-capture dedupe fix and image publisher history depth 5, so recordings pass fresh_frames and stereo_skew; built like v1.0.0 (docker/Dockerfile, ROS_DISTRO=humble, same base); 158 colcon tests green.

  v1_px4:
    repo: dhdevspace/auto_mns
    tag: px4-airsim-px4-v1.0.0
    digest: sha256:0f03b74335e92450efba7421782d7ca2986edef2c4b900c3350729c8a2e7deea
    channel: pinned
    purpose: >-
      MnS 1.0 PX4 SITL v1.14.4 built from Dockerfile.px4 (TEVV-PX4-Autopilot master) with mavlink-router, pymavlink and the loopback UDP control endpoint.

  v1_ardupilot:
    repo: dhdevspace/auto_mns
    tag: ardupilot-v1.0.0
    digest: sha256:93b9e50b7b44e91aafd38b9a223100d7c67f971ebd9c246bce3582ed9ef015c1
    channel: pinned
    purpose: >-
      MnS 1.0 ArduPilot SITL built from source (Dockerfile.ardupilotbuild, ref 142aece2) with mavlink-router and system pymavlink; arducopter binary identical to the flown origin image.

  v1_dashboard_backend:
    repo: dhdevspace/auto_mns
    tag: "tevv-web-dashboard-backend-v1.0.0-live.20"
    digest: sha256:e2daa340d3141a50b6368f3e2c4683801597483a7dc421003e419a79ea3bda52
    channel: pinned
    source:
      repo: DinoHub/TEVV-Web-Dashboard
      commit: 418384f
    # No `bakes:`. From TEVV-Web-Dashboard#122 on the backend bakes no image
    # pins: it reads MNS_STACKS_IMAGE, MNS_PACKS_IMAGE and MNS_AUTHORING_IMAGE
    # from images/v1.0.0.generated.env through docker-compose-dashboard.yml,
    # so rebuilding mns-stacks, mns-packs or the authoring image is a repin
    # here, never a dashboard rebuild.
    purpose: >-
      MnS 1.0 dashboard backend (TEVV-Web-Dashboard release/v1.0.0-next 3ceef32),
      pilot from integration 28030f8: REST takeoff reports success only once
      armed and climbed; WASD re-enters OFFBOARD after Hold; STOP holds via the
      autopilot; one REST flight command per vehicle. Every stack lifecycle,
      recording, campaign and topic call goes through mns-stacks and pack status
      through mns-packs as sibling containers; it bakes no image pins. Now TEVV-Web-Dashboard feat/live-stack-viewer 289866e (#129): Campaign step, ScenarioLab-written specs, run maps, and Monitor showing a flying campaign run. The Campaign step lists a run while it is in the air (with Watch live), loads what runs are judged on, shows a rerun's current attempt, reads FAIL for a run that failed, and shows a reopened campaign's last results. The Content step counts ScenarioLab's runtime-only plugins as openable. The wizard is Content, Author, Generate, ROS 2, Test plan, Run, Analysis: the Test plan step (required) holds measuring, judging, the mission and the runs in one place, with measuring and judging in the scenario's ScenarioSpec (extensions."mns.metrics", written through ScenarioLab) so single, plan and OSMO runs read one source; Run runs the plan with Watch live and verdicts, and keeps manual flying as a secondary option.

  v1_dashboard_frontend:
    repo: dhdevspace/auto_mns
    tag: "tevv-web-dashboard-frontend-v1.0.0-live.20"
    digest: sha256:7a1a713897a2f37bffc5e925df56201c5555039973469159eebc780b7de91589
    channel: pinned
    source:
      repo: DinoHub/TEVV-Web-Dashboard
      commit: 418384f
    purpose: >-
      MnS 1.0 dashboard frontend (TEVV-Web-Dashboard release/v1.0.0-next
      3ceef32), built with the backend above; it bakes no pins. Now feat/live-stack-viewer 418384f, built with the backend above.

  metrics_service:
    repo: dhdevspace/auto_mns
    tag: "tevv-jsonl-ingest-v0.4.5-gfc88f57"
    digest: sha256:7d34a9fb817095071586d739eddcab7c193d6b58e544d00911927137fe74976b
    channel: pinned
    source:
      repo: DinoHub/TEVV-Metrics
    purpose: >-
      The product metrics service (TEVV-Metrics jsonl_ingestor 0.4.5, branch
      feat/component-scoring fc88f57): `watch` scores each finished run under
      generated/**/outputs/metrics (any run folder, campaign stacks too) into
      runs/<stack>/<run_id>/metrics/ against the stack's own
      config/metrics/evaluation.yaml, judges component results, and serves
      them read-only on :8770. Spawn settling and touch-downs are ground
      contacts, never collisions; the ground under a parked or landing
      vehicle is not an obstacle-clearance violation. Geofences, zones and
      coverage areas come from the stack's zones.json; the simulator's own
      zone events for them confirm, not add. A new version re-scores
      every run on disk. Each run also gets map.svg (path, collisions,
      goals, zones; on the simulator's top-down capture when the run has
      one), served at /runs/<stack>/<run>/map.svg. See docs/metrics.md.

consumers:
  # Empty in v1.0.0: its one row (airsim-tools) was removed. product-images.env
  # is still rendered, header only, because the pinned dashboard backend checks
  # for it to recognise this checkout (see images/product-images.env.tmpl).
  product_env: {}

  # A release channel binds the product's image variables to one coordinated
  # set of images and emits them to its own file. A consumer selects a channel
  # by sourcing that file. v1 (MnS 1.0, UE 5.8.2) is the stable line and the
  # only one; a later release adds a channel here.
  release_channels:
    v1:
      emits: images/v1.0.0.generated.env
      image_set: v1
      vars:
        MNS_PACKS_IMAGE: v1_packs
        MNS_STACKS_IMAGE: v1_stacks
        MNS_AUTHORING_IMAGE: v1_authoring
        MNS_RUNTIME_HOST_IMAGE: v1_runtime_host
        MNS_RUNTIME_HOST_KIT_IMAGE: v1_runtime_host_kit
        MNS_ROS2_BRIDGE_IMAGE: v1_ros2_bridge
        DASHBOARD_BACKEND_IMAGE: v1_dashboard_backend
        DASHBOARD_FRONTEND_IMAGE: v1_dashboard_frontend
      # One host pin, one kit: tools/images.sh verify reads these images'
      # labels (local images only; status also asks the registry) and WARNS
      # when they disagree; verify --release FAILS:
      #   host tevv.host.kit_image == authoring tevv.authoring.kit_image
      #     == the kit row's digest
      #   authoring tevv.authoring.shared_set_id == host tevv.host.shared_set_id
      #   authoring tevv.authoring.shared_plugins_source / host_check_waived:
      #     present = a dev build; rebuild with --kit <kit row> --strict
      host_pin:
        host: v1_runtime_host
        kit: v1_runtime_host_kit
        authoring: v1_authoring

  # A pack release lock (packs/*.lock.json) restates a few image pins because
  # tools/install_demo_packs.py has to run mns-packs before anything in this
  # repo has resolved an image set. That is a second copy of a pin, so
  # the edge is declared here (lock key -> catalog key) and
  # `tools/images.sh verify` asserts the JSON still agrees, offline. A bump
  # that advances one of these rows fails CI until the lock is regenerated.
  pack_locks:
    packs/v1.0.0.lock.json:
      packs: v1_packs
      stacks: v1_stacks
      authoring: v1_authoring
      runtime_host: v1_runtime_host
      ros2_bridge: v1_ros2_bridge

  image_sets:
    # What generated stacks run (MNS_IMAGE_SET=v1, set by the v1 channel file).
    v1:
      pull_policy: missing
      images:
        simulators:
          tevv_runtime_host: v1_runtime_host
        autopilots:
          ardupilot: v1_ardupilot
          px4: v1_px4
        ros2_bridge: v1_ros2_bridge
        qgroundcontrol: qgroundcontrol
        sim_real_eval: sim_real_eval
        vio_estimator: vio_estimator_openvins

  compose_env:
    dashboard:
      DASHBOARD_LICHTBLICK_IMAGE: dashboard_lichtblick
      DASHBOARD_TIMESCALEDB_IMAGE: dashboard_timescaledb
      METRICS_SERVICE_IMAGE: metrics_service

