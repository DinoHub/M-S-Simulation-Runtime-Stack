consumers:
  product_env:
    review:
      MNS_PRODUCT_SHELL_IMAGE: mns_product_shell
      MNS_AUTHORING_IMAGE: mns_authoring
      MNS_STACK_GENERATOR_IMAGE: mns_stack_generator
      MNS_BLOCKS_IMAGE: mns_blocks
    dashboard:
      DASHBOARD_BACKEND_IMAGE: dashboard_backend
      DASHBOARD_FRONTEND_IMAGE: dashboard_frontend
    tools:
      AIRSIM_TOOLS_IMAGE: airsim_tools

  image_sets:
    published:
      pull_policy: always
      images:
        simulators:
          blocks: mns_blocks
          xfs: xfs
          safti_city: safti_city
          condo: condo
          unreal_authored: unreal_authored
        autopilots:
          ardupilot: ardupilot
          px4: px4
        ros2_bridge: ros2_bridge
        qgroundcontrol: qgroundcontrol
        sim_real_eval: sim_real_eval

    dev-local:
      inherits: published
      pull_policy: if_not_present
      images:
        simulators:
          blocks: local_blocks
          xfs: local_xfs
          safti_city: local_safti_city
          # condo: absent on purpose — no local/ condo build exists, so
          # dev-local deliberately runs published's condo image unchanged.
          unreal_authored: local_unreal_authored
        autopilots:
          # px4: absent on purpose, same reason — dev-local deliberately
          # shares published's px4 image (no local/ px4 build exists).
          ardupilot: local_ardupilot
        ros2_bridge: local_ros2_bridge
        qgroundcontrol: local_qgroundcontrol
        sim_real_eval: local_sim_real_eval

  compose_env:
    monitoring:
      MOCK_DATA_GENERATOR_IMAGE: mock_data_generator
      EXPLORATION_MOCK_GENERATOR_IMAGE: exploration_mock_generator
      PROMETHEUS_IMAGE: prometheus
      PUSHGATEWAY_IMAGE: pushgateway
      JSONL_INGESTOR_IMAGE: jsonl_ingestor
      GRAFANA_IMAGE: grafana
      CADVISOR_IMAGE: cadvisor
      NODE_EXPORTER_IMAGE: node_exporter
      DCGM_EXPORTER_IMAGE: dcgm_exporter
      METRICS_EXPORTERS_IMAGE: metrics_exporters
      POSTGRES_TELEMETRY_IMAGE: postgres_telemetry
      ELASTICSEARCH_IMAGE: elasticsearch
      FOXGLOVE_BRIDGE_IMAGE: foxglove_bridge
      MONITORING_LICHTBLICK_IMAGE: monitoring_lichtblick
    metrics:
      METRICS_COLLECTOR_IMAGE: metrics_collector
    logs:
      LOKI_IMAGE: loki
      ALLOY_IMAGE: alloy
    dashboard:
      DASHBOARD_LICHTBLICK_IMAGE: dashboard_lichtblick
      DASHBOARD_TIMESCALEDB_IMAGE: dashboard_timescaledb
