# OSMO Quickstart cluster, GPU variant (NVIDIA/OSMO deploy_local.rst, Option A).
#
# Create it with nvkind, not kind, so the host GPU is passed through to the
# compute worker:
#
#   nvkind cluster create --config-template=osmo/kind-osmo-cluster-config.gpu.yaml
#   nvkind cluster print-gpus
#   kubectl config use-context kind-osmo
#
# nvkind requires docker's default runtime to be nvidia, which is a sudo step on
# the host (`nvidia-ctk runtime configure --runtime=docker --set-as-default`).
# The CPU-only variant beside this file needs none of that.
#
# Node roles are the same three as the CPU config: the Kubernetes control-plane
# and the control worker host the platform services, the compute worker runs
# submitted workflows. The control worker maps gateway NodePort 30080 to host
# port 80, which is what `osmo login http://localhost` talks to.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: osmo
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "osmo.nvidia.com/node-pool=control-plane"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "osmo.nvidia.com/node-pool=control-plane"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
  - role: worker
    extraMounts:
      # Hands every host GPU to this node. The NVIDIA container runtime reads
      # the presence of this path, not its contents, which is why /dev/null is
      # the documented source.
      - hostPath: /dev/null
        containerPath: /var/run/nvidia-container-devices/all
      # The product checkout, which carries both halves of what a sim task
      # needs: the channel pack stores under .mns/, and the per-stack config
      # that stackgen writes under generated/<stack>/config -- settings.json,
      # scenario_runtime.json, environment_parameters.json, object_clutter.yaml,
      # content-packs/resolved-pack-set.json and the rest. A pod cannot see a
      # host directory unless kind mounts it into the node first, so this is the
      # prerequisite for any task declaring volumeMounts.
      #
      # Mounting the checkout rather than reproducing those files as OSMO
      # `files:` entries is deliberate: stackgen stays the single source of
      # truth for what a run is, and the workflow only schedules it. Twelve
      # generated files restated by hand in a workflow would drift the first
      # time the generator changed one.
      #
      # Read-only, so a run can load a pack and read its config but cannot
      # write back into the checkout. A task that must produce artifacts needs
      # its own writable mount.
      - hostPath: /home/mnsuser/M-S-Simulation-Runtime-Stack
        containerPath: /workspace
        readOnly: true
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "osmo.nvidia.com/node-pool=compute"
