# Loki for the local OSMO cluster: every task's output, by workflow.
# grafana/loki 7.3.0 (Loki 3.6), installed by observability/install.sh.
#
# One process on the filesystem, on the service node beside the registry, so
# it is up whether or not the GPU node is. Alloy (../alloy) is what feeds it.
# Pass/fail never comes from here: gates are verdict.json, in the registry.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
    - from: "2026-09-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
  limits_config:
    retention_period: 720h            # 30 days, the architecture spec's figure
    allow_structured_metadata: true   # workflow_id and pod ride as metadata, not labels
    # The simulator bursts. A 20,000-line burst is what OSMO's own log copy
    # dropped half of; these keep Loki from doing the same.
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 64
    per_stream_rate_limit: 16MB
    per_stream_rate_limit_burst: 64MB
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_query_lookback: 720h
    # Loki 3 adds detected_level and service_name as labels on its own; the
    # first split one task's output into three streams. Neither is wanted:
    # job, task and source already say what a line is.
    discover_log_levels: false
    discover_service_name: []
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: false
  ui:
    enabled: false

singleBinary:
  replicas: 1
  nodeSelector:
    node_group: service
  persistence:
    enabled: true
    size: 20Gi
    storageClass: standard
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 2Gi}

# Single binary: none of the scalable targets, caches, gateway or test pods.
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
gateway: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
minio: {enabled: false}
sidecar:
  rules:
    enabled: false
