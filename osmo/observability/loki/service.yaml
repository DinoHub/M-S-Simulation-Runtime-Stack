# Loki as the host reaches it (Grafana on the kind network, campaign.py): the
# service node's InternalIP plus this NodePort.
apiVersion: v1
kind: Service
metadata:
  name: loki-nodeport
  namespace: tevv
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/component: single-binary
  ports:
  - name: http
    port: 3100
    targetPort: 3100
    nodePort: 31100
