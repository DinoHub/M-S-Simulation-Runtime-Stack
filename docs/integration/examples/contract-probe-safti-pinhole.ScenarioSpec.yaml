schema: mns.scenario.v1
id: contract-probe-safti-pinhole
name: contract-probe-safti-pinhole
environment:
  id: safti-level
  version: 1.0.3
  artifact_digest: sha256:1dbd30834a4c96654ea20a7f011b74399891bd0331abcf2ab3aae4157f03c9c2
# Render override for this level (MnS-Integration-Platform stackgen, conditions.render):
# SAFTI ships with virtual shadow maps off and re-renders its Nanite scene into an
# 8192x2048 cascaded shadow atlas once per view (viewport + each camera) -- 31 of a
# 46 ms GPU frame with two cameras. VSM: 20 ms frame, camera delivery doubled.
# XFS does not want this (no atlas cost, +2.5 ms with VSM), so it lives here, not on the host.
conditions:
  render:
    virtual_shadow_maps: true
runtime:
  profile: airsim_unreal_px4_docker
  features:
    sim_real_eval: true
    ros2_bridge: true
    qgroundcontrol: false
    mavros: false
vehicles:
- id: drone_1
  name: Drone1
  runtime_name: Drone1
  ros_domain_id: 1
  start:
    x: 0
    y: 0
    z: 0
    yaw: 0
  cameras:
    front:
      capture_settings:
      - image_type: 0
        width: 640
        height: 480
        fov_degrees: 80
        exposure_compensation: -11.0
  sensors:
    imu: true
    gps: true
    barometer: true
    magnetometer: true
    gpu_lidar: false
