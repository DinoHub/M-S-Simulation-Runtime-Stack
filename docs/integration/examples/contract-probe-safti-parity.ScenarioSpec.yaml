schema: mns.scenario.v1
id: contract-probe-safti-parity
name: contract-probe-safti-parity
# Gazebo-bench parity probe: same camera as contract-probe-safti-pinhole but
# mounted 0.15 m ahead of the IMU with no vertical offset (the tevv_ws bench
# mount), and an IMU with Gaussian white noise matching the OpenVINS noise
# model (gyro 1.6968e-4 rad/s/sqrt(Hz), accel 2.0e-3 m/s^2/sqrt(Hz); bias
# stability set to zero so only white noise is added, as in the Gazebo world).
# AirSim takes AngularRandomWalk in deg/sqrt(hr) and VelocityRandomWalk in
# mg/sqrt(Hz). Lockstep and the steppable clock are not generator-exposed;
# the trial overlays a patched settings.json for them.
environment:
  id: safti-level
  version: 1.0.1
  artifact_digest: sha256:601f1cf40609cf59a9cfb867c8d670b5cd3ad6195d2b962476cf3f0069a57eb8
runtime:
  profile: airsim_unreal_px4_docker
  features:
    sim_real_eval: true
    ros2_bridge: true
    qgroundcontrol: false
    mavros: false
vehicles:
- id: drone_1
  name: Drone1
  runtime_name: Drone1
  ros_domain_id: 1
  start:
    x: 0
    y: 0
    z: 0
    yaw: 0
  cameras:
    front:
      position:
        x: 0.15
        y: 0
        z: 0
      capture_settings:
      - image_type: 0
        width: 640
        height: 480
        fov_degrees: 80
        exposure_compensation: -11.0
  sensors:
    imu:
      generate_noise: true
      angular_random_walk: 0.5833
      velocity_random_walk: 0.2039
      gyro_bias_stability: 0.0
      accel_bias_stability: 0.0
    gps: true
    barometer: true
    magnetometer: true
    gpu_lidar: false
