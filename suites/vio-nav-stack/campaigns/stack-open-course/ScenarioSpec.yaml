schema: mns.scenario.v1
id: stack-open-course
name: "Stack: an open course on its own estimate (component flies)"
stack_name: stack-open-course

# Purpose: a whole stack reaching goals on its own estimate. The same open
# three-goal course as the planner suite, but the stack estimates its own
# pose from the stereo pair and IMU and maps with the lidar: no ground truth.
# Judged on navigation (goals, contact) and estimate accuracy together.
#
# Based on openvins-yard-box:

# A stereo pair on a quadrotor over the XFS level, and nothing else: no
# estimator, no autonomy. It is the vio-reference rig with the built-in
# estimator taken out, so that a component under test attaches to it from
# outside (`tevv run <this scenario> --component <package>`).
#
# The stack's interface contract (config/stack/contract.json) offers the
# pair as stereo_primary: front (left) and front_right, 0.12 m baseline,
# 640x480, FOV 80 (fx = fy = 381.36), same-stamp captures.
#
#   ./tevv run scenarios/openvins-yard-box --component components/openvins-vio

environment:
  id: xfs-level
  version: 1.0.2
  artifact_digest: sha256:7eeb41a5ad04d3d2f4bd8c5d876703793b7485d93d59d07172d12c174c100871

runtime:
  profile: airsim_unreal_px4_docker
  features:
    sim_real_eval: true
    ros2_bridge: true
    qgroundcontrol: false
    # Required, not optional. The flight goes through MAVROS inside the bridge
    # container, because a generated stack's flight controller streams to its
    # own loopback and publishes no host port. With this false the bridge starts
    # without MAVROS and the pilot waits out its timeout on a flight controller
    # that was never connected.
    mavros: true

vehicles:
- id: "drone_1"
  name: Drone1
  runtime_name: "Drone1"
  ros_domain_id: 1
  # The container yard on XFS, 2.3 m above the ground. Not the origin:
  # XFS has no floor under its world origin (its terrain sits tens of metres
  # above it), so a (0, 0, 0) spawn falls through the world at ~8 m/s and PX4
  # refuses to arm ("vertical velocity unstable"). The level pack carries no
  # PlayerStart pose the generator could use, so this was measured: held
  # 160 m up for the terrain to stream in and dropped, the vehicle came to rest
  # at NED z = -18.70 here. AirSim NED metres, +z DOWN: -21.0 is above it.
  # A container stack stands 4 m east, so routes/yard-box.yaml flies the
  # reference box mirrored to the open west. Same pose as vio-osmo-xfs.
  start:
    x: 423
    y: -906
    z: -21.0
    yaw: 0
  # Stereo pair, 0.12 m baseline. Camera Z is 0.25 m above the IMU: at zero the
  # camera sits inside the airframe and the rotor arms fill about a third of
  # every frame.
  cameras:
    front:
      position:
        x: 0.15
        y: 0
        z: -0.25
      capture_settings:
      - image_type: 0
        width: 640
        height: 480
        fov_degrees: 80
        exposure_compensation: -11.0
    front_right:
      position:
        x: 0.15
        y: 0.12
        z: -0.25
      capture_settings:
      - image_type: 0
        width: 640
        height: 480
        fov_degrees: 80
        exposure_compensation: -11.0
  sensors:
    imu:
      generate_noise: true
      angular_random_walk: 0.5833
      velocity_random_walk: 0.2039
      gyro_bias_stability: 0.0
      accel_bias_stability: 0.0
    gps: true
    barometer: true
    magnetometer: true
    gpu_lidar: true
extensions:
  mns.authoring_app:
    mode: "packaged_exe"
    overlay: ScenarioBundle/authored_overlay.json
    validation_report: ScenarioBundle/validation_report.json
object_clutter:
  seed: 42
  density: none
  placement: scenario_spec
asset_packs:
- id: "mns_vehicle_models"
  version: "1.0.4"
  artifact_digest: "sha256:317a6dd71df24e58b8e34fd0ea2d46a3f24a9eb3e1312eacf5eac621a1512f63"

# The test: TEVV takes off and hands over; the stack flies on its own estimate.
missions:
- id: test
  drone: Drone1
  type: waypoints
  points:
  - [-8, 0, 3]
  - [-8, 8, 3]
  - [0, 8, 3]
  timeout_s: 180
  reach_radius_m: 1.0
  observers:
  - id: no-crash
    type: collisions
    check: {max: 0}
  - id: goals
    type: goals_reached
    check: {min: 1.0}
  - id: ate
    type: estimate_ate
    check: {max: 1.0}
  - id: available
    type: estimate_availability
    check: {min: 0.9}
  - {id: to-goal, type: time_to_goal}
