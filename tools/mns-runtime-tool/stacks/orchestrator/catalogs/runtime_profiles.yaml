schema: mns.runtime_profiles.v1

runtime_profiles:
  airsim_unreal_ardupilot_docker:
    simulator: unreal
    autopilot:
      type: ardupilot
      managed: true
      endpoint: docker
      hostname_prefix: ardupilot-drone
    features:
      qgroundcontrol: true
      ros2_bridge: true
      mavros: true

  airsim_unreal_ardupilot_docker_client:
