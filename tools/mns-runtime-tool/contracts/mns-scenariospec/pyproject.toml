[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mns-scenariospec"
version = "0.1.0"
description = "MnS ScenarioSpec schema, validator, examples, and conformance tests."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
mns-scenariospec = "mns_scenariospec.cli:main"

[tool.setuptools]
packages = ["mns_scenariospec"]

[tool.setuptools.package-data]
mns_scenariospec = []
