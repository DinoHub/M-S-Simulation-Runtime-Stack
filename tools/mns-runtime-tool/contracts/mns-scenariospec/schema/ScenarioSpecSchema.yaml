schema: mns.scenariospec.schema.v1
package: mns.scenario
schema_id: mns.scenario.v1
version: 1
root_message: ScenarioSpec

include_aliases:
  environment: environment
  coordinate_frame: coordinate_frame
  runtime: runtime
  scenario_runtime: scenario_runtime
  conditions: conditions
  weather: conditions
  time_of_day: conditions
  object_clutter: object_clutter
  random_spawns: random_spawns
  random_spawn: random_spawns
  spawn_volumes: random_spawns
  vehicles: vehicles
  vehicle: vehicles
  objects: objects
  object: objects
  assets: assets
  asset: assets
  asset_packs: asset_packs
  entities: entities
  zones: zones
  routes: routes
  sensor_profiles: sensor_profiles
  vehicle_models: vehicle_models
  extensions: extensions
  catalogs: catalogs

enums:
  CoordinateFrameConvention:
    values:
      - airsim_ned
      - ros2_flu
      - ros2_flu_unmarked_player_start_fallback

  RuntimeProfile:
    values:
      - airsim_unreal_ardupilot_docker
      - airsim_unreal_ardupilot_host
      - airsim_unreal_px4_docker
      - airsim_unreal_px4_host

  AutopilotType:
    values:
      - ardupilot
      - px4

  AutopilotEndpoint:
    values:
      - docker
      - host

  WeatherPreset:
    values:
      - clear
      - clear_skies
      - partly_cloudy
      - overcast
      - rain
      - storm
      - fog

  SensorKind:
    values:
      - imu
      - gps
      - barometer
      - magnetometer
      - lidar
      - gpu_lidar
      - camera

  CameraType:
    values:
      - default
      - depth
      - fisheye

messages:
  ScenarioSpec:
    description: Root ScenarioSpec document consumed by the stack generator.
    unknown_fields: allow
    fields:
      - id: 1
        name: schema
        type: string
        required: true
        const: mns.scenario.v1
        description: ScenarioSpec document schema id.

      - id: 2
        name: id
        type: string
        description: Stable scenario id.

      - id: 3
        name: name
        type: string
        description: Human-readable scenario name.

      - id: 4
        name: stack_name
        type: string
        description: Optional generated stack name override.

      - id: 5
        name: includes
        type: any
        description: External YAML/JSON section references merged into this document.

      - id: 6
        name: catalogs
        type: map<string, path>
        description: Optional catalog override files.

      - id: 7
        name: environment
        type: oneof<string, Environment>

      - id: 8
        name: coordinate_frame
        type: CoordinateFrame

      - id: 9
        name: runtime
        type: oneof<string, Runtime>

      - id: 10
        name: scenario_runtime
        type: ScenarioRuntime

      - id: 11
        name: conditions
        type: Conditions

      - id: 12
        name: object_clutter
        type: ObjectClutter

      - id: 13
        name: random_spawns
        type: repeated<RandomSpawnVolume>

      - id: 14
        name: vehicles
        type: repeated<Vehicle>

      - id: 15
        name: objects
        type: repeated<SceneObject>

      - id: 16
        name: assets
        type: repeated<Asset>

      - id: 17
        name: asset_packs
        type: repeated<AssetPack>

      - id: 18
        name: entities
        type: repeated<Entity>

      - id: 19
        name: zones
        type: repeated<Zone>

      - id: 20
        name: routes
        type: repeated<Route>

      - id: 21
        name: sensor_profiles
        type: map<string, SensorProfile>

      - id: 22
        name: vehicle_models
        type: map<string, VehicleModel>

      - id: 23
        name: extensions
        type: map<string, any>
        preserve_unknown: true

      - id: 24
        name: seed
        type: int

  Environment:
    description: Runtime environment, level reference, and world conditions.
    unknown_fields: allow
    fields:
      - id: 1
        name: id
        type: catalog_ref<environment>

      - id: 2
        name: name
        type: string

      - id: 3
        name: image
        type: string

      - id: 4
        name: executable_path
        type: string

      - id: 5
        name: level_pack
        type: path

      - id: 6
        name: level
        type: oneof<string, LevelReference>

      - id: 7
        name: scenario_runtime
        type: ScenarioRuntime

      - id: 8
        name: runtime_artifact
        type: map<string, any>

      - id: 9
        name: time_of_day
        type: TimeOfDay

      - id: 10
        name: weather
        type: Weather

  LevelReference:
    unknown_fields: allow
    fields:
      - id: 1
        name: id
        type: string

      - id: 2
        name: level_id
        type: string

      - id: 3
        name: display_name
        type: string

      - id: 4
        name: map
        type: string

      - id: 5
        name: path
        type: string

      - id: 6
        name: pak_id
        type: string

      - id: 7
        name: pak_name
        type: string

  CoordinateFrame:
    unknown_fields: allow
    fields:
      - id: 1
        name: convention
        type: CoordinateFrameConvention

      - id: 2
        name: unit
        type: string

  Runtime:
    description: Autonomy and bridge runtime selection.
    unknown_fields: allow
    fields:
      - id: 1
        name: profile
        type: oneof<RuntimeProfile, string>

      - id: 2
        name: autopilot
        type: oneof<string, RuntimeAutopilot>

      - id: 3
        name: features
        type: RuntimeFeatures

      - id: 4
        name: metrics
        type: Metrics

  RuntimeAutopilot:
    unknown_fields: allow
    fields:
      - id: 1
        name: type
        type: oneof<AutopilotType, string>

      - id: 2
        name: endpoint
        type: oneof<AutopilotEndpoint, string>

      - id: 3
        name: managed
        type: bool

      - id: 4
        name: hostname_prefix
        type: string

  RuntimeFeatures:
    unknown_fields: allow
    fields:
      - id: 1
        name: qgroundcontrol
        type: bool

      - id: 2
        name: ros2_bridge
        type: bool

      - id: 3
        name: mavros
        type: bool

      - id: 4
        name: bridge_mavros
        type: bool

  ScenarioRuntime:
    unknown_fields: allow
    fields:
      - id: 1
        name: enabled
        type: bool

      - id: 2
        name: world
        type: ScenarioWorld

  ScenarioWorld:
    unknown_fields: allow
    fields:
      - id: 1
        name: mode
        type: string

      - id: 2
        name: map
        type: string

  Conditions:
    unknown_fields: allow
    fields:
      - id: 1
        name: time_of_day
        type: TimeOfDay

      - id: 2
        name: weather
        type: Weather

  TimeOfDay:
    unknown_fields: allow
    fields:
      - id: 1
        name: enabled
        type: bool
        default: false

      - id: 2
        name: start
        type: datetime

      - id: 3
        name: datetime
        type: datetime

      - id: 4
        name: latitude
        type: float

      - id: 5
        name: longitude
        type: float

      - id: 6
        name: move_sun
        type: bool

      - id: 7
        name: celestial_clock_speed
        type: float

      - id: 8
        name: update_interval_secs
        type: int

      - id: 9
        name: dst
        type: bool

  Weather:
    unknown_fields: allow
    fields:
      - id: 1
        name: enabled
        type: bool
        default: true

      - id: 2
        name: preset
        type: oneof<WeatherPreset, string>
        default: rain

      - id: 3
        name: cloud_coverage
        type: float
        default: 1.0

      - id: 4
        name: rain
        type: float
        default: 0.7

      - id: 5
        name: fog
        type: float
        default: 0.25

      - id: 6
        name: wind
        type: float
        default: 0.45

      - id: 7
        name: overrides
        type: map<string, float>

  ObjectClutter:
    unknown_fields: allow
    fields:
      - id: 1
        name: enabled
        type: bool

      - id: 2
        name: placements
        type: repeated<SceneObject>

  RandomSpawnVolume:
    unknown_fields: allow
    fields:
      - id: 1
        name: id
        type: string

      - id: 2
        name: asset_pack
        type: string

      - id: 3
        name: asset
        type: string

      - id: 4
        name: transform
        type: Transform

      - id: 5
        name: count
        type: int

      - id: 6
        name: random_yaw
        type: bool

      - id: 7
        name: min_clearance_m
        type: float

      - id: 8
        name: spawn_inset_m
        type: float

  Vehicle:
    description: Vehicle spawned in the simulator and bound to an autonomy stack.
    unknown_fields: allow
    fields:
      - id: 1
        name: id
        type: string

      - id: 2
        name: name
        type: string

      - id: 3
        name: runtime_name
        type: string

      - id: 4
        name: vehicle_type
        type: catalog_ref<vehicle_model>

      - id: 5
        name: vehicle_type_id
        type: catalog_ref<vehicle_model>

      - id: 6
        name: model_id
        type: catalog_ref<vehicle_model>

      - id: 7
        name: sensor_profile
        type: string

      - id: 8
        name: start
        type: Transform

      - id: 9
        name: spawn
        type: Transform

      - id: 10
        name: transform
        type: Transform

      - id: 11
        name: ros_domain_id
        type: int

      - id: 12
        name: sensors
        type: map<string, any>

      - id: 13
        name: cameras
        type: map<string, any>

      - id: 14
        name: components
        type: map<string, any>

      - id: 15
        name: connection
        type: VehicleConnection

  VehicleConnection:
    unknown_fields: allow
    fields:
      - id: 1
        name: autopilot_host
        type: string

      - id: 2
        name: udp_port
        type: int

      - id: 3
        name: tcp_port
        type: int

      - id: 4
        name: control_port
        type: int

      - id: 5
        name: editor_udp_port
        type: int

      - id: 6
        name: editor_control_port
        type: int

      - id: 7
        name: mavros_tcp_port
        type: int

      - id: 8
        name: mavros_udp_port
        type: int

      - id: 9
        name: mavros_local_port
        type: int

      - id: 10
        name: mavros_fcu_url
        type: string

  SensorProfile:
    description: Generator-owned vehicle sensor profile shape.
    unknown_fields: allow
    fields:
      - id: 1
        name: sensors
        type: map<string, any>

      - id: 2
        name: cameras
        type: map<string, any>

      - id: 3
        name: description
        type: string

  SceneObject:
    unknown_fields: allow
    fields:
      - id: 1
        name: id
        type: string

      - id: 2
        name: asset_pack
        type: string

      - id: 3
        name: asset
        type: string

      - id: 4
        name: transform
        type: Transform

  Transform:
    unknown_fields: allow
    fields:
      - id: 1
        name: frame
        type: oneof<CoordinateFrameConvention, string>

      - id: 2
        name: x
        type: float

      - id: 3
        name: y
        type: float

      - id: 4
        name: z
        type: float

      - id: 5
        name: yaw
        type: float

      - id: 6
        name: pitch
        type: float

      - id: 7
        name: roll
        type: float

      - id: 8
        name: scale
        type: oneof<float, Vector3>

      - id: 9
        name: position
        type: Vector3

      - id: 10
        name: rotation
        type: Rotation

      - id: 11
        name: scale3d
        type: Vector3

  Vector3:
    unknown_fields: allow
    fields:
      - id: 1
        name: x
        type: float

      - id: 2
        name: y
        type: float

      - id: 3
        name: z
        type: float

  Rotation:
    unknown_fields: allow
    fields:
      - id: 1
        name: pitch
        type: float

      - id: 2
        name: roll
        type: float

      - id: 3
        name: yaw
        type: float

  Asset:
    unknown_fields: allow
    fields:
      - id: 1
        name: id
        type: string

      - id: 2
        name: asset_pack
        type: string

      - id: 3
        name: asset
        type: string

  AssetPack:
    unknown_fields: allow
    fields:
      - id: 1
        name: id
        type: string

      - id: 2
        name: path
        type: path

  Entity:
    unknown_fields: allow
    fields:
      - id: 1
        name: id
        type: string

      - id: 2
        name: kind
        type: string

      - id: 3
        name: type
        type: string

      - id: 4
        name: transform
        type: Transform

      - id: 5
        name: components
        type: map<string, any>

  Zone:
    unknown_fields: allow
    fields:
      - id: 1
        name: id
        type: string

      - id: 2
        name: transform
        type: Transform

      - id: 3
        name: shape
        type: map<string, any>

  Route:
    unknown_fields: allow
    fields:
      - id: 1
        name: id
        type: string

      - id: 2
        name: waypoints
        type: repeated<Transform>

  VehicleModel:
    unknown_fields: allow
    fields:
      - id: 1
        name: id
        type: string

      - id: 2
        name: aliases
        type: repeated<string>

      - id: 3
        name: runtime
        type: map<string, any>

      - id: 4
        name: airsim
        type: map<string, any>

  Metrics:
    unknown_fields: allow
    fields:
      - id: 1
        name: enabled
        type: bool

      - id: 2
        name: required
        type: bool

      - id: 3
        name: requested
        type: repeated<string>

      - id: 4
        name: collection
        type: map<string, any>

      - id: 5
        name: archive
        type: map<string, any>
